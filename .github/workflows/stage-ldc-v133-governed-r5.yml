name: Stage exact LDC v133 governed R5 successor
on:
  push:
    paths:
      - '.github/staging-r5/TRIGGER'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct exact successor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ldc-v133-r6-governed-r5
          cp -a ldc-v131-r5-governed-r4 ldc-v133-r6-governed-r5
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('ldc-v133-r6-governed-r5')
          p=root/'index.html'; s=p.read_text(encoding='utf-8')
          anchor='html[data-theme="dark"] .btn-primary  { background:#C9A84C !important; color:#1A1612 !important; }'
          insert=anchor+'\nhtml[data-theme="dark"] .rc-btn       { background:#C9A84C !important; color:#1A1612 !important; } /* v133 D-04 manual-dark contrast repair */'
          assert anchor in s
          s=s.replace(anchor,insert,1)
          s=s.replace("const APP_VERSION = 'v2.19.131-R1B-UX-ACCESS-R5'; // v131 adversarial release-binding correction; v130 D-10 safeguard inherited; protected corpus/Search/provenance/user-state semantics preserved","const APP_VERSION = 'v2.19.133-R1B-UX-ACCESS-R6'; // v133 bounded D-04 manual-dark contrast repair; v131 release binding and v130 D-10 safeguard inherited; protected corpus/Search/provenance/user-state semantics preserved",1)
          s=s.replace("|| '131'; // single authoritative public identity derived from APP_VERSION","|| '133'; // single authoritative public identity derived from APP_VERSION",1)
          s=s.replace("const SW_CACHE_VERSION = 'ldc-v2.19.131-R1B-ux-access-r5';","const SW_CACHE_VERSION = 'ldc-v2.19.133-R1B-ux-access-r6';",1)
          p.write_text(s,encoding='utf-8')
          p=root/'sw.js'; s=p.read_text(encoding='utf-8')
          s=s.replace('ldc-v2.19.131-R1B-ux-access-r5','ldc-v2.19.133-R1B-ux-access-r6').replace('v2.19.131-R1B-UX-ACCESS-R5','v2.19.133-R1B-UX-ACCESS-R6')
          p.write_text(s,encoding='utf-8')
          p=root/'offline_manifest.json'; d=json.loads(p.read_text(encoding='utf-8'))
          d['app_version']='v2.19.133-R1B-UX-ACCESS-R6'
          d['page_worker_revision']='ldc-v2.19.133-R1B-ux-access-r6'
          d['rebuild_status']='V133_R6_D04_MANUAL_DARK_CONTRAST_REPAIR__V131_RELEASE_BINDING_AND_V130_D10_SAFEGUARD_INHERITED__CORPUS_SEARCH_PROVENANCE_USER_STATE_OFFLINE_CONTENT_BINDING_UNCHANGED__PUBLIC_RELEASE_NOT_AUTHORIZED'
          d['scope']='v133 bounded D-04 manual-dark Reprendre contrast repair successor of exact v131; protected corpus, Search, provenance, user-state semantics and persistent offline content bytes are unchanged; shell/runtime cache namespaces advanced to the new successor identity.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=root/'version.json'; d=json.loads(p.read_text(encoding='utf-8'))
          d['app_version']='v2.19.133-R1B-UX-ACCESS-R6'
          d['build_date']='2026-10-01'
          d['current_release_authority']='V133_BOUNDED_D04_MANUAL_DARK_CONTRAST_REPAIR__V131_RELEASE_BINDING_AND_V130_D10_SOFTWARE_SAFEGUARD_INHERITED__D11_SAME_NAVIGATION_PASS__PHYSICAL_GATES_OPEN__PRODUCTION_NOT_AUTHORIZED'
          d['external_validation_status']='V133_INTERNAL_SUCCESSOR__D04_ROOT_CAUSE_REPAIRED_PENDING_EXACT_SERVED_REQUALIFICATION__D11_EXACT_V131_SAME_NAVIGATION_PASS_INHERITED_AS NON_MUTATED_SURFACE_EVIDENCE_ONLY__FRESH_HOSTED_PWA_IPHONE_IPAD_CONTROLLED_TEST_REQUIRED__PUBLIC_RELEASE_NOT_AUTHORIZED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          test "$(find ldc-v133-r6-governed-r5 -type f | wc -l)" -eq 248
          printf '%s\n' \
            '9e5b735e8b7c0882b428203badb1d76af68e5ce172a2d0cae1c30fd2935cf359  ldc-v133-r6-governed-r5/index.html' \
            '40876d0576b421031ae4b3b645d7d207c6a004642001fc14e661ddcf5f7e6505  ldc-v133-r6-governed-r5/offline_manifest.json' \
            '9426b0c1123291049735086aa1b17122528a156e2e26243a0317f047616432bc  ldc-v133-r6-governed-r5/sw.js' \
            'abe4b8ac6f85a7945a9ab07bc25279e4b9cec0edf418af436fa383c4fa61d148  ldc-v133-r6-governed-r5/version.json' | sha256sum -c -
          diff -qr ldc-v131-r5-governed-r4/corpus ldc-v133-r6-governed-r5/corpus
      - name: Commit isolated route if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "collection-luisa-governance"
          git config user.email "collection-luisa-governance@users.noreply.github.com"
          git add ldc-v133-r6-governed-r5
          if git diff --cached --quiet; then
            echo "Exact v133 route already staged."
          else
            git commit -m "Stage exact LDC v133 D-04 repair candidate"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Wait for GitHub Pages and verify served key bytes
        shell: bash
        run: |
          set -euo pipefail
          base='https://louisriv26.github.io/App-Test/ldc-v133-r6-governed-r5'
          for n in $(seq 1 30); do
            ok=1
            for spec in               'index.html 9e5b735e8b7c0882b428203badb1d76af68e5ce172a2d0cae1c30fd2935cf359'               'offline_manifest.json 40876d0576b421031ae4b3b645d7d207c6a004642001fc14e661ddcf5f7e6505'               'sw.js 9426b0c1123291049735086aa1b17122528a156e2e26243a0317f047616432bc'               'version.json abe4b8ac6f85a7945a9ab07bc25279e4b9cec0edf418af436fa383c4fa61d148'
            do
              set -- $spec
              got=$(curl -fsSL "$base/$1?bind=$n" | sha256sum | cut -d' ' -f1) || ok=0
              [ "$got" = "$2" ] || ok=0
            done
            [ "$ok" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
