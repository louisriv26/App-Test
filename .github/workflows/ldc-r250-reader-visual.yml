name: "R250 Reader visual orientation Repères"
on:
  push:
    branches: [qa/r248-hosted-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm --prefix /tmp/r250visual install --no-audit --no-fund playwright@1.56.1
          /tmp/r250visual/node_modules/.bin/playwright install chromium webkit --with-deps
      - name: Verify Reader visual invariants
        run: |
          NODE_PATH=/tmp/r250visual/node_modules node <<'JS'
          const {chromium,webkit}=require('playwright'),fs=require('node:fs');
          const target='https://louisriv26.github.io/App-Test/';const records=[];
          const add=(n,p,d={})=>{records.push({name:n,status:p?'PASS':'FAIL',details:d});console.log((p?'PASS ':'FAIL ')+n,JSON.stringify(d).slice(0,500))};
          (async()=>{
            for(const [engine,launcher] of [['chromium',chromium],['webkit',webkit]]){
              let browser;
              try{
                browser=await launcher.launch({headless:true});
                const ctx=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
                const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e).slice(0,260)));
                await page.goto(target,{waitUntil:'domcontentloaded',timeout:65000});
                await page.waitForFunction(()=>document.getElementById('loading')?.style.display==='none',null,{timeout:55000});
                await page.evaluate(()=>{if(document.body.classList.contains('app-state-onboarding'))finishOnboarding()});
                await page.evaluate(async()=>openEntry(23,'LDC.T23.E0013','entries'));
                await page.waitForFunction(()=>document.querySelectorAll('#reader-body .para-fragment').length===104,null,{timeout:25000});
                const original=await page.evaluate(()=>{
                  const ids=['P050','P051','P052','P058','P059'].map(x=>'LDC.T23.E0013.'+x);
                  const els=ids.map(id=>document.querySelector('.para-fragment[data-para-id="'+id+'"]'));
                  const dp=els.map(x=>x?.closest('.dp'));
                  return {ids,allFound:els.every(Boolean),classes:dp.map(x=>x?.className),
                    p58inline:!!dp[3]?.classList.contains('r245-inline-continuation'),
                    p59inline:!!dp[4]?.classList.contains('r245-inline-continuation'),
                    count:document.querySelectorAll('#reader-body .para-fragment').length,
                    showReperes:typeof showReperes==='boolean'?showReperes:null};
                });
                add(engine+'_SPEAKER_BREAK_NEGATIVE',original.allFound&&!original.p58inline&&!original.p59inline,original);
                const state=await page.evaluate(async()=>{
                  const sc=document.getElementById('reader-scroll'),f=document.querySelector('.para-fragment[data-para-id="LDC.T23.E0013.P050"]');
                  f.scrollIntoView({block:'center'});
                  const top0=sc.scrollTop,before=showReperes;
                  await toggleReperes();
                  await new Promise(ok=>setTimeout(ok,500));
                  const top1=sc.scrollTop,after=showReperes;
                  await toggleReperes();
                  await new Promise(ok=>setTimeout(ok,500));
                  return {top0,top1,top2:sc.scrollTop,before,after,restored:showReperes};
                });
                add(engine+'_REPERES_TOGGLE_AND_RESTORE',state.before!==state.after&&state.before===state.restored, state);
                await page.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));
                const dark=await page.evaluate(()=>({theme:document.documentElement.getAttribute('data-theme'),count:document.querySelectorAll('#reader-body .para-fragment').length}));
                await page.evaluate(()=>document.documentElement.setAttribute('data-theme','light'));
                const light=await page.evaluate(()=>({theme:document.documentElement.getAttribute('data-theme'),count:document.querySelectorAll('#reader-body .para-fragment').length}));
                add(engine+'_THEMES_STABLE',dark.theme==='dark'&&light.theme==='light'&&dark.count===104&&light.count===104,{dark,light});
                await page.setViewportSize({width:844,height:390});await page.waitForTimeout(450);
                const rotate=await page.evaluate(()=>({width:innerWidth,height:innerHeight,count:document.querySelectorAll('#reader-body .para-fragment').length,rect:document.getElementById('reader-scroll')?.getBoundingClientRect().toJSON(),screen:document.getElementById('screen-reader')?.classList.contains('active')}));
                add(engine+'_LANDSCAPE_READER_VISIBLE',rotate.width>rotate.height&&rotate.count===104&&rotate.rect?.height>100&&rotate.screen,{rotate});
                add(engine+'_PAGE_ERRORS',!errors.length,{errors:errors.slice(0,5)});
                await ctx.close();
              }catch(e){add(engine+'_TEST_EXCEPTION',false,{error:String(e)})}
              finally{if(browser)await browser.close()}
            }
            const summary={PASS:records.filter(x=>x.status==='PASS').length,FAIL:records.filter(x=>x.status==='FAIL').length};
            fs.writeFileSync('r250-visual.json',JSON.stringify({target,summary,records},null,2));console.log('R250_VISUAL_SUMMARY',JSON.stringify(summary));process.exit(summary.FAIL?1:0);
          })();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r250-reader-visual
          path: r250-visual.json
          if-no-files-found: warn
