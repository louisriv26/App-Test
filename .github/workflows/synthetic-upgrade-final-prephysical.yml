name: Synthetic final prephysical update qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    if: ${{ contains(github.event.head_commit.message, 'Run synthetic final prephysical update qualification') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run predecessor-to-final same-origin update simulation
        run: node synthetic-upgrade-final-prephysical.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-upgrade-final-prephysical-evidence
          path: synthetic-upgrade-final-prephysical-results.json
          if-no-files-found: error
