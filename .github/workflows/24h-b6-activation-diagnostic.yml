name: 24H B6 activation boundary diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/24h-b6-activation-diag/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact trees
        run: |
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
          test "$(git rev-parse HEAD:24h-v120-b6-blind-closure)" = "977b1d9c9475988d03aa6debb78cd9370e6e1192"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: mkdir -p qa-24h-b6-activation-diag
      - run: |
          python3 -m http.server 8088 --bind 127.0.0.1 --directory qa-24h-b6-activation-diag >/tmp/diag.log 2>&1 &
          sleep 2
      - run: node 24h-b6-activation-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 24h-b6-activation-diagnostic-evidence
          path: 24h-b6-activation-diagnostic-results.json
          if-no-files-found: warn
