name: Deploy 24H v120.3 B1 App-Test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "contains(github.event.head_commit.message, 'Trigger 24H v120.3 B1 App-Test deploy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          src="24h-v120-2-b2-core-loop-csp-style-rebind"
          dst="24h-v120-3-b1-contextual-stage-navigation"
          test -d "$src"
          test ! -e "$dst"
          mkdir "$dst"
          files=(.nojekyll apple-touch-icon.png favicon-16.png favicon-32.png favicon.ico icon-120.png icon-192.png icon-512.png icon-60.png icon-maskable-512.png index.html luisa_24_heures.html manifest.json sw.js version.json)
          for f in "${files[@]}"; do cp "$src/$f" "$dst/$f"; done
          decode_patch() { base64 -d ".github/deploy/24h-v120-3-b1-$1.diff.gz.b64" | gzip -dc > "/tmp/$1.diff"; }
          decode_patch shell
          patch "$dst/index.html" < /tmp/shell.diff
          cp "$dst/index.html" "$dst/luisa_24_heures.html"
          decode_patch manifest
          patch "$dst/manifest.json" < /tmp/manifest.diff
          decode_patch sw
          patch "$dst/sw.js" < /tmp/sw.diff
          decode_patch version
          patch "$dst/version.json" < /tmp/version.diff
          cat > /tmp/expected.sha256 <<'EOF'
          e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  24h-v120-3-b1-contextual-stage-navigation/.nojekyll
          dd8efc8111a51b98c4c93dcab7357ecc4c2d5448b8a08aa97da7381dc0b56864  24h-v120-3-b1-contextual-stage-navigation/apple-touch-icon.png
          18ea7f82b0a52d3ab2e5f89eb294fb06f0057b72f890aa66ada9e0f3ff4beaa8  24h-v120-3-b1-contextual-stage-navigation/favicon-16.png
          49d3cd0fdf71b21076d3117b352422730ebc0d0e99749ed4e3b1d230c71ed008  24h-v120-3-b1-contextual-stage-navigation/favicon-32.png
          d0b29e153e5783bfd36522c1dc9cabff9817275553b9a2db80db477a1fca53ec  24h-v120-3-b1-contextual-stage-navigation/favicon.ico
          12151620d8cf4ff5f9e8b8c4e2ecf5bdb739142613f7d41dc3d8e22d10f43f17  24h-v120-3-b1-contextual-stage-navigation/icon-120.png
          6c3f6c4771a505d06efc5f8d9f3da877bb599ec14c45509b185d0749fd83bff4  24h-v120-3-b1-contextual-stage-navigation/icon-192.png
          a0c9e8ab677750ca096adfb2748a4f4de8707b01a914faeafbf2ae94ec7da4f7  24h-v120-3-b1-contextual-stage-navigation/icon-512.png
          303a69b4d594ca2a22df35bce029cbdb8a143cbda41bbf83199b0f9ac0ea2fb4  24h-v120-3-b1-contextual-stage-navigation/icon-60.png
          2c15d684b3c37e62b342f8a2041daa0038fa2280a3c3dafea02ccd10bec4716a  24h-v120-3-b1-contextual-stage-navigation/icon-maskable-512.png
          e17883784f2ca1c5b59e08fc140fd19e95382cf3f33c20b218d88edc2aea37da  24h-v120-3-b1-contextual-stage-navigation/index.html
          e17883784f2ca1c5b59e08fc140fd19e95382cf3f33c20b218d88edc2aea37da  24h-v120-3-b1-contextual-stage-navigation/luisa_24_heures.html
          ecb7b07662dc7432f3c42f94dbbb6ba86afd228d55ae4d80ac554d3a19722e8f  24h-v120-3-b1-contextual-stage-navigation/manifest.json
          7ebe63dcf5e39becabeb03f6b8882c8c77c14a9e6223c9762c58ad8a7700cdb4  24h-v120-3-b1-contextual-stage-navigation/sw.js
          d25a61668e79f1e99a9739c58bb3f191b850628a74dc62f7bdf32cb0ceb00e23  24h-v120-3-b1-contextual-stage-navigation/version.json
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
          test "$(find "$dst" -maxdepth 1 -type f | wc -l)" -eq 15
      - name: Commit exact App-Test route and remove deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-24h-v120-3-b1.yml
          rm -f .github/deploy/24h-v120-3-b1-*.diff.gz.b64
          rm -f deploy-24h-v120-3-b1-trigger.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy frozen 24H v120.3 B1 to App-Test"
          git pull --rebase origin main
          git push origin HEAD:main
