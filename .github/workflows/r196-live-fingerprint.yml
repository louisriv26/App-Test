name: R196 App-Test live HTTP fingerprint QA
on:
  push:
    branches: [r196-app-test-build-20261014]
    paths: [.github/workflows/r196-live-fingerprint.yml]
permissions:
  contents: read
jobs:
  live-byte-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce0d18f43d2ab8fd764334aeba1fa647f78b5674
          persist-credentials: false
      - name: Compare public Pages bytes to deployed main exact files
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,time,sys,pathlib
          paths=['version.json','index.html','sw.js','offline_manifest.json','corpus/search_v2_manifest.json','corpus/search_v2_documents.json','corpus/search_v2_index.json','corpus/display_03.json','corpus/display_07.json','corpus/display_34.json','corpus/supplements.json']
          root=pathlib.Path('.')
          url='https://louisriv26.github.io/App-Test/'
          results=[]
          for attempt in range(1,7):
              results=[]
              for p in paths:
                  try:
                      req=urllib.request.Request(url+p+'?R196=ce0d18f43d2ab8fd',headers={'Cache-Control':'no-cache','User-Agent':'R196-GitHub-Hosted-QA'})
                      with urllib.request.urlopen(req,timeout=70) as resp:
                          d=resp.read()
                      exp=hashlib.sha256((root/p).read_bytes()).hexdigest()
                      got=hashlib.sha256(d).hexdigest()
                      results.append({'path':p,'match':exp==got,'bytes':len(d),'expected':exp,'got':got})
                  except Exception as e:
                      results.append({'path':p,'match':False,'error':str(e)})
              print(json.dumps({'attempt':attempt,'pass':sum(x['match'] for x in results),'total':len(paths),'results':results},ensure_ascii=False))
              if all(x['match'] for x in results):break
              if attempt<6:time.sleep(12)
          pathlib.Path('r196_http_fingerprint.json').write_text(json.dumps({'results':results},indent=2))
          if not all(x['match'] for x in results):
              sys.exit('ERROR: Pages version or content not equal to exact GitHub main commit')
          print('PASS: 11/11 public HTTP assets byte-for-byte match main R196')
          PY
      - name: Store publicly verifiable QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r196-live-fingerprint
          path: r196_http_fingerprint.json
          if-no-files-found: ignore
