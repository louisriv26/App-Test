name: Stage exact 24H v120.1 B1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-24h-v120-1-b1.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact bounded successor from production v120
        shell: bash
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          out="$(mktemp -d)"
          base="https://raw.githubusercontent.com/louisriv26/Les-24-Heures-de-la-Passion/a30064c1d62d8a8f73d741c39077c6d3de6e1b80"
          files=".nojekyll apple-touch-icon.png favicon-16.png favicon-32.png favicon.ico icon-60.png icon-120.png icon-192.png icon-512.png icon-maskable-512.png index.html luisa_24_heures.html manifest.json sw.js version.json"
          for f in $files; do
            curl --fail --location --silent --show-error "$base/$f" -o "$src/$f"
            cp "$src/$f" "$out/$f"
          done

          test "$(git hash-object "$src/index.html")" = "46ffd6f127a5cde91cd7fe70df9688b26f1be06f"
          test "$(git hash-object "$src/luisa_24_heures.html")" = "46ffd6f127a5cde91cd7fe70df9688b26f1be06f"
          test "$(git hash-object "$src/manifest.json")" = "b86839a33538a3fba6b0283155e288f83b90bd47"
          test "$(git hash-object "$src/sw.js")" = "faf9cbc6cf77396e93d446c338a3d2a7f7475058"
          test "$(git hash-object "$src/version.json")" = "33e86848281ec7ecc0fe2e5b938a9106f9382f3a"

          SRC="$src" OUT="$out" python - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,base64
          out=Path(os.environ["OUT"])
          APP='v120.1'; BUILD='B1'; SEQ=120001001
          RID='24h-v120-1-b1-20261004-visible-version-v-closure'
          STAGE='24H_V120_1_VISIBLE_VERSION_V_CLOSURE_B1'
          CACHE='v120-1-b1'

          def update_shell(p):
              s=p.read_text(encoding='utf-8')
              assert s.count("APP_VERSION.replace(/^v/,'')")==3
              s=s.replace("const APP_VERSION = 'v120';",f"const APP_VERSION = '{APP}';",1)
              s=s.replace("const BUILD_REVISION = 'B13';",f"const BUILD_REVISION = '{BUILD}';",1)
              s=s.replace("const APP_EVIDENCE_STAGE = '24H_V120_RELEASE_RECONCILIATION_UPDATE_BANNER_CLOSURE_B13';",f"const APP_EVIDENCE_STAGE = '{STAGE}';",1)
              s=s.replace("const APP_RELEASE_SEQUENCE = 120000013;",f"const APP_RELEASE_SEQUENCE = {SEQ};",1)
              s=s.replace("const APP_RELEASE_ID = '24h-v120-b13-20261003-cross-theme-update-banner-closure';",f"const APP_RELEASE_ID = '{RID}';",1)
              s=s.replace("APP_VERSION.replace(/^v/,'')","APP_VERSION")
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
              assert len(scripts)==1
              h=base64.b64encode(hashlib.sha256(scripts[0].encode()).digest()).decode()
              s,n=re.subn(r"script-src-elem 'sha256-[A-Za-z0-9+/=]+'",f"script-src-elem 'sha256-{h}'",s,count=1)
              assert n==1
              p.write_text(s,encoding='utf-8',newline='')
              return h

          h1=update_shell(out/'index.html')
          h2=update_shell(out/'luisa_24_heures.html')
          assert h1==h2
          assert (out/'index.html').read_bytes()==(out/'luisa_24_heures.html').read_bytes()
          shell_sha=hashlib.sha256((out/'index.html').read_bytes()).hexdigest()

          m=json.loads((out/'manifest.json').read_text(encoding='utf-8'))
          m['version']=APP; m['build_revision']=BUILD; m['release_sequence']=SEQ; m['release_id']=RID; m['build']=BUILD
          (out/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding='utf-8',newline='')

          p=out/'sw.js'; sw=p.read_text(encoding='utf-8')
          for a,b in [
            ("/* v120 B13 — release/state reconciliation plus update-banner contrast/touch closure; B10 activation semantics preserved unchanged. */","/* v120.1 B1 — visible public-version prefix closure; v120 runtime semantics preserved unchanged. */"),
            ("const APP_VERSION = 'v120';",f"const APP_VERSION = '{APP}';"),
            ("const BUILD_REVISION = 'B13';",f"const BUILD_REVISION = '{BUILD}';"),
            ("const RELEASE_SEQUENCE = 120000013;",f"const RELEASE_SEQUENCE = {SEQ};"),
            ("const RELEASE_ID = '24h-v120-b13-20261003-cross-theme-update-banner-closure';",f"const RELEASE_ID = '{RID}';"),
            ("const CANONICAL_SHELL_SHA256 = '765784949a85e64c8715f478a71117e10accaaff8dcf8614936a4d76bb7492dd';",f"const CANONICAL_SHELL_SHA256 = '{shell_sha}';"),
            ("const CACHE_NAME = \`\${CACHE_PREFIX}v120-b13\`;","const CACHE_NAME = \`\${CACHE_PREFIX}v120-1-b1\`;")
          ]:
              assert a in sw, a
              sw=sw.replace(a,b,1)
          p.write_text(sw,encoding='utf-8',newline='')

          p=out/'version.json'; v=json.loads(p.read_text(encoding='utf-8'))
          v['app_version']=APP
          v['build_date']='2026-10-04'
          v['cache_name']=f'scope-derived:luisa-24h-<scope-fingerprint>-{CACHE}'
          v['release_scope']='v120.1/B1 successor to exact production v120/B13. Minimal presentation correction: visible version labels now preserve the public prefix and display v120.1 instead of stripping the leading v. All devotional content, corpus, Search, provenance, personal-state schema/semantics, backup/import, native-selection, update protocol and v120 functional behavior are preserved.'
          v['real_device_status']='V120_1_B1_CANDIDATE__REAL_DEVICE_GATE_OPEN'
          v['overall_release_status']='V120_1_B1_VISIBLE_VERSION_PREFIX_CLOSURE_CANDIDATE__PRODUCTION_NOT_AUTHORIZED'
          blockers=[
            'Physical verification on App-Test that Accueil displays v120.1 and both Help/About version labels display v120.1.',
            'Installed-PWA production v120 → v120.1 update/activation and acknowledged-state preservation on required Apple devices.',
            'Live-origin exact-byte binding after any future production deployment before public promotion.'
          ]
          v['known_blockers']=blockers; v['external_open_gates']=blockers
          v['build_revision']=BUILD; v['release_sequence']=SEQ; v['release_id']=RID
          v['canonical_shell_sha256']=shell_sha
          v['pwa_update_predecessor_version']='v120'
          v['pwa_update_predecessor_zip_sha256']='bc884f780576f29c8d28d2028f2e595e44aeab4c55f7eece0a0f6a0baa0093ac'
          v['functional_freeze_status']='V120_1_B1_MINIMAL_VISIBLE_VERSION_PREFIX_CORRECTION__V120_FUNCTIONAL_RUNTIME_PRESERVED__PHYSICAL_GATE_OPEN'
          v['security_stage_status']=f'CSP3_EXACT_V120_1_B1_INLINE_BINDINGS__SERVICE_WORKER_CANONICAL_SHELL_HASH_BOUND_TO_{shell_sha.upper()}'
          v['security_inline_script_sha256_base64']=[h1]
          v['version_display_v120_1_b1']={
            'candidate':'v120.1/B1',
            'date':'2026-10-04',
            'predecessor':'exact production v120/B13 tree 4e57e407510591db3705d876f602d8c23cc87e29',
            'finding':"The underlying public identity was v120, but three user-facing labels explicitly called APP_VERSION.replace(/^v/,'') and therefore displayed 120 without the public prefix.",
            'repair':'Remove only the three prefix-stripping display transformations, advance public identity to v120.1/B1, and mechanically rebind release identity, CSP script hash, service-worker cache identity and canonical-shell hash. No content or functional behavior mutation.',
            'mutation_authority':'AUTHORIZED_BY_USER_2026-10-04_VISIBLE_VERSION_MUST_SHOW_V',
            'production_deployment_authority':'NONE',
            'physical_gate':'OPEN'
          }
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+"\n",encoding='utf-8',newline='')
          PY

          test "$(sha256sum "$out/index.html" | cut -d' ' -f1)" = "71315aadb1806819e42860f10bffd37662660ae0ab49af805f5e9a3ea9357c00"
          test "$(sha256sum "$out/luisa_24_heures.html" | cut -d' ' -f1)" = "71315aadb1806819e42860f10bffd37662660ae0ab49af805f5e9a3ea9357c00"
          test "$(sha256sum "$out/manifest.json" | cut -d' ' -f1)" = "8df261a6fc7be626f3041b811bb8479f280e40635263a4000ba5d1a23b6820b0"
          test "$(sha256sum "$out/sw.js" | cut -d' ' -f1)" = "244566a1c7e9c3e6d7952d757df10689344f21527aeb00a4017f0ca3e1aeb1ca"
          test "$(sha256sum "$out/version.json" | cut -d' ' -f1)" = "64db00644bdabe22b3aeff7b73ac463eba84c7e4a19bdda0db47c1ffd409fa9e"
          test "$(git hash-object "$out/index.html")" = "1361d21d4f17d6a118717ff1dc6c57aa4b7cfc9d"
          test "$(git hash-object "$out/manifest.json")" = "6b5f9cbc923e37ff5aa90adad66f7f5d2d21364f"
          test "$(git hash-object "$out/sw.js")" = "9960dd472d844962ea6763c35dc5a8aebd78a335"
          test "$(git hash-object "$out/version.json")" = "9ec2b1354d45a4a763a970f591a199a232b1e15d"

          route="24h-v120-1-b1-visible-version-v-closure"
          rm -rf "$route"
          mkdir "$route"
          cp "$out"/* "$route"/
          cp "$out/.nojekyll" "$route/.nojekyll"

      - name: Commit frozen App-Test candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-24h-v120-1-b1.yml
          git add 24h-v120-1-b1-visible-version-v-closure .github/workflows/stage-24h-v120-1-b1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage exact 24H v120.1 B1 visible-version prefix closure"
          git push origin HEAD:main
