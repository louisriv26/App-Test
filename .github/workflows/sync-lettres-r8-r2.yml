name: Sync Lettres R8 R2 test deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lettres-r8-r2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App-Test
        uses: actions/checkout@v4

      - name: Fetch exact Lettres R8 R2 candidate
        run: |
          rm -rf /tmp/lettres-r8-r2
          git clone --depth 1 --branch ux-lettres-v2.3-r8-r2 https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/lettres-r8-r2
          rm -rf lettres-r8-r2
          mkdir -p lettres-r8-r2
          cp -a /tmp/lettres-r8-r2/. lettres-r8-r2/
          rm -rf lettres-r8-r2/.git

      - name: Verify candidate markers
        run: |
          grep -q "shell-v2.3-r8-r2" lettres-r8-r2/index.html
          grep -q "corpus-v2.3-r8-r2" lettres-r8-r2/index.html
          grep -q "shell-v2.3-r8-r2" lettres-r8-r2/sw.js
          grep -q "corpus-v2.3-r8-r2" lettres-r8-r2/sw.js
          grep -q "fetchCorpusForStartup" lettres-r8-r2/index.html

      - name: Commit isolated test deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lettres-r8-r2
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync exact Lettres v2.3 R8 R2 test deployment"
          git push
