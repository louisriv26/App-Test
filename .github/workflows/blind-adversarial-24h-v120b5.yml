name: Blind adversarial 24H v120 B5
on:
  push:
    branches: [main]
    paths: ['.github/24h-blind-adversarial-b5/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact immutable candidate and predecessor trees
        run: |
          test "$(git rev-parse HEAD:24h-v120-b5-darkmode)" = "6fc3cd1506e25c3f706513a7624e9586b7744a7d"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/24h-blind-b5-http.log 2>&1 &
          sleep 2
      - name: Execute blind adversarial audit
        run: node audit-24h-v120b5-blind-adversarial.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-adversarial-24h-v120b5-evidence
          path: blind-24h-v120b5-audit/
          if-no-files-found: warn
