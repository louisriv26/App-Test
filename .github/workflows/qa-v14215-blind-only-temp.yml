name: LDC v142.15 independent blind-only
on:
  push:
    branches: [blind-v14215-only-temp-20261007]
permissions:
  contents: read
jobs:
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node .github/qa-v14215-blind-only.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v14215-blind-only-evidence
          path: qa-v14215-blind-only-results.json
          if-no-files-found: error
          retention-days: 3
