name: Stage exact LDC v140 Search scroll repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-search-scroll.yml'

permissions:
  contents: write

concurrency:
  group: ldc-v140-search-scroll-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App-Test
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build and bind exact v140 candidate
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          set -euo pipefail
          SRC="ldc-v139-r12-search-v21a-recert"
          DST="ldc-v140-r13-search-scroll-repair"
          EXPECTED_SRC_TREE="b9aaaa762034d9a21398bc8c242c802f59062492"
          EXPECTED_DST_TREE="fa5d57065f328351ae4d7c9fa75c50cd27fadb70"
          EXPECTED_PATCH_SHA256="d14f95257208d6a231cac3bbffbd72f46403a96a6c5e31607d45e94cebf74f66"

          test "$(git rev-parse "HEAD:$SRC")" = "$EXPECTED_SRC_TREE"

          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/v140.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/v140.patch" | sha256sum -c -
          git apply --check --directory="$DST" /tmp/v140.patch
          git apply --directory="$DST" /tmp/v140.patch

          rm -f .github/workflows/stage-ldc-v140-search-scroll.yml
          rmdir .github/workflows 2>/dev/null || true

          git add -A
          git config user.name "Collection Luisa Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stage exact LDC v140 Search scroll repair for physical testing"

          ACTUAL_TREE="$(git rev-parse "HEAD:$DST")"
          test "$ACTUAL_TREE" = "$EXPECTED_DST_TREE"

          git push origin HEAD:main
