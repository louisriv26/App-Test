name: 24H v1202 targeted qualification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qualify:
    if: "contains(github.event.head_commit.message, 'v1202 qualification marker')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/index.html)" = "cd8aff5cf4ed4f7464ae20fbfa77845007b2c5fb"
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/24h-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node .github/test_24h_v1202.js
      - if: success()
        run: |
          set -euo pipefail
          rm -f .github/test_24h_v1202.js
          rm -f .github/workflows/qualify-24h-v120-2-b1.yml
          rm -f .github/workflows/qualify-24h-v120-2-b1-r2.yml
          git add qualification-24h-v120-2-b1 .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record 24H v120.2 B1 targeted runtime qualification"
          git push origin HEAD:main

# rerun-focus-2
