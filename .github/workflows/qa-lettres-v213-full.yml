name: Full fresh QA Lettres v2.13 successor
on:
  push:
    branches: [main]
    paths: ['.github/qa-lettres-v213-full/TRIGGER']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact v2.13 candidate
        run: test "$(git rev-parse HEAD:lettres-v2.13-b1-csp-cleanup)" = "a0a2ae9f8b09fc0bac3fc0e61eaf51c66c307930"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser engines
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
      - name: Wait for public Pages to serve exact successor
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time,sys
          url='https://louisriv26.github.io/App-Test/lettres-v2.13-b1-csp-cleanup/manifest.json?bind=20261004'
          want=hashlib.sha256(open('lettres-v2.13-b1-csp-cleanup/manifest.json','rb').read()).hexdigest()
          for i in range(60):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                  data=urllib.request.urlopen(req,timeout=15).read()
                  if hashlib.sha256(data).hexdigest()==want:
                      print('PUBLIC_V213_EXACT_READY',want)
                      sys.exit(0)
              except Exception as e:
                  print('wait',i,repr(e),flush=True)
              time.sleep(5)
          raise SystemExit('public Pages did not reach exact v2.13 bytes')
          PY
      - name: Start exact-tree local server
        run: |
          python3 -m http.server 8120 --bind 127.0.0.1 >/tmp/lettres213.log 2>&1 &
          sleep 2
      - name: Run complete current-candidate regression
        run: python qa/lettres_v213_full_current.py
      - name: Prepare same-scope v2.12 predecessor server
        run: |
          rm -rf /tmp/lettres-v213-fresh-scope
          cp -a lettres-v2.12-b1-darkmode /tmp/lettres-v213-fresh-scope
          cd /tmp/lettres-v213-fresh-scope
          python3 -m http.server 8132 --bind 127.0.0.1 >/tmp/lettres213-update.log 2>&1 &
          sleep 2
      - name: Run successor falsification and update audit
        run: python qa/lettres_v213_fresh_falsification_20261004.py
      - name: Build exact deterministic candidate package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,subprocess
          src=Path('lettres-v2.13-b1-csp-cleanup')
          out=Path('/tmp/LETTRES_v2.13.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/LETTRES_v2.13_SHA256.txt').write_text(f'{sha}  LETTRES_v2.13.zip\n')
          print('PACKAGE_SHA256',sha)
          PY
      - name: Upload exact package evidence
        uses: actions/upload-artifact@v4
        with:
          name: lettres-v2.13-exact-candidate
          path: |
            /tmp/LETTRES_v2.13.zip
            /tmp/LETTRES_v2.13_SHA256.txt
          if-no-files-found: error
