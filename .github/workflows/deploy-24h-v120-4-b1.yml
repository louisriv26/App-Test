name: Deploy 24H v120.4 B1 App-Test
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "contains(github.event.head_commit.message, 'Trigger 24H v120.4 B1 App-Test deploy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact frozen v120.4 B1 candidate
        shell: bash
        run: |
          set -euo pipefail
          src="24h-v120-3-b1-contextual-stage-navigation"
          dst="24h-v120-4-b1-accessibility-semantics-reflow"
          test -d "$src"
          test ! -e "$dst"
          test "$(git hash-object "$src/index.html")" = "0d817262d4af358eb65256ee140b28ac1e350bad"
          test "$(git hash-object "$src/luisa_24_heures.html")" = "0d817262d4af358eb65256ee140b28ac1e350bad"
          test "$(git hash-object "$src/manifest.json")" = "fdc8c29e75436830db8e032be9aa58fb3b8a6dc6"
          test "$(git hash-object "$src/sw.js")" = "f452c5c7b34bb90810e42e8ea8b4e22223424b80"
          test "$(git hash-object "$src/version.json")" = "21c8220eafd3b145598dc72fe7f0eea3d7f9980a"
          mkdir "$dst"
          files=(.nojekyll apple-touch-icon.png favicon-16.png favicon-32.png favicon.ico icon-120.png icon-192.png icon-512.png icon-60.png icon-maskable-512.png index.html luisa_24_heures.html manifest.json sw.js version.json)
          for f in "${files[@]}"; do cp "$src/$f" "$dst/$f"; done
          cat .github/deploy/24h-v120-4-b1-shell.b64.* | base64 -d | gzip -dc > /tmp/shell.diff
          patch "$dst/index.html" < /tmp/shell.diff
          cp "$dst/index.html" "$dst/luisa_24_heures.html"
          cat .github/deploy/24h-v120-4-b1-manifest.b64.* | base64 -d | gzip -dc > /tmp/manifest.diff
          patch "$dst/manifest.json" < /tmp/manifest.diff
          cat .github/deploy/24h-v120-4-b1-sw.b64.* | base64 -d | gzip -dc > /tmp/sw.diff
          patch "$dst/sw.js" < /tmp/sw.diff
          cat .github/deploy/24h-v120-4-b1-version.b64.* | base64 -d | gzip -dc > /tmp/version.diff
          patch "$dst/version.json" < /tmp/version.diff
          cat > /tmp/expected.sha256 <<'EOF'
          e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  24h-v120-4-b1-accessibility-semantics-reflow/.nojekyll
          dd8efc8111a51b98c4c93dcab7357ecc4c2d5448b8a08aa97da7381dc0b56864  24h-v120-4-b1-accessibility-semantics-reflow/apple-touch-icon.png
          18ea7f82b0a52d3ab2e5f89eb294fb06f0057b72f890aa66ada9e0f3ff4beaa8  24h-v120-4-b1-accessibility-semantics-reflow/favicon-16.png
          49d3cd0fdf71b21076d3117b352422730ebc0d0e99749ed4e3b1d230c71ed008  24h-v120-4-b1-accessibility-semantics-reflow/favicon-32.png
          d0b29e153e5783bfd36522c1dc9cabff9817275553b9a2db80db477a1fca53ec  24h-v120-4-b1-accessibility-semantics-reflow/favicon.ico
          12151620d8cf4ff5f9e8b8c4e2ecf5bdb739142613f7d41dc3d8e22d10f43f17  24h-v120-4-b1-accessibility-semantics-reflow/icon-120.png
          6c3f6c4771a505d06efc5f8d9f3da877bb599ec14c45509b185d0749fd83bff4  24h-v120-4-b1-accessibility-semantics-reflow/icon-192.png
          a0c9e8ab677750ca096adfb2748a4f4de8707b01a914faeafbf2ae94ec7da4f7  24h-v120-4-b1-accessibility-semantics-reflow/icon-512.png
          303a69b4d594ca2a22df35bce029cbdb8a143cbda41bbf83199b0f9ac0ea2fb4  24h-v120-4-b1-accessibility-semantics-reflow/icon-60.png
          2c15d684b3c37e62b342f8a2041daa0038fa2280a3c3dafea02ccd10bec4716a  24h-v120-4-b1-accessibility-semantics-reflow/icon-maskable-512.png
          5c0a32431fc176fa6e2a2f1a48cbe2b504d8572c03e35c22c6608fa42a0cf65f  24h-v120-4-b1-accessibility-semantics-reflow/index.html
          5c0a32431fc176fa6e2a2f1a48cbe2b504d8572c03e35c22c6608fa42a0cf65f  24h-v120-4-b1-accessibility-semantics-reflow/luisa_24_heures.html
          c90af2c2543247dfe75fde2d7f4f13ebf169cc8578cbcba61ea49fd45cba93b3  24h-v120-4-b1-accessibility-semantics-reflow/manifest.json
          5e162805e2ea314cf0f1875dc0e6fb5f30be756dbc40674b0b13b12def7c1706  24h-v120-4-b1-accessibility-semantics-reflow/sw.js
          8674c2d2e10be1b2a83f7da597176cca254a4d38dddb4b981453dcfb296d1dc6  24h-v120-4-b1-accessibility-semantics-reflow/version.json
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
          test "$(find "$dst" -maxdepth 1 -type f | wc -l)" -eq 15
      - name: Commit immutable App-Test route and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-24h-v120-4-b1.yml
          rm -f .github/deploy/24h-v120-4-b1-*.b64.*
          rm -f deploy-24h-v120-4-b1-trigger.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy frozen 24H v120.4 B1 to App-Test"
          git pull --rebase origin main
          git push origin HEAD:main
