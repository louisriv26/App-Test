name: Verify Lettres R8 R6 CSP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compute-lettres-r8-r6-csp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact R8 R6
        run: |
          rm -rf /tmp/lettres-r8-r6
          git clone --depth 1 --branch ux-lettres-v2.3-r8-r6 https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/lettres-r8-r6

      - name: Verify exact main-script CSP digest
        run: |
          python - <<'PY'
          import re, hashlib, base64, json
          s=open('/tmp/lettres-r8-r6/index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          main=next(x for x in scripts if "const APP_VERSION = '2.3'" in x)
          actual='sha256-'+base64.b64encode(hashlib.sha256(main.encode('utf-8')).digest()).decode()
          csp=re.search(r'<meta http-equiv="Content-Security-Policy" content="([^"]+)">',s,re.I).group(1)
          script_src=re.search(r"script-src '([^']+)'",csp).group(1)
          script_elem=re.search(r"script-src-elem '([^']+)'",csp).group(1)
          out={
            'actual_main_script_hash':actual,
            'script_src_hash':script_src,
            'script_src_elem_hash':script_elem,
            'script_src_matches':actual==script_src,
            'script_src_elem_matches':actual==script_elem,
            'script_src_equals_elem':script_src==script_elem
          }
          open('lettres-r8-r6-csp-verification.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not (out['script_src_matches'] and out['script_src_elem_matches'] and out['script_src_equals_elem']):
              raise SystemExit(1)
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lettres-r8-r6-csp-verification.json
          git commit -m "Verify Lettres R8 R6 CSP hashes" || exit 0
          git push
