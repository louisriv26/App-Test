name: LDC v142.19 R22 WebKit actual-hosted highlight Mon Espace and deep-link geometry
on:
  push:
    branches: [ldc-v142-19-reader-root-height-fix-wip-20261008]
    paths:
      - '.github/workflows/ldc-v14219-r22-webkit-highlight-qa.yml'
      - '.github/ldc-v14219-r22-hosted-webkit-highlight.mjs'
permissions: {contents: read}
jobs:
  webkit-hosted-highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Actual hosted WebKit highlight-to-Mon-Espace-to-Reader navigation and real scrolling
        continue-on-error: true
        run: node .github/ldc-v14219-r22-hosted-webkit-highlight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R22-WebKit-actual-hosted-highlight-deeplink
          path: LDC_v142.19_R22_WEBKIT_MASSFINDERBETA_HOSTED_HIGHLIGHT_QA.json
          retention-days: 14
      - name: Fail closed if WebKit highlight persistence or geometry unqualified
        run: python3 -c "import json;r=json.load(open('LDC_v142.19_R22_WEBKIT_MASSFINDERBETA_HOSTED_HIGHLIGHT_QA.json'));assert r['status']=='PASS_V14219_SCOPED_HOSTED_WEBKIT_HIGHLIGHT_MON_ESPACE',r['status']"
