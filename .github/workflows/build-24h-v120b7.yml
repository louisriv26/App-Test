name: Build 24H v120 B7 transient contrast closure
on:
  push:
    branches: [main]
    paths: ['.github/24h-v120b7-build/TRIGGER']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact B6 predecessor
        run: test "$(git rev-parse HEAD:24h-v120-b6-darkmode)" = "d16b05961a5efedd63669433f8ed0947582f6f80"
      - name: Build bounded B7 successor
        run: python3 build-24h-v120b7.py
      - name: Commit immutable B7 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 24h-v120-b7-darkmode 24h-v120-b7-build-evidence.json
          git commit -m "Create 24H v120 B7 transient contrast closure candidate"
          git pull --rebase origin main
          git push origin HEAD:main
