          subprocess.run(["git","commit","-m","App-Test only: 24H v120.6 B2 exact R11 candidate"],check=True,cwd=repo)
          subprocess.run(["git","push","origin","HEAD:main"],check=True,cwd=repo)
          print("APP_TEST_STAGED",target.name)
          
