          assert not target.exists(),"already staged; refusing overwrite"
          target.mkdir()
          combined=hashlib.sha256()
          for name in sorted(files):
           data=(base/name).read_bytes()
           key="index.html" if name=="luisa_24_heures.html" else name
           if key in patch:
            lines=data.decode("utf8").splitlines(keepends=True)
            parts=[]; cur=0
            for i,j,replacement in patch[key]:
             assert cur<=i<=j<=len(lines)
             parts.extend(lines[cur:i]);parts.append(replacement);cur=j
            parts.extend(lines[cur:]);data="".join(parts).encode("utf8")
           (target/name).write_bytes(data)
           combined.update(name.encode()+b"\0"+len(data).to_bytes(8,"big")+hashlib.sha256(data).digest())
          assert combined.hexdigest()=="74d15d864126154a820eb5db49b962953131cffabcd8dd6b885f9bc14d671942","candidate bytes mismatch"
          assert (target/"index.html").read_bytes()==(target/"luisa_24_heures.html").read_bytes()
