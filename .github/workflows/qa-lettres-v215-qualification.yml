name: Close Lettres v2.15 B2 qualification
on:
  push:
    branches: [lettres-v215-qualification]
    paths: ['.github/lettres-v2.15-qualification/TRIGGER']
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind frozen B1 predecessor
        run: test "$(git rev-parse HEAD:lettres-v2.15-b1-contrast-repair)" = "3caebc39f22be6053463b5c577ab8991074a1c81"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test engines
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
          npm install --no-save axe-core
      - name: Re-derive exact B2 and bind its already-qualified tree
        run: |
          python qa/stage_lettres_v215_b2.py
          test "$LETTRES_V215_TREE" = "8521e662e8e9efbedba2db9f537bd52281754b93"
      - name: Start exact B2 server
        run: |
          python3 -m http.server 8120 --bind 127.0.0.1 >/tmp/lettres215b2.log 2>&1 &
          sleep 2
      - name: Corrected independent blind falsification challenge
        run: python qa/lettres_v215_blind_challenge_b2_20261005.py
      - name: Prepare v2.14 same-scope predecessor
        run: |
          rm -rf /tmp/lettres-v215-v214-scope
          cp -a lettres-v2.14-b1-csp-repair /tmp/lettres-v215-v214-scope
          cd /tmp/lettres-v215-v214-scope
          python3 -m http.server 8132 --bind 127.0.0.1 >/tmp/lettres215-v214.log 2>&1 &
          sleep 2
      - name: Verify v2.14 to v2.15 preservation
        run: python qa/lettres_v215_upgrade_preservation_b2_20261005.py --pre lettres-v2.14-b1-csp-repair --pre-version 2.14 --pre-cache v2.14-b1 --port 8132 --label v214
      - name: Prepare deployed v2.4 same-scope predecessor
        run: |
          rm -rf /tmp/lettres-v215-v24-scope
          cp -a lettres-r9 /tmp/lettres-v215-v24-scope
          cd /tmp/lettres-v215-v24-scope
          python3 -m http.server 8134 --bind 127.0.0.1 >/tmp/lettres215-v24.log 2>&1 &
          sleep 2
      - name: Verify v2.4 to v2.15 preservation
        run: python qa/lettres_v215_upgrade_preservation_b2_20261005.py --pre lettres-r9 --pre-version 2.4 --pre-cache v2.4-b1 --port 8134 --label v24
      - name: Re-run full visual contrast matrix on frozen tree
        run: python qa/lettres_v215_contrast_b2_20261005.py
      - name: Prove tested B2 tree is unchanged
        run: |
          ROOT_TREE="$(git write-tree)"
          NOW="$(git rev-parse "$ROOT_TREE:lettres-v2.15-b2-contrast-repair")"
          test "$NOW" = "8521e662e8e9efbedba2db9f537bd52281754b93"
          test "$NOW" = "$LETTRES_V215_TREE"
          echo "TESTED_B2_TREE=$NOW"
      - name: Build deterministic exact B2 package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          src=Path('lettres-v2.15-b2-contrast-repair');out=Path('/tmp/LETTRES_v2.15.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/LETTRES_v2.15_SHA256.txt').write_text(f'{sha}  LETTRES_v2.15.zip\n',encoding='utf-8')
          rep={
            'public_version':'2.15','build_revision':'B2',
            'candidate_tree':'8521e662e8e9efbedba2db9f537bd52281754b93',
            'package_sha256':sha,'member_count':22,
            'changed_from_v2_14':['index.html','manifest.json','sw.js'],
            'corpus_sha256':'362e763684e19d818722082b88348d912f06f434d8960e2a278db07b7f63f8ec',
            'full_regression_primary_evidence_runs':[37275815320,37276426382],
            'full_regression_status':'PASS on exact B2 tree in both runs',
            'contrast_status':'PASS','blind_challenge_status':'PASS',
            'upgrade_v214_status':'PASS','upgrade_v24_status':'PASS'
          }
          Path('/tmp/LETTRES_V2_15_MACHINE_RELEASE_REPORT.json').write_text(json.dumps(rep,indent=2),encoding='utf-8')
          print('PACKAGE_SHA256',sha)
          PY
      - name: Freeze exact qualified B2 candidate on qualification branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze qualified Lettres v2.15 B2 candidate" -- lettres-v2.15-b2-contrast-repair
          test "$(git rev-parse HEAD:lettres-v2.15-b2-contrast-repair)" = "8521e662e8e9efbedba2db9f537bd52281754b93"
          git push origin HEAD:lettres-v215-qualification
      - name: Upload exact package evidence
        uses: actions/upload-artifact@v4
        with:
          name: lettres-v2.15-b2-exact-candidate
          path: |
            /tmp/LETTRES_v2.15.zip
            /tmp/LETTRES_v2.15_SHA256.txt
            /tmp/LETTRES_V2_15_MACHINE_RELEASE_REPORT.json
            LETTRES_V2_15_CONTRAST_QUALIFICATION_2026-10-05.json
          if-no-files-found: error
