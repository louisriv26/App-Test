name: Qualify Lettres v2.15 exact candidate
on:
  push:
    branches: [lettres-v215-qualification]
    paths: ['.github/lettres-v2.15-qualification/TRIGGER']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact v2.15 candidate
        run: test "$(git rev-parse HEAD:lettres-v2.15-b1-contrast-repair)" = "3caebc39f22be6053463b5c577ab8991074a1c81"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install test engines
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
          npm install --no-save axe-core
      - name: Prove exact mutation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('lettres-v2.14-b1-csp-repair');b=Path('lettres-v2.15-b1-contrast-repair')
          A={p.relative_to(a).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in a.rglob('*') if p.is_file()}
          B={p.relative_to(b).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in b.rglob('*') if p.is_file()}
          assert set(A)==set(B) and len(B)==22,(len(A),len(B),set(A)^set(B))
          changed=sorted(k for k in A if A[k]!=B[k])
          assert changed==['index.html','manifest.json','sw.js'],changed
          assert B['corpus.json']=='362e763684e19d818722082b88348d912f06f434d8960e2a278db07b7f63f8ec'
          print('MUTATION_BOUNDARY_PASS',changed)
          print('CORPUS_SHA256',B['corpus.json'])
          PY
      - name: Start exact candidate server
        run: |
          python3 -m http.server 8120 --bind 127.0.0.1 >/tmp/lettres215.log 2>&1 &
          sleep 2
      - name: Full current-candidate regression
        run: python qa/lettres_v215_full_current.py
      - name: Full steady and stateful contrast qualification
        run: python qa/lettres_v215_contrast_20261005.py
      - name: Independent blind falsification challenge
        run: python qa/lettres_v215_blind_challenge_20261005.py
      - name: Prepare v2.14 same-scope predecessor
        run: |
          rm -rf /tmp/lettres-v215-v214-scope
          cp -a lettres-v2.14-b1-csp-repair /tmp/lettres-v215-v214-scope
          cd /tmp/lettres-v215-v214-scope
          python3 -m http.server 8132 --bind 127.0.0.1 >/tmp/lettres215-v214.log 2>&1 &
          sleep 2
      - name: Verify v2.14 to v2.15 preservation
        run: python qa/lettres_v215_upgrade_preservation_20261005.py --pre lettres-v2.14-b1-csp-repair --pre-version 2.14 --pre-cache v2.14-b1 --port 8132 --label v214
      - name: Prepare deployed v2.4 same-scope predecessor
        run: |
          rm -rf /tmp/lettres-v215-v24-scope
          cp -a lettres-r9 /tmp/lettres-v215-v24-scope
          cd /tmp/lettres-v215-v24-scope
          python3 -m http.server 8134 --bind 127.0.0.1 >/tmp/lettres215-v24.log 2>&1 &
          sleep 2
      - name: Verify v2.4 to v2.15 preservation
        run: python qa/lettres_v215_upgrade_preservation_20261005.py --pre lettres-r9 --pre-version 2.4 --pre-cache v2.4-b1 --port 8134 --label v24
      - name: Build deterministic exact candidate package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          src=Path('lettres-v2.15-b1-contrast-repair')
          out=Path('/tmp/LETTRES_v2.15.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/LETTRES_v2.15_SHA256.txt').write_text(f'{sha}  LETTRES_v2.15.zip\n',encoding='utf-8')
          report={'candidate_tree':'3caebc39f22be6053463b5c577ab8991074a1c81','package_sha256':sha,'member_count':22,'changed_members':['index.html','manifest.json','sw.js'],'corpus_sha256':'362e763684e19d818722082b88348d912f06f434d8960e2a278db07b7f63f8ec'}
          Path('/tmp/LETTRES_V2_15_MACHINE_RELEASE_REPORT.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print('PACKAGE_SHA256',sha)
          PY
      - name: Upload exact package evidence
        uses: actions/upload-artifact@v4
        with:
          name: lettres-v2.15-exact-candidate
          path: |
            /tmp/LETTRES_v2.15.zip
            /tmp/LETTRES_v2.15_SHA256.txt
            /tmp/LETTRES_V2_15_MACHINE_RELEASE_REPORT.json
            LETTRES_V2_15_CONTRAST_QUALIFICATION_2026-10-05.json
          if-no-files-found: error
