name: Stage and qualify exact 24H v120.2 B2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  stage_and_qualify:
    if: "contains(github.event.head_commit.message, 'Add B2 note')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact B2 from frozen failed B1
        shell: bash
        run: |
          set -euo pipefail
          src="24h-v120-2-b1-core-loop-closure"
          dst="24h-v120-2-b2-core-loop-csp-style-rebind"

          test "$(git hash-object "$src/index.html")" = "cd8aff5cf4ed4f7464ae20fbfa77845007b2c5fb"
          test "$(git hash-object "$src/luisa_24_heures.html")" = "cd8aff5cf4ed4f7464ae20fbfa77845007b2c5fb"
          test "$(git hash-object "$src/manifest.json")" = "3ca3e2c62b8d77385563ea83b7121ac116c172b6"
          test "$(git hash-object "$src/sw.js")" = "437dc5b11febab464fa4f899e336c74c1799fd3a"
          test "$(git hash-object "$src/version.json")" = "9dfe02c454d1c7e1aadb8c5520488326e7a83052"

          cat             .github/24h_v1202_b1_to_b2.patch.gz.b64.part1             .github/24h_v1202_b1_to_b2.patch.gz.b64.part2             > /tmp/b2.patch.b64
          test "$(sha256sum /tmp/b2.patch.b64 | cut -d' ' -f1)" = "927d414a7ced2dae41513c54f5a08df91c22c3a4cb6f5d2b4c986d27f197c33e"
          base64 -d /tmp/b2.patch.b64 > /tmp/b2.patch.gz
          test "$(sha256sum /tmp/b2.patch.gz | cut -d' ' -f1)" = "e9b6b6500aa9388bb259365dddc570faf07e165dc50cd43d4f1550cf3a56cc8a"
          gzip -dc /tmp/b2.patch.gz > /tmp/b2.patch
          test "$(sha256sum /tmp/b2.patch | cut -d' ' -f1)" = "dd17b77d21de04f11144fc373990156dafd0e572aebdbca8cb8f444ed64057f9"

          rm -rf "$dst"
          cp -a "$src" "$dst"
          (cd "$dst" && patch -p1 --fuzz=0 < /tmp/b2.patch)

          test "$(sha256sum "$dst/index.html" | cut -d' ' -f1)" = "26c212952cb8d8c099922ed910a41c4d3e9aff516741fd7c5bf0d5d00e4302a7"
          test "$(sha256sum "$dst/luisa_24_heures.html" | cut -d' ' -f1)" = "26c212952cb8d8c099922ed910a41c4d3e9aff516741fd7c5bf0d5d00e4302a7"
          test "$(sha256sum "$dst/manifest.json" | cut -d' ' -f1)" = "df05677d5ef2310656d7b87e32a5fa95d2917fa5c92b5a5a1ce30df6f8e1266c"
          test "$(sha256sum "$dst/sw.js" | cut -d' ' -f1)" = "15c3a97980c6842beaccf26e5aba7b0eb367046c8038dcefaa967343bb0308ba"
          test "$(sha256sum "$dst/version.json" | cut -d' ' -f1)" = "fc9f020cdea6e503645b5be8ccab66a2e1338f32e72a03c43b60004369ef7666"

          test "$(git hash-object "$dst/index.html")" = "4ff15b0b77429b301102ceec67dce58287751453"
          test "$(git hash-object "$dst/luisa_24_heures.html")" = "4ff15b0b77429b301102ceec67dce58287751453"
          test "$(git hash-object "$dst/manifest.json")" = "9c47603d0e865231fbd25c3b0bd21d76a280fa1d"
          test "$(git hash-object "$dst/sw.js")" = "f6002a41b4e383754304f015e60c160e71a318a9"
          test "$(git hash-object "$dst/version.json")" = "8fe406a7493c0e34c9181d17d9f0219c0dfef962"

          cmp -s "$dst/index.html" "$dst/luisa_24_heures.html"

          # Protected ten static files remain exact.
          test "$(git hash-object "$dst/.nojekyll")" = "e69de29bb2d1d6434b8b29ae775ad8c2e48c5391"
          test "$(git hash-object "$dst/apple-touch-icon.png")" = "7b3a09fd4318a12e024219098475fbd28249c557"
          test "$(git hash-object "$dst/favicon-16.png")" = "1e484e9ccb82914bd480ca3b97357f897b284adb"
          test "$(git hash-object "$dst/favicon-32.png")" = "fadf7a05ea8b41061003270cb7cabc2f4ed59f13"
          test "$(git hash-object "$dst/favicon.ico")" = "e09991d1c3609b6fc460846ed37623fce6186ba6"
          test "$(git hash-object "$dst/icon-60.png")" = "6aeaa24c1f7ad63633b963a65a8df18167ae082c"
          test "$(git hash-object "$dst/icon-120.png")" = "716f5ed7fb42a866b802b9f03795a8145302134b"
          test "$(git hash-object "$dst/icon-192.png")" = "60340d238ec735ba4dbb84d376ee684ce06cba79"
          test "$(git hash-object "$dst/icon-512.png")" = "79c026a441d6fd6a5a7c07619eed2f82fc6f1a44"
          test "$(git hash-object "$dst/icon-maskable-512.png")" = "cace8615d782f7975f823cf76d76826e245bd02b"

      - name: Verify exact CSP and syntax
        shell: bash
        run: |
          set -euo pipefail
          dst="24h-v120-2-b2-core-loop-csp-style-rebind"
          python3 - "$dst/index.html" <<'PY'
          import pathlib,re,hashlib,base64,sys,json
          p=pathlib.Path(sys.argv[1])
          s=p.read_text(encoding="utf-8")
          styles=re.findall(r'<style[^>]*>(.*?)</style>',s,re.S|re.I)
          assert len(styles)==4
          actual=[base64.b64encode(hashlib.sha256(x.encode()).digest()).decode() for x in styles]
          csp=re.search(r'<meta http-equiv="Content-Security-Policy" content="([^"]+)"',s).group(1)
          declared=re.findall(r"'sha256-([A-Za-z0-9+/=]+)'",re.search(r'style-src-elem ([^;]+)',csp).group(1))
          assert actual==declared,(actual,declared)
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          assert len(scripts)==1
          sh=base64.b64encode(hashlib.sha256(scripts[0].encode()).digest()).decode()
          assert sh==re.search(r"script-src-elem 'sha256-([A-Za-z0-9+/=]+)'",csp).group(1)
          assert actual[1]=="o1LZ1pahCvyu5Wmp8zXJXB8uZxJXy7oc+Dz8Aik6jhU="
          assert "const BUILD_REVISION = 'B2';" in s
          assert "const APP_RELEASE_SEQUENCE = 120002002;" in s
          assert "J’ai médité cette Heure" in s
          assert "Continuer sans marquer" in s
          pathlib.Path("/tmp/b2-app.js").write_text(scripts[0],encoding="utf-8")
          pathlib.Path("/tmp/b2-csp.json").write_text(json.dumps({"style_hashes":actual,"script_hash":sh},indent=2)+"\n")
          PY
          node --check /tmp/b2-app.js
          node --check "$dst/sw.js"

      - name: Run targeted Chromium qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          cd "$GITHUB_WORKSPACE"
          sed             -e 's#24h-v120-2-b1-core-loop-closure#24h-v120-2-b2-core-loop-csp-style-rebind#g'             -e 's#v120.2/B1#v120.2/B2#g'             -e 's#qualification-24h-v120-2-b1#qualification-24h-v120-2-b2#g'             .github/test_24h_v1202.js > /tmp/test_24h_v1202_b2.js

          rm -rf qualification-24h-v120-2-b2
          mkdir qualification-24h-v120-2-b2
          cp /tmp/b2-csp.json qualification-24h-v120-2-b2/CSP_BINDING.json

          python3 -m http.server 8765 >/tmp/24h-b2-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node /tmp/test_24h_v1202_b2.js

          python3 - <<'PY'
          import json
          p="qualification-24h-v120-2-b2/TARGETED_RUNTIME.json"
          d=json.load(open(p))
          assert d["status"]=="PASS",d
          assert len(d["cases"])==4
          for c in d["cases"]:
              assert c["status"]=="PASS",c
              f=c["checks"]["recovery_focus"]
              assert f["active"] and f["focusVisible"] and float(f["width"].replace("px",""))>=3
          PY

          cat > qualification-24h-v120-2-b2/STAGING.json <<'EOF'
          {
            "candidate": "v120.2/B2",
            "release_sequence": 120002002,
            "release_id": "24h-v120-2-b2-20261005-core-loop-csp-style-rebind",
            "predecessor_failed_candidate": "v120.2/B1",
            "predecessor_failed_run_id": 37332458884,
            "root_cause": "B1 modified inline style block 2 but retained the predecessor CSP style hash, causing Chromium to block the intended focus/style rules.",
            "shell_sha256": "26c212952cb8d8c099922ed910a41c4d3e9aff516741fd7c5bf0d5d00e4302a7",
            "release_package_sha256": "b40a6b6f8375026ef4945eeb83a9031be140838cff244a52608723a8f51e8ada",
            "release_package_size": 2006943,
            "scope": "B1 core-loop semantics unchanged; exact CSP style binding repaired and candidate identity mechanically advanced.",
            "production_deployment_authority": "NONE",
            "physical_gate": "OPEN"
          }
          EOF

      - name: Commit qualified B2 route and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-24h-v120-2-b2.yml
          rm -f .github/24h_v1202_b1_to_b2.patch.gz.b64.part*
          rm -f .github/24h_v1202_exact.patch.gz.b64.part*
          rm -f .github/24h_v1202_patch.part*.b64
          rm -f .github/workflows/stage-24h-v120-2-b1.yml
          rm -f .github/workflows/qualify-24h-v120-2-b1.yml
          rm -f .github/workflows/qualify-24h-v120-2-b1-r2.yml
          rm -f .github/test_24h_v1202.js
          rm -f v1202.txt note-1202.txt note-b2.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage qualified 24H v120.2 B2 core-loop candidate"
          git push origin HEAD:main
