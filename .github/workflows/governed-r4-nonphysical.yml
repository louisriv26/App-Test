name: Governed R4 nonphysical qualification

on:
  push:
    paths:
      - '.github/qualification-r4/TRIGGER'

permissions:
  contents: read

jobs:
  real-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact governed real-origin qualification
        run: node governed-r4-real-origin.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-r4-real-origin-evidence
          path: real-origin-final-prephysical-results.json
          if-no-files-found: error

  persistent-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run persistent close-reopen and cold-offline qualification
        run: node governed-r4-persistent-cold.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-r4-persistent-cold-evidence
          path: persistent-cold-final-prephysical-results.json
          if-no-files-found: error

  update-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run same-origin predecessor to exact candidate update
        run: node governed-r4-synthetic-upgrade.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-r4-update-evidence
          path: synthetic-upgrade-final-prephysical-results.json
          if-no-files-found: error

  ldc-d04-d11:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact same-navigation D-04 D-11 and full offline campaign
        run: node governed-r4-ldc-d04-d11.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-r4-ldc-d04-d11-evidence
          path: governed-r4-ldc-d04-d11-results.json
          if-no-files-found: error
