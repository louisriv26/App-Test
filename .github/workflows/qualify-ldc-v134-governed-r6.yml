name: Qualify exact LDC v134 governed R6 successor
on:
  push:
    paths:
      - '.github/qualification-r6/TRIGGER'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Wait for exact GitHub Pages index bytes
        shell: bash
        run: |
          set -euo pipefail
          url='https://louisriv26.github.io/App-Test/ldc-v134-r7-governed-r6/index.html'
          exp=$(sha256sum ldc-v134-r7-governed-r6/index.html | cut -d' ' -f1)
          ok=0
          for i in $(seq 1 60); do
            got=$(curl -fsSL "$url?bind=$i" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$exp" ]; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Full served-byte parity
        shell: bash
        run: |
          set -euo pipefail
          base='https://louisriv26.github.io/App-Test/ldc-v134-r7-governed-r6'
          bad=0
          while IFS= read -r -d '' f; do
            rel="${f#ldc-v134-r7-governed-r6/}"
            [ "$rel" = ".nojekyll" ] && continue
            exp=$(sha256sum "$f"|cut -d' ' -f1)
            got=$(curl -fsSL "$base/$rel?fullbind=1"|sha256sum|cut -d' ' -f1) || { echo "FETCH_FAIL $rel"; bad=1; continue; }
            [ "$exp" = "$got" ] || { echo "HASH_FAIL $rel $exp $got"; bad=1; }
          done < <(find ldc-v134-r7-governed-r6 -type f -print0)
          test "$bad" -eq 0
      - name: Active release metadata staleness scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'OPEN__V131_EXACT_CANDIDATE|LDC_V131_R5_ADVERSARIAL_RELEASE_BINDING_CORRECTION_PRE_PHYSICAL|NOT_AUTHORIZED__V131_PRE_PHYSICAL_STATIC_AND_PACKAGE_QUALIFICATION_ONLY|shell-v2\.19\.131-R1B-ux-access-r5|runtime-v2\.19\.131-R1B-ux-access-r5' ldc-v134-r7-governed-r6
          grep -q "v2.19.134-R1B-UX-ACCESS-R7" ldc-v134-r7-governed-r6/index.html
          grep -q "ldc-v2.19.134-R1B-ux-access-r7" ldc-v134-r7-governed-r6/sw.js
          grep -q "EXTERNAL_GATE__SEE_CURRENT_GOVERNANCE_STATE__EXACT_V134_BYTES_REQUIRED" ldc-v134-r7-governed-r6/version.json
      - name: Real-origin D04 D11 backup cold-offline gates
        run: node governed-r6-ldc-v134.test.cjs
      - name: Production-predecessor to v134 state-preservation update gate
        run: node governed-r6-ldc-v134-upgrade.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v134-governed-r6-evidence
          path: |
            governed-r6-ldc-v134-results.json
            governed-r6-ldc-v134-upgrade-results.json
