name: Fast exact LDC v134 closure
on:
  push:
    paths:
      - '.github/qualification-r6/FAST_TRIGGER'
  workflow_dispatch:
jobs:
  d04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node governed-r6-ldc-v134-d04-fast.cjs
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node governed-r6-ldc-v134-backup-fast.cjs
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node governed-r6-ldc-v134-upgrade.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v134-upgrade-evidence
          path: governed-r6-ldc-v134-upgrade-results.json
  d11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node governed-r6-ldc-v134-d11-diag.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v134-d11-evidence
          path: ldc-v134-d11-diag.json
