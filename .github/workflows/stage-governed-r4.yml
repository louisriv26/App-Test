name: Stage governed R4 exact candidates

on:
  push:
    paths:
      - '.github/workflows/stage-governed-r4.yml'

permissions:
  contents: write

jobs:
  stage-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct exact governed routes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/staging-r4/patch.gz.b64.part{00,01,02,03,04,05,06} | base64 -d | gzip -d > /tmp/governed-r4.patch
          echo "02c0a6fd576c6a6ee3fbb8f29a5f4bdda0cf59769220eaabedce4a51b5379030  /tmp/governed-r4.patch" | sha256sum -c -

          rm -rf 24h-v119-b1-governed-r4 ldc-v131-r5-governed-r4 lettres-v2.9-b1-governed-r4
          cp -a 24h-v119-b1-prephysical 24h-v119-b1-governed-r4
          cp -a ldc-v132-b1-prephysical ldc-v131-r5-governed-r4
          cp -a lettres-v2.10-b1-prephysical lettres-v2.9-b1-governed-r4
          git apply --binary /tmp/governed-r4.patch

          test "$(find 24h-v119-b1-governed-r4 -type f | wc -l)" -eq 15
          test "$(find ldc-v131-r5-governed-r4 -type f | wc -l)" -eq 248
          test "$(find lettres-v2.9-b1-governed-r4 -type f | wc -l)" -eq 22

          cat > /tmp/key.sha256 <<'EOF'
56628a5329bd708715308dc2bb41a21d4a1dcbeee03ec2cf9c657a0fa7d9309d  24h-v119-b1-governed-r4/index.html
56628a5329bd708715308dc2bb41a21d4a1dcbeee03ec2cf9c657a0fa7d9309d  24h-v119-b1-governed-r4/luisa_24_heures.html
836a0d3e73de386994e859c995d4888637ee364bd68507583c41055e8d7de642  24h-v119-b1-governed-r4/manifest.json
0eefbcdabed723839c0ce4a42d4a06ea6b5c526cd5df9357ee766dd6df8c0605  24h-v119-b1-governed-r4/sw.js
8620746b8f6987219e72168527ed1409face17ecfced9a34b57e6a92cc9a6d2b  24h-v119-b1-governed-r4/version.json
56a1e81251def926197dbdb4a422422f3e54f9b9ede5b8fcb61f38d4ac2c28ea  ldc-v131-r5-governed-r4/index.html
6f8c116ad7258f912c8f17c15a3afbfdafaa6e49a9156f477f1b6bd1512b4955  ldc-v131-r5-governed-r4/manifest.json
3817d242a171062270e6302c63abb0d650f01ee4225d548a5104c985aa955e99  ldc-v131-r5-governed-r4/offline_manifest.json
22871cfec85261fe171dce9cc30daf33cd706cbe02a0d0b7de16be0aaa1d247f  ldc-v131-r5-governed-r4/sw.js
817ee2736c29311e1ce1881c9623e5651a4d8ffa6a2a1951ff35ce7ae0489088  ldc-v131-r5-governed-r4/version.json
f7f0270b3b303ee26ac94f3c8c0168a8aea12313fb4345571a891267c3091fe7  lettres-v2.9-b1-governed-r4/index.html
6ac8e12e1f037b5920a1c274866fa393b5c49c5e52fb18cf922f92c17881ad48  lettres-v2.9-b1-governed-r4/manifest.json
1896bfac33ed411766449161cdd9aefce95c3db67970a2b8ce8652c77b4ec112  lettres-v2.9-b1-governed-r4/sw.js
EOF
          sha256sum -c /tmp/key.sha256

          find 24h-v119-b1-governed-r4 ldc-v131-r5-governed-r4 lettres-v2.9-b1-governed-r4 -type f ! -name .nojekyll -print0 | sort -z | xargs -0 sha256sum > /tmp/served-expected.sha256

      - name: Commit isolated governed routes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "collection-luisa-governance"
          git config user.email "collection-luisa-governance@users.noreply.github.com"
          git add 24h-v119-b1-governed-r4 ldc-v131-r5-governed-r4 lettres-v2.9-b1-governed-r4
          git commit -m "Stage exact governed R4 candidates: 24H v119, LDC v131, Lettres v2.9"
          git push origin HEAD:main
          echo "STAGED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bind exact served bytes on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://louisriv26.github.io/App-Test"
          expected="56628a5329bd708715308dc2bb41a21d4a1dcbeee03ec2cf9c657a0fa7d9309d"
          ready=0
          for i in $(seq 1 90); do
            got="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$base/24h-v119-b1-governed-r4/index.html?bind=$STAGED_COMMIT-$i" | sha256sum | awk '{print $1}' || true)"
            if [ "$got" = "$expected" ]; then ready=1; break; fi
            sleep 4
          done
          test "$ready" -eq 1

          failures=0
          while read -r want path; do
            url="$base/$path?bind=$STAGED_COMMIT"
            tmp="$(mktemp)"
            if ! curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$url" -o "$tmp"; then
              echo "FETCH_FAIL $path"; failures=$((failures+1)); rm -f "$tmp"; continue
            fi
            got="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
            if [ "$got" != "$want" ]; then
              echo "HASH_FAIL $path expected=$want got=$got"
              failures=$((failures+1))
            fi
          done < /tmp/served-expected.sha256
          test "$failures" -eq 0
          echo "SERVED_BYTE_BINDING=PASS"
          echo "SERVED_FILES_CHECKED=$(wc -l < /tmp/served-expected.sha256)"
