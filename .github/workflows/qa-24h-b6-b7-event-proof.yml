name: Governed 24H B6 to B7 event update proof
on:
  push:
    branches: [main]
    paths: ['.github/b6-b7-event-proof/TRIGGER']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          test "$(git rev-parse HEAD:24h-v120-b6-darkmode)" = "d16b05961a5efedd63669433f8ed0947582f6f80"
          test "$(git rev-parse HEAD:24h-v120-b7-darkmode)" = "ffa6ae0129a39d9802fce6ec5b5b1967da1efc5f"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p qa-b6-b7-eventproof
          python3 -m http.server 8096 --bind 127.0.0.1 --directory qa-b6-b7-eventproof >/tmp/b7proof.log 2>&1 &
          sleep 2
      - run: node qa-24h-b6-b7-event-proof.cjs
