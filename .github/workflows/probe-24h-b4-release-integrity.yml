name: Probe 24H B4 release integrity
on:
  push:
    branches: [main]
    paths: ['.github/24h-b4-integrity-probe/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact trees
        run: |
          test "$(git rev-parse HEAD:24h-v120-b4-darkmode)" = "fa26ec9bf92f9d5ff8551113ad43d26fda45168e"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/probe.log 2>&1 &
          sleep 2
      - run: node probe-24h-b4-release-integrity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 24h-b4-release-integrity-probe
          path: 24h-b4-integrity-probe/
          if-no-files-found: error
