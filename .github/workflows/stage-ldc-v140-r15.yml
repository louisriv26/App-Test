name: Stage exact LDC v140 R15 Search text anchor closure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-r15.yml'
permissions:
  contents: write
concurrency:
  group: stage-ldc-v140-r15
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact R15 from frozen R14
        shell: bash
        run: |
          set -euo pipefail
          SRC="ldc-v140-r14-search-scroll-repair"
          DST="ldc-v140-r15-search-scroll-text-anchor"
          test "$(git rev-parse HEAD:$SRC)" = "44da8d6b791de04e3115bf1773b3de34fc8a89be"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('ldc-v140-r15-search-scroll-text-anchor')
          idx=root/'index.html'; s=idx.read_text(encoding='utf-8')
          s=s.replace('v2.19.140-R1B-UX-ACCESS-R14','v2.19.140-R1B-UX-ACCESS-R15')
          s=s.replace('ldc-v2.19.140-R1B-ux-access-r14','ldc-v2.19.140-R1B-ux-access-r15')
          s=s.replace('v140 bounded Search vertical-scroll and query-state repair over exact deployed v139; corpus/Search payloads and algorithms preserved; Semantic V3 remains fail-closed','v140 bounded Search single-scroll repair plus R15 Search text-size anchor closure over exact R14; corpus/Search payloads and algorithms preserved; Semantic V3 remains fail-closed')
          needle="""function restoreTextSizeContext(state) {
            if(!state)return;
            const screen=document.getElementById(state.screenId);
            if(!screen||!screen.classList.contains('active'))return;
            if(state.kind==='reader'){restoreReaderSizeAnchor(state.anchor);return;}
            if(state.kind==='scroll'&&state.scroller&&state.scroller.isConnected){
              restoreScrollContext(state.scroller,state.context,state.selector,state.keyAttr||null);
            }
          }
          """
          insert=needle+"""
          // v140/R15 — Search uses one large scroll surface. Typography changes reflow the
          // filters, metadata and results together, so native browser scroll anchoring and a
          // one-frame app restore must not compete. During the bounded transaction the app
          // is the sole scroll-position authority and re-verifies the same semantic result
          // anchor over settling frames before releasing native anchoring again.
          let searchTextSizeRestoreSeq=0;
          let searchTextSizeRestoreTxn=null;
          function beginSearchTextSizeRestoreTransaction(state){
            if(!state||state.kind!=='scroll'||state.screenId!=='screen-search'||!state.scroller||!state.scroller.isConnected)return null;
            const sc=state.scroller,prior=searchTextSizeRestoreTxn&&searchTextSizeRestoreTxn.scroller===sc?searchTextSizeRestoreTxn.previousOverflowAnchor:sc.style.overflowAnchor;
            const seq=++searchTextSizeRestoreSeq;
            searchTextSizeRestoreTxn={seq,scroller:sc,previousOverflowAnchor:prior};
            sc.style.overflowAnchor='none';
            return seq;
          }
          function correctSearchTextSizeAnchor(state,seq){
            const txn=searchTextSizeRestoreTxn,sc=txn&&txn.scroller,ctx=state&&state.context;
            if(!txn||txn.seq!==seq||!sc||!sc.isConnected||state.scroller!==sc||!ctx)return false;
            let hit=null;
            if(ctx.anchorKey!=null){
              hit=[...sc.querySelectorAll(state.selector||'.result-card')].find(n=>n.getAttribute(state.keyAttr||'data-result-key')===String(ctx.anchorKey))||null;
            }
            if(hit){
              const er=sc.getBoundingClientRect(),delta=(hit.getBoundingClientRect().top-er.top)-(Number(ctx.anchorOffset)||0);
              if(Math.abs(delta)>.25)sc.scrollTop+=delta;
              return true;
            }
            sc.scrollTop=Number(ctx.scrollTop)||0;
            return false;
          }
          function restoreSearchTextSizeContextTransaction(state,seq){
            const txn=searchTextSizeRestoreTxn;
            if(!txn||txn.seq!==seq||!state||state.scroller!==txn.scroller)return;
            const sc=txn.scroller,ctx=state.context||{};
            sc.scrollTop=Number(ctx.scrollTop)||0;
            requestAnimationFrame(()=>{
              if(!searchTextSizeRestoreTxn||searchTextSizeRestoreTxn.seq!==seq)return;
              correctSearchTextSizeAnchor(state,seq);
              requestAnimationFrame(()=>{
                if(!searchTextSizeRestoreTxn||searchTextSizeRestoreTxn.seq!==seq)return;
                correctSearchTextSizeAnchor(state,seq);
                setTimeout(()=>{
                  const active=searchTextSizeRestoreTxn;
                  if(!active||active.seq!==seq)return;
                  correctSearchTextSizeAnchor(state,seq);
                  const previous=active.previousOverflowAnchor;
                  sc.style.overflowAnchor=previous;
                  requestAnimationFrame(()=>{
                    if(!searchTextSizeRestoreTxn||searchTextSizeRestoreTxn.seq!==seq)return;
                    correctSearchTextSizeAnchor(state,seq);
                    requestAnimationFrame(()=>{
                      const finalTxn=searchTextSizeRestoreTxn;
                      if(!finalTxn||finalTxn.seq!==seq)return;
                      correctSearchTextSizeAnchor(state,seq);
                      sc.style.overflowAnchor=finalTxn.previousOverflowAnchor;
                      searchTextSizeRestoreTxn=null;
                    });
                  });
                },80);
              });
            });
          }
          """
          assert needle in s
          s=s.replace(needle,insert,1)
          old="""async function setTextLevel(level) {
            if (!Object.prototype.hasOwnProperty.call(TEXT_LEVELS, level)) return;
            const context = captureTextSizeContext();
            applyTextLevel(level);
            await new Promise(requestAnimationFrame);
            restoreTextSizeContext(context);
          """
          new="""async function setTextLevel(level) {
            if (!Object.prototype.hasOwnProperty.call(TEXT_LEVELS, level)) return;
            const context = captureTextSizeContext();
            const searchTextTxn=beginSearchTextSizeRestoreTransaction(context);
            applyTextLevel(level);
            await new Promise(requestAnimationFrame);
            if(searchTextTxn!=null)restoreSearchTextSizeContextTransaction(context,searchTextTxn);
            else restoreTextSizeContext(context);
          """
          assert old in s
          s=s.replace(old,new,1)
          idx.write_text(s,encoding='utf-8')

          sw=root/'sw.js'; t=sw.read_text(encoding='utf-8')
          t=t.replace('v2.19.140-R1B-UX-ACCESS-R14','v2.19.140-R1B-UX-ACCESS-R15')
          t=t.replace('ldc-v2.19.140-R1B-ux-access-r14','ldc-v2.19.140-R1B-ux-access-r15')
          t=t.replace('shell-v2.19.140-R1B-ux-access-r14','shell-v2.19.140-R1B-ux-access-r15')
          t=t.replace('runtime-v2.19.140-R1B-ux-access-r14','runtime-v2.19.140-R1B-ux-access-r15')
          sw.write_text(t,encoding='utf-8')

          mp=root/'offline_manifest.json'; m=json.loads(mp.read_text(encoding='utf-8'))
          m['app_version']='v2.19.140-R1B-UX-ACCESS-R15'
          m['page_worker_revision']='ldc-v2.19.140-R1B-ux-access-r15'
          for k in list(m):
              if isinstance(m[k],str):
                  m[k]=m[k].replace('V140_R14','V140_R15').replace('v2.19.140-R1B-UX-ACCESS-R14','v2.19.140-R1B-UX-ACCESS-R15').replace('ldc-v2.19.140-R1B-ux-access-r14','ldc-v2.19.140-R1B-ux-access-r15')
          m['v140_r15_text_size_anchor_closure']={
            'date':'2026-10-05','classification':'BOUNDED_SEARCH_TEXT_SIZE_SEMANTIC_ANCHOR_CLOSURE',
            'predecessor_app_version':'v2.19.140-R1B-UX-ACCESS-R14','predecessor_tree':'44da8d6b791de04e3115bf1773b3de34fc8a89be',
            'predecessor_package_sha256':'3c61209cb9861873dd2b30968ee47eb11f7e60c4c13a2b6fdf084dd7b8eff4be',
            'trigger':'R14_ADVERSARIAL_QA__NORMAL_TO_XLARGE_SEARCH_RESULT_ANCHOR_RETAINED_SAME_KEY_BUT_SHIFTED_44_109375PX',
            'repair':'TEMPORARILY_DISABLE_NATIVE_OVERFLOW_ANCHORING_DURING_SEARCH_TYPOGRAPHY_REFLOW__MULTIFRAME_SEMANTIC_RESULT_KEY_OFFSET_REVERIFICATION__80MS_BOUNDED_LATE_RECHECK__RESTORE_NATIVE_ANCHORING_AFTER_STABILITY',
            'corpus_changed':False,'search_payload_changed':False,'search_algorithm_changed':False,'provenance_changed':False,'user_state_schema_changed':False,
            'production_deployment_authority':'NONE','physical_device_gate':'OPEN'}
          m['rebuild_status']='V140_R15_SEARCH_SINGLE_SCROLL_QUERY_STATE_AND_TEXT_SIZE_ANCHOR_CLOSURE__R14_LAYOUT_REPAIR_INHERITED__EXACT_R14_PREDECESSOR__CORPUS_SEARCH_PAYLOADS_ALGORITHMS_PROVENANCE_USER_DATA_UNCHANGED__SEMANTIC_V3_FAIL_CLOSED__PUBLIC_RELEASE_NOT_AUTHORIZED'
          m['scope']='v140 bounded Search presentation/navigation successor. R15 inherits the R14 single vertical Search-body scroll owner and query-state/output-reveal repair, and adds bounded semantic result-anchor stabilization for Search text-size changes. All 204 persistent offline content assets and their content binding remain unchanged; devotional corpus, Search-V2/V2.1A payloads and algorithms, provenance, user-data schemas and Semantic V3 qualification state are unchanged.'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          omsha=hashlib.sha256(mp.read_bytes()).hexdigest()

          vp=root/'version.json'; v=json.loads(vp.read_text(encoding='utf-8'))
          v['app_version']='v2.19.140-R1B-UX-ACCESS-R15'; v['page_worker_revision']='ldc-v2.19.140-R1B-ux-access-r15'; v['offline_manifest_sha256']=omsha
          v['current_release_authority']='V140_R15_SEARCH_SINGLE_SCROLL_PLUS_TEXT_SIZE_ANCHOR_CLOSURE__EXACT_R14_PREDECESSOR__SEMANTIC_V3_FAIL_CLOSED__PRODUCTION_NOT_AUTHORIZED'
          v['rebuild_status']='V140_R15_SEARCH_SINGLE_SCROLL_QUERY_STATE_AND_TEXT_SIZE_ANCHOR_CLOSURE__R14_SEARCH_LAYOUT_REPAIR_INHERITED__CORPUS_SEARCH_PAYLOADS_ALGORITHMS_PROVENANCE_USER_DATA_UNCHANGED__SEMANTIC_V3_FAIL_CLOSED__PUBLIC_RELEASE_NOT_AUTHORIZED'
          v['physical_iphone_gate']='OPEN__EXACT_V140_R15_BYTES_REQUIRED__OWNER_PHYSICAL_PASS_REQUIRED'; v['physical_ipad_gate']='OPEN__EXACT_V140_R15_BYTES_REQUIRED__OWNER_PHYSICAL_PASS_REQUIRED'
          v['stage']='LDC_V140_R15_SEARCH_SCROLL_AND_TEXT_SIZE_ANCHOR_PRE_PHYSICAL_CANDIDATE'
          v['package_state_at_freeze']='V140_R15_PRE_PHYSICAL_CANDIDATE__R14_SUPERSEDED_PRE_PHYSICAL_AFTER_ADVERSARIAL_TEXT_SIZE_ANCHOR_FAIL__R13_SUPERSEDED_PRE_APP_TEST_FOR_RELEASE_BINDING_DEFECT__EXACT_DEPLOYED_V139_PRODUCTION_LINEAGE__SINGLE_SEARCH_BODY_VERTICAL_SCROLL_OWNER__QUERY_STATE_AUTHORITY_REPAIRED__FRESH_OUTPUT_REVEAL__READER_RETURN_RESULT_ANCHOR_PRESERVED__SEARCH_TEXT_SIZE_RESULT_ANCHOR_MULTIFRAME_STABILIZATION__CORPUS_SEARCH_PAYLOADS_ALGORITHMS_USER_DATA_PROVENANCE_UNCHANGED__SEMANTIC_V3_FAIL_CLOSED__PUBLIC_DEPLOYMENT_NOT_AUTHORIZED'
          v['ux_search_scroll_v140_r15_text_size_anchor_closure']={
            'date':'2026-10-05','classification':'BOUNDED_SEARCH_TEXT_SIZE_SEMANTIC_ANCHOR_CLOSURE',
            'exact_predecessor_app_version':'v2.19.140-R1B-UX-ACCESS-R14','exact_predecessor_tree':'44da8d6b791de04e3115bf1773b3de34fc8a89be',
            'exact_predecessor_package_sha256':'3c61209cb9861873dd2b30968ee47eb11f7e60c4c13a2b6fdf084dd7b8eff4be',
            'adversarial_trigger':{'same_result_key_preserved':True,'expected_visual_offset_px':70.203125,'observed_after_xlarge_px':114.3125,'residual_delta_px':44.109375},
            'root_cause':'R14_USED_GENERIC_ONE_SHOT_POST_REFLOW_RESTORE_ON_NEW_UNIFIED_SEARCH_SCROLLER_WHILE_NATIVE_BROWSER_SCROLL_ANCHORING_REMAINED_ACTIVE__SEMANTIC_KEY_SURVIVED_BUT_VISUAL_OFFSET_WAS_NOT_STABLE_ACROSS_SETTLING_FRAMES',
            'repair':['Disable native overflow anchoring only for the bounded Search text-size transaction','Use the same stable data-result-key and captured viewport offset as app authority','Re-apply semantic offset across two animation frames, an 80ms late check, and two post-release frames','Restore the prior overflow-anchor inline state after the transaction'],
            'protected_surfaces':['all corpus payloads','all Search V2/V2.1A payloads and algorithms','source-mode semantics','provenance wording','user-data schema','persistent offline content assets and binding'],
            'production_deployment_authority':'NONE','physical_device_gate':'OPEN'}
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 - <<'PY'
          import pathlib,hashlib,json
          a=pathlib.Path('ldc-v140-r14-search-scroll-repair'); b=pathlib.Path('ldc-v140-r15-search-scroll-text-anchor')
          expected={'index.html':'86240b968dc5be3b41eb453b8e2c8d919d9ed40b836f97eee1808b528fb822f7','offline_manifest.json':'7004fd69630dfc5f77231de66e6f4196e0607d6734a668909b2d023f3eb36bfe','sw.js':'8548d60dd20889460a827645c70c2bfc1b642f2b4311766f393f9d91e42304ea','version.json':'595917cf6ebb629c65fd462c304f1f0b4ce324383abda8d13d00fa150901bfb2'}
          def fs(root): return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          x,y=fs(a),fs(b); assert len(x)==len(y)==248
          changed={p for p in x|y if x.get(p)!=y.get(p)}; assert changed==set(expected),changed
          for p,h in expected.items(): assert y[p]==h,(p,y[p],h)
          for p in x:
              if p not in expected: assert x[p]==y[p],p
          m=json.loads((b/'offline_manifest.json').read_text()); v=json.loads((b/'version.json').read_text())
          assert v['offline_manifest_sha256']==hashlib.sha256((b/'offline_manifest.json').read_bytes()).hexdigest()
          assert len(m['assets'])==204 and m['total_bytes']==114483048 and m['content_binding_sha256']=='1fb8d6d8a532806ad6a25b32250091deed174ddb54130f1b05d3da2233a05384'
          print('R15_BOUNDARY_PASS',sorted(changed))
          PY
          for f in $(find "$DST" -type f -name '*.js'); do node --check "$f" >/dev/null; done
          git add "$DST"
          fulltree="$(git write-tree)"
          subtree="$(git ls-tree "$fulltree" "$DST" | awk '{print $3}')"
          test "$subtree" = "05e1e69338b8061d7da915daa60bf3dc9f1abb18"
      - name: Commit staged R15
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-ldc-v140-r15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage exact LDC v140 R15 Search text anchor closure'
          git push origin HEAD:main
