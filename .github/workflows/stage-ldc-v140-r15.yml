name: Stage exact LDC v140 R15 Search text anchor closure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-r15.yml'
permissions:
  contents: write
concurrency:
  group: stage-ldc-v140-r15
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact R15 from frozen R14
        shell: bash
        run: |
          set -euo pipefail
          SRC="ldc-v140-r14-search-scroll-repair"
          DST="ldc-v140-r15-search-scroll-text-anchor"
          test "$(git rev-parse HEAD:$SRC)" = "44da8d6b791de04e3115bf1773b3de34fc8a89be"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          printf '%s' '' | base64 -d | gzip -d > /tmp/r15.patch
          (cd "$DST" && patch -p1 --fuzz=0 < /tmp/r15.patch)
          python3 - <<'PY'
          import pathlib,hashlib,json
          a=pathlib.Path('ldc-v140-r14-search-scroll-repair')
          b=pathlib.Path('ldc-v140-r15-search-scroll-text-anchor')
          expected={
            'index.html':'86240b968dc5be3b41eb453b8e2c8d919d9ed40b836f97eee1808b528fb822f7',
            'offline_manifest.json':'7004fd69630dfc5f77231de66e6f4196e0607d6734a668909b2d023f3eb36bfe',
            'sw.js':'8548d60dd20889460a827645c70c2bfc1b642f2b4311766f393f9d91e42304ea',
            'version.json':'595917cf6ebb629c65fd462c304f1f0b4ce324383abda8d13d00fa150901bfb2'
          }
          def fs(root): return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          x,y=fs(a),fs(b)
          assert len(x)==len(y)==248
          changed={p for p in x|y if x.get(p)!=y.get(p)}
          assert changed==set(expected),changed
          for p,h in expected.items(): assert y[p]==h,(p,y[p],h)
          for p in x:
            if p not in expected: assert x[p]==y[p],p
          for p in b.rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          m=json.loads((b/'offline_manifest.json').read_text())
          v=json.loads((b/'version.json').read_text())
          assert v['app_version']=='v2.19.140-R1B-UX-ACCESS-R15'
          assert str(v['public_version'])=='140'
          assert v['page_worker_revision']=='ldc-v2.19.140-R1B-ux-access-r15'
          assert m['app_version']==v['app_version'] and m['page_worker_revision']==v['page_worker_revision']
          assert v['offline_manifest_sha256']==hashlib.sha256((b/'offline_manifest.json').read_bytes()).hexdigest()
          assert len(m['assets'])==204 and m['total_bytes']==114483048
          assert m['content_binding_sha256']=='1fb8d6d8a532806ad6a25b32250091deed174ddb54130f1b05d3da2233a05384'
          print('R15_BOUNDARY_PASS',sorted(changed))
          PY
          for f in $(find "$DST" -type f -name '*.js'); do node --check "$f" >/dev/null; done
          git add "$DST"
          test "$(git write-tree --prefix="$DST/")" = "05e1e69338b8061d7da915daa60bf3dc9f1abb18"
      - name: Commit staged R15
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-ldc-v140-r15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage exact LDC v140 R15 Search text anchor closure'
          git push origin HEAD:main
