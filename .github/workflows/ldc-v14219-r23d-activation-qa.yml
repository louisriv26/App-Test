name: LDC v142.19 R23D explicit waiting activation diagnostic
on:
  push:
    branches:
      - ldc-v142-19-reader-root-height-fix-wip-20261008
    paths:
      - .github/workflows/ldc-v14219-r23d-activation-qa.yml
permissions:
  contents: read
jobs:
  waiting-worker-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install --no-save playwright@1.55.0
      - name: Start isolated fake site on fixed local browser origin
        run: |
          mkdir -p /tmp/ldc-r23-root
          nohup python3 .github/ldc-v14219-r23c-qa-server.py >/tmp/ldc-r23d.log 2>&1 &
      - name: Run independent v14218 to v14219 waiting-worker lifecycle diagnostic
        continue-on-error: true
        run: node .github/ldc-v14219-r23d-explicit-activation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v14219-r23d-waiting-worker-activation-report
          path: LDC_v142.19_R23D_EXPLICIT_WAITING_ACTIVATION_DIAGNOSTIC.json
          retention-days: 14
      - name: Fail closed if upgrade unavailable
        run: python3 -c "import json;x=json.load(open('LDC_v142.19_R23D_EXPLICIT_WAITING_ACTIVATION_DIAGNOSTIC.json'));assert x['status']=='PASS_SCOPED_SYNTHETIC_SAME_ROOT_OLD_TO_NEW',x['status']"
