name: Build qualify and freeze Marie v48 B3 CSP + note-placeholder closure
on:
  push:
    branches: [main]
    paths: ['.github/marie-v48b3-build/TRIGGER']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Bind exact Marie authorities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:marie-v46)" = "48c094e18494e65a45659ef16ead69f40d2c0b42"
          test "$(git rev-parse HEAD:marie-v47-b1-darkmode)" = "81acbb9f409c7c0e1695b0ab35f33dfdc4978631"

      - name: Pass 0 and Pass 1 negative control, build, integrity, protected parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re
          p=Path('marie-v47-b1-darkmode/index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='0c859f70720207d5fafb4bbc65c117266bd7e57ca249a680922e798d492927a3'
          s=p.read_text(encoding='utf-8')
          csp=re.search(r'Content-Security-Policy" content="([^"]+)"',s).group(1)
          scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)]
          styles=re.findall(r'<style[^>]*>([\s\S]*?)</style>',s,re.I)
          def token(x):return "'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'"
          sh=[token(x) for x in scripts]; sth=[token(x) for x in styles]
          assert len(scripts)==3 and len(styles)==1
          assert [x in csp for x in sh]==[True,True,False]
          assert [x in csp for x in sth]==[False]
          assert sh[2]=="'sha256-2Q0WoV5SVhziz84J3sOJae3HFTGOxDlAXJccMyqK3lc='"
          assert sth[0]=="'sha256-nOG26GjnR7tT5H/2i3jPk15+QB/5oAgDHmUslGq7Cwg='"
          print('V47_NEGATIVE_CONTROL_STATIC_CONFIRMED')
          PY
          python3 build-marie-v48b3.py
          node --check marie-v48-b3-csp-note-placeholder-closure/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re,json
          a=Path('marie-v47-b1-darkmode'); b=Path('marie-v48-b3-csp-note-placeholder-closure')
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          A={str(p.relative_to(a)):sha(p) for p in a.rglob('*') if p.is_file()}
          B={str(p.relative_to(b)):sha(p) for p in b.rglob('*') if p.is_file()}
          changed=sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k))
          assert changed==['index.html','sw.js'],changed
          for k in sorted(set(A)&set(B)):
              if k not in changed: assert A[k]==B[k],k
          old=(a/'index.html').read_text(encoding='utf-8'); new=(b/'index.html').read_text(encoding='utf-8')
          def norm(s,v):
              s=re.sub(r'(<meta http-equiv="Content-Security-Policy" content=")[^"]+(")',r'\1<CSP>\2',s,count=1)
              return s.replace("const APP_VERSION = '"+v+"';","const APP_VERSION = '<VERSION>';")
          nold=norm(old,'47'); nnew=norm(new,'48')
          addition='.note-textarea::placeholder { color: var(--muted); }'
          assert nnew.count(addition)==1
          nnew=nnew.replace(addition+'\n','',1)
          assert nold==nnew,'B3 HTML changed beyond version/CSP and authorized note-placeholder rule'
          osw=(a/'sw.js').read_text(encoding='utf-8'); nsw=(b/'sw.js').read_text(encoding='utf-8')
          assert osw.replace("const VERSION = '47';","const VERSION = '<VERSION>';")==nsw.replace("const VERSION = '48';","const VERSION = '<VERSION>';")
          csp=re.search(r'Content-Security-Policy" content="([^"]+)"',new).group(1)
          scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',new,re.I)]
          styles=re.findall(r'<style[^>]*>([\s\S]*?)</style>',new,re.I)
          tok=lambda x:"'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'"
          assert all(tok(x) in csp for x in scripts+styles)
          assert "const APP_VERSION = '48';" in new
          assert "const VERSION = '48';" in nsw
          assert new.count('.search-input::placeholder { color: var(--muted); }')==1
          assert new.count('.note-textarea::placeholder { color: var(--muted); }')==1
          assert '.search-input::placeholder, .note-textarea::placeholder' not in new
          assert sha(a/'corpus/days.json')==sha(b/'corpus/days.json')
          assert sha(a/'corpus/manifest.json')==sha(b/'corpus/manifest.json')
          assert sha(a/'corpus/migrations-v1.0.0-to-v1.0.1.json')==sha(b/'corpus/migrations-v1.0.0-to-v1.0.1.json')
          for i,x in enumerate(scripts):Path('/tmp/marie-b2-script-'+str(i)+'.js').write_text(x,encoding='utf-8')
          ev=json.loads(Path('MJV_v48_B3_BUILD_EVIDENCE.json').read_text())
          assert ev['changed_files']==['index.html','sw.js'] and ev['production_deployment_authority']=='NONE'
          print('PASS1_B3_EXACT_MINIMAL_PARITY',sha(b/'index.html'),sha(b/'sw.js'))
          PY
          for f in /tmp/marie-b2-script-*.js; do node --check "$f"; done

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/marie-http.log 2>&1 &
          python3 -m http.server 8081 --bind 127.0.0.1 >/tmp/marie-upgrade-http.log 2>&1 &
          sleep 2

      - name: Fresh browser negative control proves v47 blocker
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:390,height:844},colorScheme:'dark'});const p=await c.newPage();const errs=[];p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:8080/marie-v47-b1-darkmode/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1200);const x=await p.evaluate(()=>({app:typeof APP_VERSION==='undefined'?null:APP_VERSION,loading:document.getElementById('screen-loading').classList.contains('active'),version:document.getElementById('mobile-version').textContent,body:document.body.innerText.slice(0,100)}));if(!x.loading||x.version!=='v—'||!errs.some(e=>/content security policy|refused/i.test(e)))throw new Error('v47 negative control did not reproduce '+JSON.stringify({x,errs}));console.log('V47_BROWSER_BLOCKER_REPRODUCED',JSON.stringify(x));await c.close();await b.close()})().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Pass 2 full exact-candidate runtime and material journeys
        run: node qa-marie-v48b3-full.cjs

      - name: Pass 2 exact production v46 to B3 update persistence and offline
        run: node qa-marie-v48b3-pwa.cjs

      - name: Deterministic release package and QA evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          src=Path('marie-v48-b3-csp-note-placeholder-closure')
          z=Path('MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as f:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  zi=zipfile.ZipInfo(str(p.relative_to(src)).replace(os.sep,'/'),(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o100644<<16
                  f.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          zh=hashlib.sha256(z.read_bytes()).hexdigest()
          Path('MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE_SHA256.txt').write_text(zh+'  '+z.name+'\n')
          build=json.loads(Path('MJV_v48_B3_BUILD_EVIDENCE.json').read_text())
          run=json.loads(Path('MJV_v48_B3_RUNTIME_QA_EVIDENCE.json').read_text())
          pwa=json.loads(Path('MJV_v48_B3_PWA_UPDATE_OFFLINE_EVIDENCE.json').read_text())
          members={str(p.relative_to(src)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(x for x in src.rglob('*') if x.is_file())}
          out={'candidate':'MJV v48/B3','candidate_tree_pending_freeze':True,'deterministic_zip':z.name,'zip_sha256':zh,'zip_size':z.stat().st_size,'members':members,'build':build,'runtime_status':run['status'],'runtime_scenes':len(run['scenes']),'pwa_status':pwa['status'],'pass1':'CORRECTED & REVERIFIED','pass2':'CORRECTED & REVERIFIED','physical_gate':'OPEN','production_deployment_authority':'NONE'}
          Path('MJV_v48_B3_BUILD_QA_EVIDENCE.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('MJV_B3_ZIP',zh,z.stat().st_size,len(members))
          PY
          unzip -t MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE.zip

      - name: Freeze exact qualified B3 candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marie-v48-b3-csp-note-placeholder-closure \
            MJV_v48_B3_BUILD_EVIDENCE.json \
            MJV_v48_B3_RUNTIME_QA_EVIDENCE.json \
            MJV_v48_B3_PWA_UPDATE_OFFLINE_EVIDENCE.json \
            MJV_v48_B3_BUILD_QA_EVIDENCE.json \
            MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE.zip \
            MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE_SHA256.txt
          git commit -m "Freeze Marie v48 B3 CSP + note-placeholder closure after fresh full qualification"
          git pull --rebase origin main
          test "$(git rev-parse HEAD:marie-v47-b1-darkmode)" = "81acbb9f409c7c0e1695b0ab35f33dfdc4978631"
          git push origin HEAD:main
