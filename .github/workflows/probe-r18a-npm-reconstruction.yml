name: Probe exact R18A npm reconstruction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-r18a-npm-reconstruction.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: ''
      - name: Reconstruct package from npm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r18a-npm && cd /tmp/r18a-npm
          npm pack @huggingface/transformers@3.8.1
          tar -xzf huggingface-transformers-3.8.1.tgz
          cd package
          test "$(sha256sum package.json | cut -d' ' -f1)" = "00c02ca357bf03c801f33c9a431c0169b99c1de1e14f2134cabc902cce53d4f3"
          test "$(sha256sum dist/transformers.node.mjs | cut -d' ' -f1)" = "ee3b84624fee88b9db4b85be1fbfde1e2637957ee92eaaaaa720edbca5448e6c"
          npm install --include=optional --package-lock-only
          echo "node=$(node --version) npm=$(npm --version)"
          echo "generated_lock=$(sha256sum package-lock.json | cut -d' ' -f1)"
          echo "expected_lock=cbde5a16ae83e6ed34289efa01289a2b8680250b6cf5d5e2168933cce3a7e325"
          sha256sum package.json dist/transformers.node.mjs package-lock.json
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "cbde5a16ae83e6ed34289efa01289a2b8680250b6cf5d5e2168933cce3a7e325"
