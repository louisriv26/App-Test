name: Cross-app rendered color contrast audit
on:
  push:
    branches: [main]
    paths: ['.github/cross-app-color-contrast/TRIGGER']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install runtime
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 8094 --bind 127.0.0.1 >/tmp/cross-app-contrast.log 2>&1 &
          sleep 2
      - name: Run rendered contrast audit
        run: node qa-cross-app-color-contrast-axe-20261004.cjs
      - name: Record evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CROSS_APP_RENDERED_COLOR_CONTRAST_AUDIT_2026-10-04.json
          git commit -m "Record rendered contrast audit for Lettres and Marie"
          git pull --rebase origin main
          git push origin HEAD:main
