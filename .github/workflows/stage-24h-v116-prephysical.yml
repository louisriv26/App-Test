name: Stage exact 24H v116 prephysical
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stage:
    if: contains(github.event.head_commit.message, 'Stage exact 24H v116 prephysical') && !contains(github.event.head_commit.message, '[staged]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct exact frozen v116 from bound v115 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src /tmp/work /tmp/v115_to_v116.patch
          git clone https://github.com/louisriv26/Les-24-Heures-de-la-Passion.git /tmp/src
          git -C /tmp/src checkout 21b59f896df6b841f9144713cdf10c6e134ca1bc
          mkdir -p /tmp/work
          for f in .nojekyll apple-touch-icon.png favicon-16.png favicon-32.png favicon.ico icon-120.png icon-192.png icon-512.png icon-60.png icon-maskable-512.png index.html luisa_24_heures.html manifest.json sw.js version.json; do
            cp "/tmp/src/$f" "/tmp/work/$f"
          done
          echo '' | base64 -d | gzip -d > /tmp/v115_to_v116.patch
          patch -p2 -d /tmp/work < /tmp/v115_to_v116.patch
      - name: Verify exact v116 member bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/work')
          expected={
          '.nojekyll':'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
          'apple-touch-icon.png':'dd8efc8111a51b98c4c93dcab7357ecc4c2d5448b8a08aa97da7381dc0b56864',
          'favicon-16.png':'18ea7f82b0a52d3ab2e5f89eb294fb06f0057b72f890aa66ada9e0f3ff4beaa8',
          'favicon-32.png':'49d3cd0fdf71b21076d3117b352422730ebc0d0e99749ed4e3b1d230c71ed008',
          'favicon.ico':'d0b29e153e5783bfd36522c1dc9cabff9817275553b9a2db80db477a1fca53ec',
          'icon-120.png':'12151620d8cf4ff5f9e8b8c4e2ecf5bdb739142613f7d41dc3d8e22d10f43f17',
          'icon-192.png':'6c3f6c4771a505d06efc5f8d9f3da877bb599ec14c45509b185d0749fd83bff4',
          'icon-512.png':'a0c9e8ab677750ca096adfb2748a4f4de8707b01a914faeafbf2ae94ec7da4f7',
          'icon-60.png':'303a69b4d594ca2a22df35bce029cbdb8a143cbda41bbf83199b0f9ac0ea2fb4',
          'icon-maskable-512.png':'2c15d684b3c37e62b342f8a2041daa0038fa2280a3c3dafea02ccd10bec4716a',
          'index.html':'f14f2b606b86b3889c4b8b05c603da21d28b17d6515a2bbfc9e51d52b40db8e8',
          'luisa_24_heures.html':'f14f2b606b86b3889c4b8b05c603da21d28b17d6515a2bbfc9e51d52b40db8e8',
          'manifest.json':'9541bd8034422bf3304f9942cab5212b28ac79efb8ef2d649e2f6d7d1c216145',
          'sw.js':'f3a3b9d4e21d68aadf551082d1aab5d847458b433a46b927994445fa321099b7',
          'version.json':'7c30284343e2f42d1f06411ad960f56c053577a368862b94d1761b5819bf43c2'}
          actual_files=sorted(p.name for p in root.iterdir() if p.is_file())
          assert actual_files==sorted(expected), (actual_files,sorted(expected))
          for name,want in expected.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert got==want,(name,got,want)
              print(name,got)
          PY
      - name: Stage isolated exact route
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 24h-v116-b1-prephysical
          mkdir -p 24h-v116-b1-prephysical
          cp -a /tmp/work/. 24h-v116-b1-prephysical/
          rm -f .github/workflows/stage-24h-v116-prephysical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage exact 24H v116 prephysical [staged]"
          git push origin HEAD:main
