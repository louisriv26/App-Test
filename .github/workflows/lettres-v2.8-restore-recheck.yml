name: Lettres v2.8 restore recheck
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recheck:
    if: ${{ contains(github.event.head_commit.message, 'Run Lettres v2.8 restore recheck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize focused harness
        run: |
          printf '%s' '' | base64 -d > lettres_restore_recheck.test.cjs
          echo "a15e05a30aee933703df89c32444ade799c19229f91e6c0ae331d85411f2f521  lettres_restore_recheck.test.cjs" | sha256sum -c -
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute focused exact-origin restore recheck
        run: node lettres_restore_recheck.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lettres-v2.8-restore-recheck-evidence
          path: lettres-restore-recheck-results.json
          if-no-files-found: error
