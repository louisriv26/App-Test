name: Build qualify and freeze 24H v120 B11 state reconciliation closure
on:
  push:
    branches: [main]
    paths: ['.github/24h-b11-build/TRIGGER']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Bind exact B10 authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:24h-v120-b10-predecessor-compatible-closure)" = "2a12ff7881832645adfa41ebddd5772f3a5c406a"
          echo "42937d636f0c44a78e9969bb8410fd374784e6ef6b3d937270ccd4ed81e6adc9  24H_v120_B10_PREDECESSOR_COMPATIBLE_RELEASE.zip" | sha256sum -c -

      - name: Build bounded B11 successor
        run: python3 build-24h-v120b11.py

      - name: Pass 1 static integrity and exact protected parity
        run: |
          set -euo pipefail
          node --check 24h-v120-b11-state-reconciliation-closure/sw.js
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,re
          b10=pathlib.Path('24h-v120-b10-predecessor-compatible-closure')
          b11=pathlib.Path('24h-v120-b11-state-reconciliation-closure')
          def hs(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          a,c=hs(b10),hs(b11)
          changed=sorted(k for k in set(a)|set(c) if a.get(k)!=c.get(k))
          assert changed==['index.html','luisa_24_heures.html','manifest.json','sw.js','version.json'],changed
          # Every non-identity binary/static asset is byte-identical.
          for k in sorted(set(a)&set(c)):
              if k not in changed: assert a[k]==c[k],k
          h10=(b10/'index.html').read_text(encoding='utf-8')
          h11=(b11/'index.html').read_text(encoding='utf-8')
          assert (b11/'index.html').read_bytes()==(b11/'luisa_24_heures.html').read_bytes()
          # Normalize only release identity + CSP binding. Any other shell difference is a failure.
          def norm_html(s,rev,seq,rid,stage):
              s=re.sub(r'(<meta http-equiv="Content-Security-Policy" content=")[^"]+(")',r'\1<CSP>\2',s,count=1)
              s=s.replace("const BUILD_REVISION = '"+rev+"';","const BUILD_REVISION = '<REV>';")
              s=s.replace("const APP_RELEASE_SEQUENCE = "+str(seq)+";","const APP_RELEASE_SEQUENCE = <SEQ>;")
              s=s.replace("const APP_RELEASE_ID = '"+rid+"';","const APP_RELEASE_ID = '<RID>';")
              s=s.replace("const APP_EVIDENCE_STAGE = '"+stage+"';","const APP_EVIDENCE_STAGE = '<STAGE>';")
              return s
          n10=norm_html(h10,'B10',120000010,'24h-v120-b10-20261003-predecessor-compatible-activation-closure','24H_V120_PREDECESSOR_COMPATIBLE_ACTIVATION_CLOSURE_B10')
          n11=norm_html(h11,'B11',120000011,'24h-v120-b11-20261003-state-reconciliation-closure','24H_V120_STATE_RECONCILIATION_CLOSURE_B11')
          assert n10==n11,'B11 shell changed beyond release identity/CSP'
          # Normalize SW identity/cache/shell hash/comment. Any semantic SW change is a failure.
          s10=(b10/'sw.js').read_text(encoding='utf-8'); s11=(b11/'sw.js').read_text(encoding='utf-8')
          def norm_sw(s,rev,seq,rid,cache,sha):
              s=re.sub(r'^/\* v120 B\d+[^*]*\*/','/* <HEADER> */',s,count=1,flags=re.M)
              s=s.replace("const BUILD_REVISION = '"+rev+"';","const BUILD_REVISION = '<REV>';")
              s=s.replace("const RELEASE_SEQUENCE = "+str(seq)+";","const RELEASE_SEQUENCE = <SEQ>;")
              s=s.replace("const RELEASE_ID = '"+rid+"';","const RELEASE_ID = '<RID>';")
              s=s.replace("v120-"+cache,"v120-<CACHE>")
              s=s.replace("const CANONICAL_SHELL_SHA256 = '"+sha+"';","const CANONICAL_SHELL_SHA256 = '<SHA>';")
              return s
          assert norm_sw(s10,'B10',120000010,'24h-v120-b10-20261003-predecessor-compatible-activation-closure','b10','85d11653074dda89eaa1e45c1da6c88fc2dc9b4c738317bad0263c4b9f3c563b') == norm_sw(s11,'B11',120000011,'24h-v120-b11-20261003-state-reconciliation-closure','b11',hashlib.sha256((b11/'index.html').read_bytes()).hexdigest()), 'B11 SW semantic drift'
          v=json.loads((b11/'version.json').read_text()); m=json.loads((b11/'manifest.json').read_text())
          shell=hashlib.sha256((b11/'index.html').read_bytes()).hexdigest()
          assert v['build_revision']=='B11' and v['release_sequence']==120000011 and v['release_id']=='24h-v120-b11-20261003-state-reconciliation-closure'
          assert m['build_revision']=='B11' and m['release_sequence']==120000011 and m['release_id']==v['release_id']
          assert v['canonical_shell_sha256']==shell and shell in s11
          assert all('v120/B8' not in x for x in v['known_blockers'])
          assert all('v120/B8' not in x for x in v['external_open_gates'])
          assert 'V120_B8' not in v['functional_freeze_status']
          assert 'full_qa_20261003_b11' in v
          # Fresh exact CSP authorization for every inline script/style.
          csp=re.search(r'Content-Security-Policy" content="([^"]+)"',h11).group(1)
          tok=lambda x:"'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'"
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',h11,re.I)
          styles=re.findall(r'<style[^>]*>([\s\S]*?)</style>',h11,re.I)
          assert scripts and styles and all(tok(x) in csp for x in scripts+styles)
          pathlib.Path('/tmp/b11-main.js').write_text(max(scripts,key=len))
          print('PASS1_B11_STATIC_PARITY',changed,shell,len(scripts),len(styles))
          PY
          node --check /tmp/b11-main.js

      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/b11-http.log 2>&1 &
          sleep 2

      - name: Pass 2 fresh rendered runtime and transient contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('audit-24h-v120b7-blind-adversarial.cjs').read_text()
          s=s.replace("const CANDIDATE='24h-v120-b7-darkmode';","const CANDIDATE='24h-v120-b11-state-reconciliation-closure';")
          s=s.replace("const OUT='blind-24h-v120b7-audit';","const OUT='qualification-24h-v120b11';")
          # B11 retains the exact atomic transition repair but it is merged into the governed style block.
          s=s.replace("if(!report.static.closure_style_authorized_by_csp)hard.push('closure CSP not authorized');",
                      "if(!fs.readFileSync(CANDIDATE+'/index.html','utf8').includes('html[data-theme=\\\"dark\\\"] .integrity-btn { transition:none !important; }'))hard.push('atomic dark transition missing');")
          Path('qa-b11-broad.cjs').write_text(s)
          PY
          node qa-b11-broad.cjs
          test -f qualification-24h-v120b11/REPORT.json

      - name: Exact v119 to B11 update persistence offline qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('24h-b8-production-upgrade-offline.cjs').read_text()
          reps=[
            ('24h-v120-b8-update-activation-closure','24h-v120-b11-state-reconciliation-closure'),
            ('24h-v120-b8-20261003-update-activation-closure','24h-v120-b11-20261003-state-reconciliation-closure'),
            ('120000008','120000011'),('v120-b8','v120-b11'),('B8','B11'),('b8','b11'),
            ('http://127.0.0.1:8086/app/','http://127.0.0.1:8080/qa-24h-b11-upgrade/app/')
          ]
          for a,b in reps:s=s.replace(a,b)
          Path('qa-b11-upgrade.cjs').write_text(s)
          PY
          node qa-b11-upgrade.cjs

      - name: Two-client fail-closed and retry qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/build-qualify-freeze-24h-b10.yml').read_text()
          start=y.index("          cat > qa-b10-multiclient.cjs <<'JS'\n")
          body_start=start+len("          cat > qa-b10-multiclient.cjs <<'JS'\n")
          end=y.index("\n          JS\n          node qa-b10-multiclient.cjs",body_start)
          lines=y[body_start:end].splitlines()
          s='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          reps=[
            ('24h-v120-b10-predecessor-compatible-closure','24h-v120-b11-state-reconciliation-closure'),
            ('24h-v120-b10-20261003-predecessor-compatible-activation-closure','24h-v120-b11-20261003-state-reconciliation-closure'),
            ('120000010','120000011'),('B10','B11'),('b10','b11')
          ]
          for a,b in reps:s=s.replace(a,b)
          Path('qa-b11-multiclient.cjs').write_text(s)
          PY
          node qa-b11-multiclient.cjs

      - name: Deterministic freeze package and evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          src=pathlib.Path('24h-v120-b11-state-reconciliation-closure')
          z=pathlib.Path('24H_v120_B11_STATE_RECONCILIATION_RELEASE.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as f:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  zi=zipfile.ZipInfo(str(p.relative_to(src)).replace(os.sep,'/'),(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16
                  f.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          zh=hashlib.sha256(z.read_bytes()).hexdigest()
          pathlib.Path('24H_v120_B11_STATE_RECONCILIATION_RELEASE_SHA256.txt').write_text(zh+'  '+z.name+'\n')
          e=json.loads(pathlib.Path('24h-v120-b11-build-evidence.json').read_text())
          e.update({
            'deterministic_zip_sha256':zh,'deterministic_zip_size':z.stat().st_size,
            'broad_runtime_evidence':'qualification-24h-v120b11/REPORT.json',
            'upgrade_evidence':'24h-b11-production-upgrade-offline-results.json',
            'multiclient_evidence':'24h-v120-b11-multiclient-evidence.json',
            'qualification':'PASS_NONPHYSICAL',
            'production_deployment_authority':'NONE','physical_gate':'OPEN'
          })
          pathlib.Path('24H_v120_B11_BUILD_QA_EVIDENCE.json').write_text(json.dumps(e,indent=2)+'\n')
          print('B11_ZIP',zh,z.stat().st_size)
          PY
          unzip -t 24H_v120_B11_STATE_RECONCILIATION_RELEASE.zip

      - name: Freeze exact qualified B11 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 24h-v120-b11-state-reconciliation-closure \
            24H_v120_B11_STATE_RECONCILIATION_RELEASE.zip \
            24H_v120_B11_STATE_RECONCILIATION_RELEASE_SHA256.txt \
            24H_v120_B11_BUILD_QA_EVIDENCE.json \
            qualification-24h-v120b11/REPORT.json \
            qualification-24h-v120b11/SUMMARY.json \
            24h-b11-production-upgrade-offline-results.json \
            24h-v120-b11-multiclient-evidence.json
          git commit -m "Freeze 24H v120 B11 state reconciliation candidate after fresh qualification"
          git pull --rebase origin main
          test "$(git rev-parse HEAD:24h-v120-b10-predecessor-compatible-closure)" = "2a12ff7881832645adfa41ebddd5772f3a5c406a"
          git push origin HEAD:main
