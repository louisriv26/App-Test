name: Qualify exact 24H v120.2 B1 core loop

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qualify-24h-v120-2-b1.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact frozen route
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/index.html)" = "cd8aff5cf4ed4f7464ae20fbfa77845007b2c5fb"
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/luisa_24_heures.html)" = "cd8aff5cf4ed4f7464ae20fbfa77845007b2c5fb"
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/manifest.json)" = "3ca3e2c62b8d77385563ea83b7121ac116c172b6"
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/sw.js)" = "437dc5b11febab464fa4f899e336c74c1799fd3a"
          test "$(git hash-object 24h-v120-2-b1-core-loop-closure/version.json)" = "9dfe02c454d1c7e1aadb8c5520488326e7a83052"
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run targeted runtime
        shell: bash
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/24h-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node .github/test_24h_v1202.js
      - name: Commit evidence and remove qualification helpers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/test_24h_v1202.js
          rm -f .github/workflows/qualify-24h-v120-2-b1.yml
          git add qualification-24h-v120-2-b1 .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record 24H v120.2 B1 targeted runtime qualification"
          git push origin HEAD:main
