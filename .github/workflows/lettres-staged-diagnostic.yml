name: Lettres staged restore diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diag:
    if: ${{ contains(github.event.head_commit.message, 'Run Lettres staged restore diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize staged diagnostic
        run: |
          printf '%s' '' | base64 -d > lettres_staged_diag.test.cjs
          echo "014707c5a5c829d3f69c13f986611e2ccbc2fd96edba2337766473ddbbd2d879  lettres_staged_diag.test.cjs" | sha256sum -c -
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute bounded staged diagnostic
        run: timeout 70s node lettres_staged_diag.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lettres-staged-diagnostic-evidence
          path: lettres-staged-diagnostic-results.json
          if-no-files-found: warn
