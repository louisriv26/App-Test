name: LDC v142.18 isolated real Chrome worker-shell qualification
on:
  push:
    branches:
      - ldc-v142-18-reader-semantic-integration-wip-20261008
    paths:
      - '.github/workflows/ldc-v14218-sw-qa.yml'
      - '.github/ldc-v14218-sw-qa.mjs'
      - 'version.json'
      - 'offline_manifest.json'
      - 'sw.js'
      - 'index.html'
permissions:
  contents: write
jobs:
  worker-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.55.0
      - name: Exercise new-profile actual Chromium service-worker install and cached bytes
        id: qa
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node .github/ldc-v14218-sw-qa.mjs
      - name: Commit exact source-bound evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f LDC_v142.18_SW_ACTUAL_BROWSER_QA.json
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add LDC_v142.18_SW_ACTUAL_BROWSER_QA.json
          git commit -m "test(ldc): record v142.18 isolated Chrome worker boot evidence"
          git pull --rebase origin ldc-v142-18-reader-semantic-integration-wip-20261008
          git push origin HEAD:ldc-v142-18-reader-semantic-integration-wip-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v14218-new-profile-sw
          path: LDC_v142.18_SW_ACTUAL_BROWSER_QA.json
          if-no-files-found: warn
          retention-days: 14
      - name: Gate tested real worker installation
        run: python3 -c "import json;assert json.load(open('LDC_v142.18_SW_ACTUAL_BROWSER_QA.json'))['status']=='PASS'"
