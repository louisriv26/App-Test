name: Independent blind 24H v120.2 B2 core loop

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  blind:
    if: "contains(github.event.head_commit.message, 'Add blind note')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          r="24h-v120-2-b2-core-loop-csp-style-rebind"
          test "$(git hash-object "$r/index.html")" = "4ff15b0b77429b301102ceec67dce58287751453"
          test "$(git hash-object "$r/luisa_24_heures.html")" = "4ff15b0b77429b301102ceec67dce58287751453"
          test "$(git hash-object "$r/manifest.json")" = "9c47603d0e865231fbd25c3b0bd21d76a280fa1d"
          test "$(git hash-object "$r/sw.js")" = "f6002a41b4e383754304f015e60c160e71a318a9"
          test "$(git hash-object "$r/version.json")" = "8fe406a7493c0e34c9181d17d9f0219c0dfef962"

      - name: Independent runtime challenge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/blindpw
          cd /tmp/blindpw
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

          cat > /tmp/blind.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const BASE='http://127.0.0.1:8877/24h-v120-2-b2-core-loop-csp-style-rebind/';
          const cases=[
            ['phone-light',390,844,'light'],['phone-dark',390,844,'dark'],
            ['tablet-light',820,1180,'light'],['tablet-dark',820,1180,'dark']
          ];
          const out={candidate:'v120.2/B2',method:'independent blind challenge',cases:[],errors:[]};
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          async function tabTo(page,sel){
            for(let i=0;i<70;i++){
              if(await page.evaluate(s=>document.activeElement?.matches(s),sel)) return i;
              await page.keyboard.press('Tab');
            }
            throw new Error('tab focus not reached '+sel);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,w,h,scheme] of cases){
              const ctx=await browser.newContext({viewport:{width:w,height:h},colorScheme:scheme});
              const page=await ctx.newPage(); const errors=[]; const rec={name,checks:{}};
              page.on('pageerror',e=>errors.push('page:'+e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
              try{
                await page.goto(BASE,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>typeof state!=='undefined'&&state.view==='home');
                await page.locator('.onboarding-primary').click();
                await page.waitForFunction(()=>state.view==='reader'&&state.currentHour===1);

                rec.checks.version=await page.evaluate(()=>({v:APP_VERSION,b:BUILD_REVISION,seq:APP_RELEASE_SEQUENCE,id:APP_RELEASE_ID}));
                ok(rec.checks.version.v==='v120.2'&&rec.checks.version.b==='B2'&&rec.checks.version.seq===120002002,'identity');
                ok((await page.getByText('Vous avez déjà médité cette Heure ?',{exact:true}).count())===0,'old question present');
                ok((await page.getByText('Si vous avez oublié de la cocher à la fin.',{exact:true}).count())===0,'stale detail present');
                ok((await page.locator('[data-meditee-status-title-hour="1"]').innerText()).trim()==='Statut de l’Heure','top state title');

                const recovery='[data-meditee-action-hour="1"][data-meditee-role="recovery"]';
                await tabTo(page,recovery);
                const ring=await page.locator(recovery).evaluate(el=>{const s=getComputedStyle(el);return{active:document.activeElement===el,fv:el.matches(':focus-visible'),style:s.outlineStyle,width:s.outlineWidth,color:s.outlineColor}});
                rec.checks.focus=ring;
                ok(ring.active&&ring.fv&&ring.style==='solid'&&parseFloat(ring.width)>=3,'focus ring');

                const card=page.locator('#hourEndActions');
                await card.scrollIntoViewIfNeeded();
                rec.checks.endButtonCount=await card.locator('button').count();
                ok(rec.checks.endButtonCount===1,'duplicate end-card actions');
                const end=card.locator('[data-meditee-role="primary-end"]');
                ok((await end.innerText()).trim()==='J’ai médité cette Heure','end completion label');
                ok((await card.getByText('Réflexion et pratique',{exact:true}).count())===0,'reflection duplicate');
                ok((await card.getByText('Approfondir',{exact:true}).count())===0,'linked duplicate');

                const next=page.locator('[data-meditee-next-hour="1"]');
                ok((await next.locator('[data-meditee-next-label]').innerText()).trim()==='Continuer sans marquer','unmarked next');
                await next.click(); await page.waitForFunction(()=>state.currentHour===2);
                let st=await page.evaluate(()=>({read:state.readHours.has(1),logs:state.meditationLog.filter(x=>Number(x.hour)===1).length}));
                ok(!st.read&&st.logs===0,'unmarked navigation mutated state');

                await page.evaluate(()=>openHour(1,false)); await page.waitForFunction(()=>state.currentHour===1);
                const end2=page.locator('[data-meditee-role="primary-end"]'); await end2.scrollIntoViewIfNeeded(); await end2.focus(); await end2.click();
                await page.waitForFunction(()=>state.readHours.has(1));
                st=await page.evaluate(()=>({read:state.readHours.has(1),logs:state.meditationLog.filter(x=>Number(x.hour)===1).length,active:document.activeElement?.getAttribute('data-meditee-role')}));
                rec.checks.marked=st; ok(st.read&&st.logs===1&&st.active==='primary-end','explicit mark contract');
                ok((await end2.innerText()).trim()==='✓ Heure méditée — Retirer','marked label');
                ok((await page.locator('[data-meditee-next-hour="1"] [data-meditee-next-label]').innerText()).trim()==='Prier la 2e Heure','marked next');

                await page.reload({waitUntil:'domcontentloaded'}); await page.waitForFunction(()=>typeof state!=='undefined'&&state.view==='home');
                st=await page.evaluate(()=>({read:state.readHours.has(1),logs:state.meditationLog.filter(x=>Number(x.hour)===1).length}));
                ok(st.read&&st.logs===1,'persistence');

                await page.evaluate(()=>openHour(24,false)); await page.waitForFunction(()=>state.currentHour===24);
                ok(await page.locator('[data-meditee-action-hour="24"][data-meditee-role="primary-end"]').count()===1,'hour24 completion');
                ok(await page.locator('[data-meditee-next-hour="24"]').count()===0,'hour24 next');
                rec.checks.overflow=await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1);
                ok(rec.checks.overflow,'overflow');
                rec.checks.errors=errors; ok(errors.length===0,'runtime errors '+errors.join('|'));
                rec.status='PASS';
              }catch(e){rec.status='FAIL';rec.failure=e.message;out.errors.push(name+': '+e.message);}
              out.cases.push(rec); await ctx.close();
            }
            await browser.close(); out.status=out.errors.length?'FAIL':'PASS';
            fs.mkdirSync('qualification-24h-v120-2-b2',{recursive:true});
            fs.writeFileSync('qualification-24h-v120-2-b2/BLIND_RUNTIME.json',JSON.stringify(out,null,2)+'\n');
            console.log(JSON.stringify(out,null,2)); if(out.status!=='PASS')process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

          cd "$GITHUB_WORKSPACE"
          python3 -m http.server 8877 >/tmp/blind-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          NODE_PATH=/tmp/blindpw/node_modules node /tmp/blind.js

      - name: Record blind evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/blind-24h-v120-2-b2.yml blind-note.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record independent blind 24H v120.2 B2 qualification"
          git push origin HEAD:main
