name: 24H blind adversarial B6 verification
on:
  push:
    branches: [main]
    paths: ['.github/24h-blind-b6/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact B6 and production predecessor
        run: |
          test "$(git rev-parse HEAD:24h-v120-b6-blind-closure)" = "977b1d9c9475988d03aa6debb78cd9370e6e1192"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - name: Independent static/package audit
        run: python3 24h-blind-adversarial-b6-static.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact-byte origin
        run: |
          python3 -m http.server 8084 --bind 127.0.0.1 >/tmp/24hblindb6.log 2>&1 &
          sleep 2
      - name: Independent rendered/runtime audit
        run: node 24h-blind-adversarial-b6.cjs
      - name: Adjudicate machine findings
        run: |
          python3 - <<'PY'
          import json,sys
          s=json.load(open('24h-blind-adversarial-b6-static.json'))
          r=json.load(open('24h-blind-adversarial-b6-results.json'))
          errs=[x for x in s['findings']+r['findings'] if x.get('severity')=='error']
          warns=[x for x in s['findings']+r['findings'] if x.get('severity')=='warning']
          print('ERROR_FINDINGS',len(errs))
          print('WARNING_FINDINGS',len(warns))
          for x in errs: print(x)
          for x in warns[:100]: print('WARNING',x)
          sys.exit(1 if errs else 0)
          PY
      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 24h-blind-adversarial-b6-evidence
          path: |
            24h-blind-adversarial-b6-static.json
            24h-blind-adversarial-b6-results.json
            24h-blind-adversarial-b6-fatal.txt
          if-no-files-found: warn
