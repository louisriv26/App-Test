name: Lettres v2.4 independent blind challenge

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/blind-lettres-v24.yml'
      - 'qa/lettres_v24_blind.py'

jobs:
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare old and current production trees for update challenge
        run: |
          git clone -q https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/prod
          mkdir -p /tmp/lettres-old /tmp/lettres-new
          git -C /tmp/prod archive 56bfc0a200851955e566b7edacdc17f0d060a4ae | tar -x -C /tmp/lettres-old
          git -C /tmp/prod archive 20d29f09330818f655ddc1370cbb4f56bad957bf | tar -x -C /tmp/lettres-new
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run independent blind challenge
        run: python qa/lettres_v24_blind.py
