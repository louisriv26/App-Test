name: Verify Lettres R8 R4 CSP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-lettres-r8-r4-csp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact R8 R4
        run: |
          rm -rf /tmp/lettres-r8-r4
          git clone --depth 1 --branch ux-lettres-v2.3-r8-r4 https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/lettres-r8-r4

      - name: Verify CSP hashes independently
        run: |
          python - <<'PY'
          import re, hashlib, base64, json
          p='/tmp/lettres-r8-r4/index.html'
          s=open(p,encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          main=next(x for x in scripts if "const APP_VERSION = '2.3'" in x)
          actual='sha256-'+base64.b64encode(hashlib.sha256(main.encode('utf-8')).digest()).decode()
          csp=re.search(r'<meta http-equiv="Content-Security-Policy" content="([^"]+)">',s,re.I).group(1)
          script_src=re.search(r"script-src '([^']+)'",csp).group(1)
          script_elem=re.search(r"script-src-elem '([^']+)'",csp).group(1)
          out={
            'actual_main_script_hash':actual,
            'script_src_hash':script_src,
            'script_src_elem_hash':script_elem,
            'script_src_matches':actual==script_src,
            'script_src_elem_matches':actual==script_elem,
            'script_src_equals_elem':script_src==script_elem
          }
          open('lettres-r8-r4-csp-verification.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lettres-r8-r4-csp-verification.json
          git commit -m "Verify Lettres R8 R4 CSP hashes" || exit 0
          git push
