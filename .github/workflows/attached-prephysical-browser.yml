name: Attached prephysical browser qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    if: ${{ contains(github.event.head_commit.message, 'Run attached prephysical browser qualification') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact harness
        run: |
          printf '%s' '' | base64 -d > attached-prephysical-browser.test.cjs
          echo "b3ec588b4908c7c70d5840f3f1676d5e63ec7abb1085ba7998566a8d97bdeee6  attached-prephysical-browser.test.cjs" | sha256sum -c -
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run attached-handback prephysical browser gates
        run: node attached-prephysical-browser.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attached-prephysical-browser-evidence
          path: attached-prephysical-browser-results.json
          if-no-files-found: error
