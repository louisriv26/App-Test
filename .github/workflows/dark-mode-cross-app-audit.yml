name: Dark-mode cross-app contrast audit
on:
  push:
    paths:
      - '.github/dark-audit/TRIGGER'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node dark-mode-cross-app-audit.cjs > dark-mode-cross-app-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dark-mode-cross-app-audit
          path: dark-mode-cross-app-audit.json
