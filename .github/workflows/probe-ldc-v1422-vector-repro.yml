name: Probe LDC v142.2 vector reproducibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-ldc-v1422-vector-repro.yml'
      - 'tools/ldc_v1422_vector_probe/**'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install exact Transformers.js
        run: npm install --no-save @huggingface/transformers@3.8.1
      - name: Fetch and hash-pin exact E5 files
        shell: bash
        run: |
          set -euo pipefail
          REV='761b726dd34fb83930e26aab4e9ac3899aa1fa78'
          BASE="https://huggingface.co/Xenova/multilingual-e5-small/resolve/$REV"
          ROOT=/tmp/ldc-e5-models/e5
          mkdir -p "$ROOT/onnx"
          curl -fL --retry 3 "$BASE/config.json" -o "$ROOT/config.json"
          curl -fL --retry 3 "$BASE/tokenizer.json" -o "$ROOT/tokenizer.json"
          curl -fL --retry 3 "$BASE/sentencepiece.bpe.model" -o "$ROOT/sentencepiece.bpe.model"
          curl -fL --retry 3 "$BASE/tokenizer_config.json" -o "$ROOT/tokenizer_config.json"
          curl -fL --retry 3 "$BASE/special_tokens_map.json" -o "$ROOT/special_tokens_map.json"
          curl -fL --retry 3 "$BASE/onnx/model_int8.onnx" -o "$ROOT/onnx/model_int8.onnx"
          cat > /tmp/expected.sha256 <<'HASHES'
          cb99455288675345e1a4f411438d5d0adbba5fbd3a67ea4fb03c015433b996c1  /tmp/ldc-e5-models/e5/config.json
          0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39  /tmp/ldc-e5-models/e5/tokenizer.json
          cfc8146abe2a0488e9e2a0c56de7952f7c11ab059eca145a0a727afce0db2865  /tmp/ldc-e5-models/e5/sentencepiece.bpe.model
          a1d6bc8734a6f635dc158508bef000f8e2e5a759c7d92f984b2c86e5ff53425b  /tmp/ldc-e5-models/e5/tokenizer_config.json
          d05497f1da52c5e09554c0cd874037a083e1dc1b9cfd48034d1c717f1afc07a7  /tmp/ldc-e5-models/e5/special_tokens_map.json
          4d24e2bc01a447951524466ef533e52944bf48509e6552810bcee1a2711cb02c  /tmp/ldc-e5-models/e5/onnx/model_int8.onnx
          HASHES
          sha256sum -c /tmp/expected.sha256
      - name: Reproduce protected sample vectors
        run: node tools/ldc_v1422_vector_probe/probe.mjs
