name: Qualify contrast successors Lettres v2.15 and Marie v49
on:
  push:
    branches: [main]
    paths: ['.github/contrast-successors-20261005/TRIGGER']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Bind exact staged candidates and protected parity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:lettres-v2.15-b1-contrast-closure)" = "2e9c48b93ec9a2246615cca00f910a2d4c2d2664"
          test "$(git rev-parse HEAD:marie-v49-test)" = "155347f9adeef1000f45ea57381223024cda0579"
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,re
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          # Protected bytes: exact predecessor parity.
          L0=Path('lettres-v2.14-b1-csp-repair'); L=Path('lettres-v2.15-b1-contrast-closure')
          M0=Path('marie-v48-b3-csp-note-placeholder-closure'); M=Path('marie-v49-test')
          def diff(a,b):
              A={str(p.relative_to(a)):sha(p) for p in a.rglob('*') if p.is_file()}
              B={str(p.relative_to(b)):sha(p) for p in b.rglob('*') if p.is_file()}
              return sorted(k for k in set(A)|set(B) if A.get(k)!=B.get(k))
          assert diff(L0,L)==['index.html','manifest.json','sw.js'],diff(L0,L)
          assert diff(M0,M)==['index.html','sw.js'],diff(M0,M)
          assert sha(L0/'corpus.json')==sha(L/'corpus.json')
          for p in ['corpus/days.json','corpus/manifest.json','corpus/migrations-v1.0.0-to-v1.0.1.json']:
              assert sha(M0/p)==sha(M/p),p
          # CSP exact final-byte binding and version coherence.
          for root,ver,sc,st in [(L,'2.15',1,2),(M,'49',3,1)]:
              idx=(root/'index.html').read_text(encoding='utf-8')
              csp=re.search(r'Content-Security-Policy" content="([^"]+)"',idx).group(1)
              scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',idx,re.I)]
              styles=re.findall(r'<style[^>]*>([\s\S]*?)</style>',idx,re.I)
              tok=lambda x:"'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'"
              assert len(scripts)==sc and len(styles)==st,(root,len(scripts),len(styles))
              assert all(tok(x) in csp for x in scripts+styles),root
          li=(L/'index.html').read_text(); lm=json.loads((L/'manifest.json').read_text()); ls=(L/'sw.js').read_text()
          assert "const APP_VERSION = '2.15';" in li and lm['version']=='2.15' and lm['release_id']=='lettres-v2.15-b1-contrast-closure'
          assert 'shell-v2.15-b1' in ls and 'corpus-v2.15-b1' in ls
          mi=(M/'index.html').read_text(); ms=(M/'sw.js').read_text()
          assert "const APP_VERSION = '49';" in mi and "const VERSION = '49';" in ms
          # Exact repair boundary assertions.
          assert '.export-btn.primary{background:#1A2A4A;border-color:#1A2A4A;color:var(--gold);}' in li
          assert '.li-read{opacity:1;color:var(--muted);}' in li
          assert '.path-letter-item.done{opacity:1;}' in li
          assert 'rgba(255,255,255,.60)' in li and 'rgba(255,255,255,.65)' in li
          assert mi.count('--danger:#E6655A')==2
          assert '.hero-read-btn:hover { background: var(--primary-action-hover-bg); }' in mi
          assert '.modal-btn-save:hover { background: var(--primary-action-hover-bg); }' in mi
          assert '[data-theme="dark"] #wnav-dark { opacity: 1; }' in mi
          assert 'color: rgba(255,255,255,0.65);' in mi
          print('STATIC_PARITY_CSP_REPAIR_BOUNDARY_PASS')
          PY
          node --check lettres-v2.15-b1-contrast-closure/sw.js
          node --check marie-v49-test/sw.js

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install browser runtimes
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
          npm install --no-save playwright@1.55.0 axe-core@4.10.3
          npx playwright install chromium webkit

      - name: Wait for public Pages exact bytes
        run: |
          python3 - <<'PY'
          import hashlib,time,urllib.request
          pairs=[
            ('lettres-v2.15-b1-contrast-closure/index.html','https://louisriv26.github.io/App-Test/lettres-v2.15-b1-contrast-closure/index.html?bind=20261005'),
            ('marie-v49-test/index.html','https://louisriv26.github.io/App-Test/marie-v49-test/index.html?bind=20261005')
          ]
          for local,url in pairs:
              want=hashlib.sha256(open(local,'rb').read()).hexdigest()
              for i in range(90):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'APP-GOV-contrast-successor'})
                      data=urllib.request.urlopen(req,timeout=20).read()
                      if hashlib.sha256(data).hexdigest()==want:
                          print('PUBLIC_EXACT_READY',local,want);break
                  except Exception as e: print('wait',local,i,repr(e),flush=True)
                  time.sleep(4)
              else: raise SystemExit('public exact-byte bind failed '+local)
          PY

      - name: Start local exact-tree servers
        run: |
          python3 -m http.server 8120 --bind 127.0.0.1 >/tmp/l215.log 2>&1 &
          python3 -m http.server 8096 --bind 127.0.0.1 >/tmp/l215stable.log 2>&1 &
          python3 -m http.server 8097 --bind 127.0.0.1 >/tmp/l215state.log 2>&1 &
          rm -rf /tmp/lettres-v215-fresh-scope /tmp/lettres-v215-live-scope
          python3 -m http.server 8132 --directory /tmp --bind 127.0.0.1 >/tmp/l215upgrade.log 2>&1 &
          python3 -m http.server 8133 --directory /tmp --bind 127.0.0.1 >/tmp/l215liveupgrade.log 2>&1 &
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/m49.log 2>&1 &
          python3 -m http.server 8081 --bind 127.0.0.1 >/tmp/m49upgrade.log 2>&1 &
          sleep 3

      - name: Adapt existing Lettres v2.14 harnesses to exact v2.15
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def successorize(s, require_csp=False):
              s=s.replace('lettres-v2.14-b1-csp-repair','lettres-v2.15-b1-contrast-closure')
              s=s.replace('92530b7219fae7940be525b73b92d0a3782451ac','2e9c48b93ec9a2246615cca00f910a2d4c2d2664')
              s=s.replace('LETTRES_V2_14','LETTRES_V2_15').replace('v2.14','v2.15').replace('2.14','2.15')
              lines=s.splitlines()
              out=[]
              found=False
              i=0
              while i < len(lines):
                  if lines[i].startswith('m=re.search(r"script-src-elem'):
                      found=True
                      out.extend([
                          'csp_policy=re.search(r\'Content-Security-Policy" content="([^"]+)"\',index_text).group(1)',
                          'directives={}',
                          'for part in csp_policy.split(";"):',
                          '    bits=part.strip().split()',
                          '    if bits: directives[bits[0]]=bits[1:]',
                          'elem=directives.get("script-src-elem",[])',
                          'hashes=[x for x in elem if x.startswith("\'sha256-")]',
                          'rec("csp:script_src_elem_exact",hashes==[main_hash],{"tokens":elem,"hashes":hashes,"expected":main_hash})',
                      ])
                      i += 2
                      continue
                  out.append(lines[i])
                  i += 1
              if require_csp and not found:
                  raise SystemExit('expected legacy CSP verifier not found in falsification source')
              return '\n'.join(out)+'\n'

          # Complete runtime harness.
          full=Path('qa/lettres_v214_full_current.py').read_text()
          full=successorize(full,False)
          Path('/tmp/lettres_v215_full.py').write_text(full)

          base=Path('qa/lettres_v214_fresh_falsification_20261004.py').read_text()

          # Immediate predecessor: exact v2.14 -> v2.15.
          imm=successorize(base,True)
          imm=imm.replace("PRE=Path('lettres-v2.12-b1-darkmode')","PRE=Path('lettres-v2.14-b1-csp-repair')")
          imm=imm.replace("SCOPE=Path('/tmp/lettres-v214-fresh-scope')","SCOPE=Path('/tmp/lettres-v215-fresh-scope')")
          imm=imm.replace("LOCAL='http://127.0.0.1:8132/index.html'","LOCAL='http://127.0.0.1:8132/lettres-v215-fresh-scope/index.html'")
          imm=imm.replace("ready(pg,'2.12')","ready(pg,'2.14')")
          imm=imm.replace("shell-v2.12-b1","shell-v2.14-b1").replace("corpus-v2.12-b1","corpus-v2.14-b1")
          imm=imm.replace("not any('v2.12-b1'","not any('v2.14-b1'")
          Path('/tmp/lettres_v215_falsify.py').write_text(imm)

          # Real deployed lineage: exact live v2.4 / lettres-r9 -> v2.15.
          live=successorize(base,True)
          live=live.replace("PRE=Path('lettres-v2.12-b1-darkmode')","PRE=Path('lettres-r9')")
          live=live.replace("SCOPE=Path('/tmp/lettres-v214-fresh-scope')","SCOPE=Path('/tmp/lettres-v215-live-scope')")
          live=live.replace("LOCAL='http://127.0.0.1:8132/index.html'","LOCAL='http://127.0.0.1:8133/lettres-v215-live-scope/index.html'")
          live=live.replace("ready(pg,'2.12')","ready(pg,'2.4')")
          live=live.replace("shell-v2.12-b1","shell-v2.4-b1").replace("corpus-v2.12-b1","corpus-v2.4-b1")
          live=live.replace("not any('v2.12-b1'","not any('v2.4-b1'")
          Path('/tmp/lettres_v215_live_falsify.py').write_text(live)

          # Contrast harnesses.
          for src,dst in [
              ('qa-lettres-v214-stateful-contrast-20261004.cjs','/tmp/lettres-v215-stateful.cjs'),
              ('qa-lettres-v214-stable-contrast-20261004.cjs','/tmp/lettres-v215-stable.cjs')]:
              x=Path(src).read_text()
              x=x.replace('lettres-v2.14-b1-csp-repair','lettres-v2.15-b1-contrast-closure')
              x=x.replace('92530b7219fae7940be525b73b92d0a3782451ac','2e9c48b93ec9a2246615cca00f910a2d4c2d2664')
              x=x.replace('LETTRES_V2_14','LETTRES_V2_15').replace('v2.14','v2.15').replace('2.14','2.15')
              Path(dst).write_text(x)
          PY
          node --check /tmp/lettres-v215-stateful.cjs
          node --check /tmp/lettres-v215-stable.cjs

      - name: Lettres complete functional regression
        run: python /tmp/lettres_v215_full.py

      - name: Lettres served-edge falsification and v2.14 to v2.15 update
        run: python /tmp/lettres_v215_falsify.py

      - name: Lettres real-production v2.4 to v2.15 update preservation
        run: python /tmp/lettres_v215_live_falsify.py

      - name: Lettres stateful and steady contrast qualification
        run: |
          NODE_PATH="$PWD/node_modules" node /tmp/lettres-v215-stateful.cjs
          NODE_PATH="$PWD/node_modules" node /tmp/lettres-v215-stable.cjs
          python3 - <<'PY'
          import json
          a=json.load(open('LETTRES_V2_15_STATEFUL_CONTRAST_AUDIT_2026-10-04.json'))
          failures=[]
          for run in a['out']:
              for scene in run['scenes']:
                  for n in scene.get('nodes',[]): failures.append((run['theme'],scene['label'],n.get('target'),n.get('failureSummary')))
          for run in a['out']:
              ex=run['direct'].get('export',{})
              assert ex.get('ratio',0)>=4.5,(run['theme'],ex)
          assert not failures,failures[:20]
          b=json.load(open('LETTRES_V2_15_STABLE_RENDERED_CONTRAST_AUDIT_2026-10-04.json'))
          stable=[(r['viewport'],r['theme'],s['label'],n['target'],n.get('failureSummary')) for r in b['runs'] for s in r['scenes'] for n in s.get('nodes',[])]
          assert not stable,stable[:20]
          print('LETTRES_V215_CONTRAST_ZERO_UNRESOLVED')
          PY

      - name: Adapt and run Marie v49 full, PWA, and blind harnesses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for src,dst in [
            ('qa-marie-v48b3-full.cjs','/tmp/m49-full.cjs'),
            ('qa-marie-v48b3-pwa.cjs','/tmp/m49-pwa.cjs'),
            ('qa-marie-v48b3-final-fresh-blind-20261004.cjs','/tmp/m49-blind.cjs')]:
              s=Path(src).read_text()
              s=s.replace('marie-v48-b3-csp-note-placeholder-closure','marie-v49-test')
              s=s.replace('qa-marie-v48b3-finalblind-package','qa-marie-v49-finalblind-package')
              s=s.replace('MJV_v48_B3','MJV_v49').replace('MJV v48/B3','MJV v49')
              s=s.replace('V48_B3','V49').replace('v48','v49').replace("'48'","'49'")
              s=s.replace('SRC48','SRC49')
              Path(dst).write_text(s)
          PY
          node --check /tmp/m49-full.cjs
          node --check /tmp/m49-pwa.cjs
          node --check /tmp/m49-blind.cjs
          NODE_PATH="$PWD/node_modules" node /tmp/m49-full.cjs
          NODE_PATH="$PWD/node_modules" node /tmp/m49-pwa.cjs
          rm -rf qa-marie-v49-finalblind-package
          cp -a marie-v49-test qa-marie-v49-finalblind-package
          python3 -m http.server 8092 --bind 127.0.0.1 >/tmp/m49blind.log 2>&1 &
          sleep 2
          NODE_PATH="$PWD/node_modules" node /tmp/m49-blind.cjs

      - name: Marie v49 targeted rendered contrast challenge
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          function rgba(s){const m=s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null}
          function lum(c){return c.slice(0,3).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
          function contrast(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)}
          function composite(f,b){return [0,1,2].map(i=>f[i]*f[3]+b[i]*(1-f[3]))}
          async function ready(p){await p.waitForFunction(()=>typeof APP_VERSION!=='undefined'&&APP_VERSION==='49'&&State?.corpus?.length===37&&!document.getElementById('screen-loading').classList.contains('active'),null,{timeout:30000})}
          async function eff(p,sel,bgSel){
            return await p.evaluate(({sel,bgSel})=>{const e=document.querySelector(sel),b=document.querySelector(bgSel)||e.parentElement,cs=getComputedStyle(e),bs=getComputedStyle(b);return {color:cs.color,bg:cs.backgroundColor,opacity:cs.opacity,parentBg:bs.backgroundColor}}, {sel,bgSel});
          }
          (async()=>{
            const b=await chromium.launch({headless:true});
            const results=[];
            // Mobile dark theme control.
            let c=await b.newContext({viewport:{width:390,height:844},colorScheme:'dark'});
            await c.addInitScript(()=>{localStorage.setItem('mjv_onboarded','1');localStorage.setItem('mjv_theme','dark')});
            let p=await c.newPage();await p.goto('http://127.0.0.1:8080/marie-v49-test/',{waitUntil:'domcontentloaded'});await ready(p);
            const t=await eff(p,'#dark-toggle-btn','.topbar'); if(+t.opacity<.999)throw new Error('theme opacity '+JSON.stringify(t)); results.push({theme:t});
            // Hero hover.
            await p.locator('.cal-cell[data-day="1"]').click();await p.waitForFunction(()=>document.getElementById('screen-reader').classList.contains('active'));
            await p.locator('.hero-read-btn').first().hover().catch(()=>{});
            await p.evaluate(()=>App.goHome());await p.waitForTimeout(150);
            const hero=p.locator('.hero-read-btn').first();await hero.hover();const hc=await hero.evaluate(e=>({c:getComputedStyle(e).color,b:getComputedStyle(e).backgroundColor}));
            const hr=contrast(rgba(hc.c),rgba(hc.b));if(hr<4.5)throw new Error('hero hover contrast '+hr);results.push({heroHover:hr});
            // Note modal save hover.
            await p.locator('.cal-cell[data-day="1"]').click();await p.waitForFunction(()=>document.getElementById('screen-reader').classList.contains('active'));
            const para=p.locator('#reader-body p[data-pid]').first();await para.hover();await p.locator('#reader-body .para-note-btn').first().click();const save=p.locator('#note-modal .modal-btn-save');await save.hover();const sc=await save.evaluate(e=>({c:getComputedStyle(e).color,b:getComputedStyle(e).backgroundColor}));
            const sr=contrast(rgba(sc.c),rgba(sc.b));if(sr<4.5)throw new Error('save hover contrast '+sr);results.push({saveHover:sr});
            await c.close();
            // Wide version badge in both themes.
            for(const theme of ['light','dark']){
              c=await b.newContext({viewport:{width:820,height:1180},colorScheme:theme});
              await c.addInitScript(t=>{localStorage.setItem('mjv_onboarded','1');localStorage.setItem('mjv_theme',t)},theme);
              p=await c.newPage();await p.goto('http://127.0.0.1:8080/marie-v49-test/',{waitUntil:'domcontentloaded'});await ready(p);
              const x=await p.locator('#desktop-version').evaluate(e=>{const cs=getComputedStyle(e),p=getComputedStyle(e.parentElement);return {c:cs.color,b:p.backgroundColor}});
              const fg=rgba(x.c),bg=rgba(x.b);const er=contrast(fg[3]<1?[...composite(fg,bg),1]:fg,bg);if(er<4.5)throw new Error('badge '+theme+' '+er+' '+JSON.stringify(x));results.push({badge:theme,ratio:er});
              await c.close();
            }
            await b.close();require('fs').writeFileSync('MJV_v49_TARGETED_CONTRAST.json',JSON.stringify({status:'PASS',results},null,2));console.log('MARIE_V49_TARGETED_CONTRAST_PASS',JSON.stringify(results));
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
          python3 - <<'PY'
          # Static token check for all dark danger consumers on both dark surfaces.
          def lum(h):
              rgb=[int(h[i:i+2],16)/255 for i in (1,3,5)]
              a=[c/12.92 if c<=.04045 else ((c+.055)/1.055)**2.4 for c in rgb]
              return .2126*a[0]+.7152*a[1]+.0722*a[2]
          def cr(a,b):
              x,y=lum(a),lum(b);return (max(x,y)+.05)/(min(x,y)+.05)
          assert cr('#E6655A','#1A1720')>=4.5
          assert cr('#E6655A','#201C2C')>=4.5
          print('MARIE_V49_DANGER_TOKEN_PASS',cr('#E6655A','#1A1720'),cr('#E6655A','#201C2C'))
          PY

      - name: Deterministic successor packages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,os
          for src,name in [
            (Path('lettres-v2.15-b1-contrast-closure'),'LETTRES_v2.15.zip'),
            (Path('marie-v49-test'),'MJV_v49.zip')]:
              out=Path('/tmp')/name
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(x for x in src.rglob('*') if x.is_file()):
                      zi=zipfile.ZipInfo(p.relative_to(src).as_posix(),(1980,1,1,0,0,0))
                      zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16
                      z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
              sha=hashlib.sha256(out.read_bytes()).hexdigest()
              txt=out.with_name(out.stem+'_SHA256.txt');txt.write_text(f'{sha}  {name}\n')
              print('PACKAGE',name,sha,out.stat().st_size)
          PY
          unzip -t /tmp/LETTRES_v2.15.zip
          unzip -t /tmp/MJV_v49.zip

      - name: Upload qualification evidence and exact packages
        uses: actions/upload-artifact@v4
        with:
          name: contrast-successors-20261005
          path: |
            /tmp/LETTRES_v2.15.zip
            /tmp/LETTRES_v2.15_SHA256.txt
            /tmp/MJV_v49.zip
            /tmp/MJV_v49_SHA256.txt
            LETTRES_V2_15_STATEFUL_CONTRAST_AUDIT_2026-10-04.json
            LETTRES_V2_15_STABLE_RENDERED_CONTRAST_AUDIT_2026-10-04.json
            MJV_v49*.json
          if-no-files-found: error