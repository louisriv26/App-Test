name: LDC 142.18 R7 inspect exact ZIP nested origin QA workflow status
on:
  push:
    branches: [ldc-v142-18-reader-semantic-integration-wip-20261008]
    paths: ['.github/workflows/ldc-v14218-inspect-nested-status.yml']
permissions: {contents: write, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect nested ZIP QA job and step statuses from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          base='https://api.github.com/repos/louisriv26/App-Test'
          def get(q):
           req=urllib.request.Request(base+q,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'LDC-R7-nested-test-diagnostics','X-GitHub-Api-Version':'2022-11-28'})
           with urllib.request.urlopen(req,timeout=45) as f:return json.load(f)
          out={'schema':'ldc-v14218-r7-nested-qa-workflow-diagnostic-v1','status':'DIAGNOSTICS_ONLY_NOT_A_QA_PASS','deploy_authority':'NONE','runs':[]}
          for w in get('/actions/workflows/ldc-v14218-exact-zip-nested-origin-qa.yml/runs?per_page=8&branch=ldc-v142-18-reader-semantic-integration-wip-20261008').get('workflow_runs',[])[:8]:
           item={'id':w['id'],'head_sha':w['head_sha'],'status':w['status'],'conclusion':w.get('conclusion'),'html_url':w.get('html_url'),'steps':[]}
           for job in get('/actions/runs/'+str(w['id'])+'/jobs?per_page=25').get('jobs',[]):
            item['steps']+=[{'job':job.get('name'),'name':st.get('name'),'status':st.get('status'),'conclusion':st.get('conclusion')} for st in job.get('steps',[])]
           out['runs'].append(item)
          pathlib.Path('LDC_v142.18_R7_NESTED_WORKFLOW_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Preserve diagnostic separately from application
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add LDC_v142.18_R7_NESTED_WORKFLOW_DIAGNOSTIC.json
          git commit -m 'ci(ldc): record nested frozen ZIP workflow status and failing steps, no app changes'
          git pull --rebase origin ldc-v142-18-reader-semantic-integration-wip-20261008
          git push origin HEAD:ldc-v142-18-reader-semantic-integration-wip-20261008
