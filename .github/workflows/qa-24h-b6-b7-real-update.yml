name: 24H B6 to B7 real update audit
on:
  push:
    branches: [main]
    paths: ['.github/24h-b6-b7-real/TRIGGER']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind immutable B6 and B7
        run: |
          test "$(git rev-parse HEAD:24h-v120-b6-darkmode)" = "d16b05961a5efedd63669433f8ed0947582f6f80"
          test "$(git rev-parse HEAD:24h-v120-b7-darkmode)" = "ffa6ae0129a39d9802fce6ec5b5b1967da1efc5f"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p qa-24h-b6-b7-real
          python3 -m http.server 8094 --bind 127.0.0.1 --directory qa-24h-b6-b7-real >/tmp/b6-b7-real.log 2>&1 &
          sleep 2
      - run: node qa-24h-b6-b7-real-update-20261003.cjs
