name: Diagnose 24H runtime readiness
on:
  push:
    branches: [main]
    paths: ['.github/24h-runtime-diagnostic/TRIGGER']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind trees
        run: |
          test "$(git rev-parse HEAD:24h-v120-b4-darkmode)" = "fa26ec9bf92f9d5ff8551113ad43d26fda45168e"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - run: node diagnose-24h-runtime.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: 24h-runtime-diagnostic
          path: 24h-runtime-diagnostic.json
