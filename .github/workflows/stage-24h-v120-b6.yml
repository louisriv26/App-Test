name: Stage 24H v120 B6 adversarial runtime closure
on:
  push:
    branches: [main]
    paths: ['.github/24h-v120-b6-stage/TRIGGER']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind failed B5
        run: test "$(git rev-parse HEAD:24h-v120-b5-adversarial)" = "e5bba58721351f15664eac060af11c2180a06b38"
      - run: python3 .github/scripts/stage_24h_v120_b6.py
      - name: Syntax checks before commit
        run: |
          node --check 24h-v120-b6-adversarial/sw.js
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('24h-v120-b6-adversarial/index.html').read_text()
          b=re.search(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I).group(1)
          pathlib.Path('/tmp/24h-b6-inline.js').write_text(b)
          PY
          node --check /tmp/24h-b6-inline.js
      - name: Commit immutable B6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 24h-v120-b6-adversarial
          git commit -m "Stage 24H v120 B6 adversarial runtime closure"
          git push
