name: LDC v142.18 locate verified private WIP build artifact, no deployment
on:
  push:
    branches:
      - ldc-v142-18-reader-semantic-integration-wip-20261008
    paths:
      - '.github/workflows/ldc-v14218-artifact-locator.yml'
permissions:
  contents: write
  actions: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read exact audited ZIP identity from committed candidate evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,datetime,pathlib
          p=json.loads(pathlib.Path('LDC_v142.18_CURATED_WIP_PACKAGE_AUDIT.json').read_text())
          assert p['status']=='PASS_PACKAGE_INTEGRITY_ONLY_NOT_RELEASE_AUTHORITY'
          assert p['zip_sha256']=='954085cc54cbc401d49512811276b5c633c72b9f48e8963881792f176b20d7eb'
          repo='louisriv26/App-Test'
          name='ldc-14218-curated-WIP-APP-NEVER-DEPLOY-WITHOUT-AUTHORITY'
          url='https://api.github.com/repos/'+repo+'/actions/artifacts?per_page=100'
          request=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28','User-Agent':'LDC-WIP-artifact-locator'})
          with urllib.request.urlopen(request,timeout=35) as resp: data=json.load(resp)
          hits=[x for x in data.get('artifacts',[]) if x.get('name')==name
            and not x.get('expired',False) and (x.get('workflow_run') or {}).get('head_branch')=='ldc-v142-18-reader-semantic-integration-wip-20261008']
          if not hits:raise SystemExit('No verified GitHub Actions artifact yet; do not fabricate a download URL.')
          hits.sort(key=lambda x:x.get('created_at',''),reverse=True)
          a=hits[0];run=(a.get('workflow_run') or {}).get('id')
          assert isinstance(run,int) and isinstance(a['id'],int)
          result={'schema':'ldc-v14218-wip-gh-actions-artifact-locator-v1',
            'package_sha256':p['zip_sha256'],'package_bytes':p['zip_size_bytes'],
            'package_member_count':p['file_count_excluding_manifest']+1,
            'artifact_id':a['id'],'run_id':run,'artifact_name':name,'artifact_size_bytes':a['size_in_bytes'],
            'expires_at':a.get('expires_at'),
            'workflow_run_url':f'https://github.com/{repo}/actions/runs/{run}',
            'ui_artifact_url':f'https://github.com/{repo}/actions/runs/{run}/artifacts/{a["id"]}',
            'source_committed_sha':p['tested_git_commit'],
            'origin':'GitHub Actions generated ZIP, not hosted app, no GitHub Pages changes',
            'status':'LOCATED_WIP_ARTIFACT_NOT_DEPLOYMENT_AUTHORITY','app_test_deployment_authority':'NONE','production_deployment_authority':'NONE'}
          pathlib.Path('LDC_v142.18_CURATED_WIP_ARTIFACT_LOCATOR.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Commit locator only on WIP with no source changes
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add LDC_v142.18_CURATED_WIP_ARTIFACT_LOCATOR.json
          git commit -m "build(ldc): record auditable GitHub Actions WIP ZIP artifact locator, not release"
          git pull --rebase origin ldc-v142-18-reader-semantic-integration-wip-20261008
          git push origin HEAD:ldc-v142-18-reader-semantic-integration-wip-20261008
