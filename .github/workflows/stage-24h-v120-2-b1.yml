name: Stage exact 24H v120.2 B1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage-24h-v120-2-b1.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify exact candidate
        run: python3 .github/stage_24h_v1202.py
      - name: Commit frozen App-Test candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/stage_24h_v1202.py
          rm -f .github/24h_v1202_patch.part*.b64
          rm -f .github/workflows/stage-24h-v120-2-b1.yml
          git add 24h-v120-2-b1-core-loop-closure qualification-24h-v120-2-b1 .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage exact 24H v120.2 B1 core-loop candidate"
          git push origin HEAD:main
