name: Blind adversarial 24H v120 B5
on:
  push:
    branches: [main]
    paths: ['.github/24h-v120-b5-blind/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact immutable candidate
        run: |
          test "$(git rev-parse HEAD:24h-v120-b5-blind-adversarial-closure)" = "c4dabd454875b73fd004b9d5a609df2bf3be2503"
          test "$(git rev-parse HEAD:24h-v120-b4-darkmode)" = "fa26ec9bf92f9d5ff8551113ad43d26fda45168e"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - name: Syntax-check audit harness
        run: node --check audit-24h-v120-b5-blind.cjs
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/24h-b5-blind-http.log 2>&1 &
          sleep 2
      - name: Execute independent blind campaign
        run: node audit-24h-v120-b5-blind.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 24h-v120-b5-blind-evidence
          path: 24h-v120-b5-blind-evidence/
          if-no-files-found: warn
