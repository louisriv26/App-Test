name: Sync LDC v129 B1 Wave-1 exact test deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ldc-v129-b1-wave1.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App-Test
        uses: actions/checkout@v4

      - name: Fetch exact LDC candidate
        run: |
          rm -rf /tmp/ldc-v129-b1-wave1
          git clone --depth 1 --branch candidate-v129-b1-wave1 https://github.com/louisriv26/Le-livre-du-Ciel---Github.git /tmp/ldc-v129-b1-wave1
          test "$(git -C /tmp/ldc-v129-b1-wave1 rev-parse HEAD)" = "bca9a70c4f3ca79c5a1bdac83e9cb76b421d98e7"
          rm -rf ldc-v129-b1-wave1
          mkdir -p ldc-v129-b1-wave1
          cp -a /tmp/ldc-v129-b1-wave1/. ldc-v129-b1-wave1/
          rm -rf ldc-v129-b1-wave1/.git

      - name: Verify exact candidate markers
        run: |
          grep -q "const APP_VERSION = '129'" ldc-v129-b1-wave1/index.html
          grep -q "const PUBLIC_VERSION = '129'" ldc-v129-b1-wave1/index.html
          grep -q "ldc-v129-b1" ldc-v129-b1-wave1/sw.js
          ! grep -qi "LAB interne" ldc-v129-b1-wave1/index.html
          ! grep -qi "laboratoire" ldc-v129-b1-wave1/index.html
          ! grep -qi "abstention" ldc-v129-b1-wave1/index.html
          test "$(find ldc-v129-b1-wave1/corpus -maxdepth 1 -type f | wc -l)" -ge 200

      - name: Write external deployment receipt
        run: |
          mkdir -p qa/wave1-deploy-receipts
          printf '%s\n' "repo=louisriv26/Le-livre-du-Ciel---Github" "branch=candidate-v129-b1-wave1" "commit=bca9a70c4f3ca79c5a1bdac83e9cb76b421d98e7" "target=ldc-v129-b1-wave1" > qa/wave1-deploy-receipts/ldc-v129-b1-wave1.txt

      - name: Commit isolated test deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898276+github-actions[bot]@users.noreply.github.com"
          git add ldc-v129-b1-wave1 qa/wave1-deploy-receipts/ldc-v129-b1-wave1.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync exact LDC v129 B1 Wave-1 test deployment [skip ci]"
          git push
