name: Independent blind challenge Marie v48 B3 packaged release
on:
  push:
    branches: [main]
    paths: ['.github/marie-v48b3-final-blind/TRIGGER']
permissions:
  contents: read
jobs:
  blind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact frozen B3 and unpack exact release ZIP
        run: |
          set -euo pipefail
          test "$(git rev-parse b8c61859a6d66f570577e70e82b2444d72ff27dc:marie-v48-b3-csp-note-placeholder-closure)" = "197600dc9ad6c2b722e0b1f3f0120b3757b2af36"
          echo "974fa966ed9f215812c7eb03248edbe32a80d7459069a2d326556fa572d58e0b  MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE.zip" | sha256sum -c -
          rm -rf _blind_marie_v48_b3
          mkdir _blind_marie_v48_b3
          unzip -q MJV_v48_B3_CSP_NOTE_PLACEHOLDER_RELEASE.zip -d _blind_marie_v48_b3
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re
          a=Path('marie-v48-b3-csp-note-placeholder-closure')
          b=Path('_blind_marie_v48_b3')
          def H(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          A,B=H(a),H(b)
          assert A==B,(set(A)^set(B),[(k,A.get(k),B.get(k)) for k in A if A.get(k)!=B.get(k)][:5])
          assert B['index.html']=='db36f50e6bb527a1f890f5359d7d60e5c16fc019f81c1b5119ecd77f4b3bedf2'
          assert B['sw.js']=='968c4bde3aecf07f5fc27a0ad91e28ea845180aae0ccf80f7282f17434d2d2be'
          s=(b/'index.html').read_text(encoding='utf-8')
          csp=re.search(r'Content-Security-Policy" content="([^"]+)"',s).group(1)
          scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',s,re.I)]
          styles=re.findall(r'<style[^>]*>([\s\S]*?)</style>',s,re.I)
          tok=lambda x:"'sha256-"+base64.b64encode(hashlib.sha256(x.encode()).digest()).decode()+"'"
          assert len(scripts)==3 and len(styles)==1 and all(tok(x) in csp for x in scripts+styles)
          assert "const APP_VERSION = '48';" in s
          assert s.count('.search-input::placeholder { color: var(--muted); }')==1
          assert s.count('.note-textarea::placeholder { color: var(--muted); }')==1
          assert "const VERSION = '48';" in (b/'sw.js').read_text()
          print('BLIND_STATIC_PACKAGE_PASS',len(B),B['index.html'],B['sw.js'])
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install independent browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve unpacked release package
        run: |
          python3 -m http.server 8082 --bind 127.0.0.1 >/tmp/marie-blind-http.log 2>&1 &
          sleep 2
      - name: Independent blind falsification matrix and packaged PWA update
        run: node blind-marie-v48b3-final.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: MJV-v48-B3-final-independent-blind-evidence
          path: MJV_v48_B3_FINAL_INDEPENDENT_BLIND_EVIDENCE.json
          if-no-files-found: error
