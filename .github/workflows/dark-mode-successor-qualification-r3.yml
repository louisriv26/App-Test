name: Exact dark-mode successor qualification R3
on:
  push:
    branches: [main]
    paths:
      - '.github/dark-mode-successor-qualification-r3/TRIGGER'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact trees
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
          test "$(git rev-parse HEAD:24h-v120-b3-darkmode)" = "0a0b1601b9a260be783f94e9e64aefdd77c783b5"
          test "$(git rev-parse HEAD:ldc-v135-r8-governed-r7)" = "ba58aff745cbb016ff465566e86d7a36eac9351d"
          test "$(git rev-parse HEAD:ldc-v136-r9-darkmode)" = "c8a300b6167f015c4895572c900d989ff63bd386"
          test "$(git rev-parse HEAD:lettres-v2.10-b1-prephysical)" = "1197deef9b1c6bc81f45bd4d9395fe04f894056b"
          test "$(git rev-parse HEAD:lettres-v2.11-b1-darkmode)" = "35583b2234baaec5c43e7c2e08dc19b8e473d9d8"
          test "$(git rev-parse HEAD:marie-v46)" = "48c094e18494e65a45659ef16ead69f40d2c0b42"
          test "$(git rev-parse HEAD:marie-v47-b1-darkmode)" = "81acbb9f409c7c0e1695b0ab35f33dfdc4978631"
      - name: Exact changed-file boundary and protected parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          pairs=[
           ('24h-v119-b1-governed-r4','24h-v120-b3-darkmode',{'index.html','luisa_24_heures.html','manifest.json','sw.js','version.json'}),
           ('ldc-v135-r8-governed-r7','ldc-v136-r9-darkmode',{'index.html','offline_manifest.json','sw.js','version.json'}),
           ('lettres-v2.10-b1-prephysical','lettres-v2.11-b1-darkmode',{'index.html','manifest.json','sw.js'}),
           ('marie-v46','marie-v47-b1-darkmode',{'index.html','sw.js'})]
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          for a,b,allowed in pairs:
           A=Path(a);B=Path(b)
           fa={str(p.relative_to(A)):sha(p) for p in A.rglob('*') if p.is_file()}
           fb={str(p.relative_to(B)):sha(p) for p in B.rglob('*') if p.is_file()}
           ch={k for k in set(fa)|set(fb) if fa.get(k)!=fb.get(k)}
           assert ch==allowed,(a,b,ch)
          for sub,a,b in [('corpus','ldc-v135-r8-governed-r7','ldc-v136-r9-darkmode'),('corpus','marie-v46','marie-v47-b1-darkmode')]:
           A=Path(a)/sub;B=Path(b)/sub
           for p in A.rglob('*'):
            if p.is_file():
             q=B/p.relative_to(A);assert q.exists() and sha(p)==sha(q),(p,q)
          assert sha(Path('lettres-v2.10-b1-prephysical/corpus.json'))==sha(Path('lettres-v2.11-b1-darkmode/corpus.json'))
          print('BOUNDARY_PARITY_PASS')
          PY
      - name: Static integrity and CSP
        run: |
          node --check 24h-v120-b3-darkmode/sw.js
          node --check ldc-v136-r9-darkmode/sw.js
          node --check lettres-v2.11-b1-darkmode/sw.js
          node --check marie-v47-b1-darkmode/sw.js
          python3 - <<'PY'
          import re,hashlib,base64,json
          s=open('24h-v120-b3-darkmode/index.html',encoding='utf-8').read()
          m=re.search(r'<style id="dark-mode-contrast-closure-v120">(.*?)</style>',s,re.S);assert m
          tok="'sha256-"+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode()+"'"
          csp=re.search(r'Content-Security-Policy" content="([^"]+)"',s).group(1)
          assert tok in csp.split('style-src-elem',1)[1].split(';',1)[0]
          assert '.stage6m-home-action .d{color:var(--ink3)}' in s
          for p in ['24h-v120-b3-darkmode/manifest.json','24h-v120-b3-darkmode/version.json','ldc-v136-r9-darkmode/offline_manifest.json','ldc-v136-r9-darkmode/version.json','lettres-v2.11-b1-darkmode/manifest.json','marie-v47-b1-darkmode/manifest.json']: json.load(open(p,encoding='utf-8'))
          print('STATIC_CSP_PASS')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact-byte origin
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Rendered dark-mode qualification
        run: node dark-mode-successor-qualification-r3.cjs
      - name: Changed-surface focus and forced colours
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});
          const cases=[['24H','24h-v120-b3-darkmode','.onboarding-primary'],['LDC','ldc-v136-r9-darkmode','.btn-primary'],['Lettres','lettres-v2.11-b1-darkmode','.help-topic-select'],['Marie','marie-v47-b1-darkmode','.backup-btn.primary']];
          for(const [name,path,sel] of cases){const c=await b.newContext({colorScheme:'dark',forcedColors:'active',viewport:{width:900,height:700}});const p=await c.newPage();await p.goto('http://127.0.0.1:8080/'+path+'/',{waitUntil:'domcontentloaded'});await p.evaluate(()=>document.documentElement.setAttribute('data-theme','dark'));let loc=p.locator(sel).first();if(!(await loc.count())){await p.evaluate(({sel})=>{let e=sel.includes('select')?document.createElement('select'):document.createElement('button');e.className=sel.replaceAll('.',' ').trim();e.id='qa-forced';if(e.tagName==='SELECT')e.innerHTML='<option>Test</option>';else e.textContent='Test';document.body.appendChild(e)},{sel});loc=p.locator('#qa-forced')}await loc.focus();const v=await loc.evaluate(el=>{const s=getComputedStyle(el);return{outline:s.outline,boxShadow:s.boxShadow}});if((!v.outline||v.outline==='none')&&(!v.boxShadow||v.boxShadow==='none'))throw new Error(name+' missing focus indication');console.log(name,'FORCED_COLORS_FOCUS_PASS',JSON.stringify(v));await c.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-mode-successor-qualification-r3-evidence
          path: dark-mode-successor-qualification-r3-results.json
          if-no-files-found: warn
