name: Persistent cold prephysical qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    if: ${{ contains(github.event.head_commit.message, 'Run persistent cold prephysical qualification') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize exact harness
        run: |
          printf '%s' '' | base64 -d > persistent_cold_prephysical.test.cjs
          echo "1a4f005994c220415588a84a7697a5f39bbff397f34d803d565634d5e15fb990  persistent_cold_prephysical.test.cjs" | sha256sum -c -
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute two full browser-process offline reopen cycles
        run: node persistent_cold_prephysical.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-cold-prephysical-evidence
          path: persistent-cold-prephysical-results.json
          if-no-files-found: error
