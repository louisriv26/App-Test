name: Stage exact final prephysical candidates
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[prephysical-staged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch exact frozen source branches
        run: |
          rm -rf /tmp/src24 /tmp/srcldc /tmp/srcletters
          git clone --depth 1 --branch candidate-v119-final-prephysical https://github.com/louisriv26/Les-24-Heures-de-la-Passion.git /tmp/src24
          git clone --depth 1 --branch candidate-v132-final-prephysical https://github.com/louisriv26/Le-livre-du-Ciel---Github.git /tmp/srcldc
          git clone --depth 1 --branch candidate-v2.10-final-prephysical https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/srcletters
      - name: Create new isolated routes
        run: |
          rm -rf 24h-v119-b1-prephysical ldc-v132-b1-prephysical lettres-v2.10-b1-prephysical
          mkdir -p 24h-v119-b1-prephysical ldc-v132-b1-prephysical lettres-v2.10-b1-prephysical
          rsync -a --exclude='.git' --exclude='CANDIDATE_*' /tmp/src24/ 24h-v119-b1-prephysical/
          rsync -a --exclude='.git' /tmp/srcldc/ ldc-v132-b1-prephysical/
          rsync -a --exclude='.git' --exclude='CANDIDATE_*' /tmp/srcletters/ lettres-v2.10-b1-prephysical/
      - name: Prove exact copied file sets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            '24h-v119-b1-prephysical':(15,'31e12ce0f8c42664b876d47af6d0e7992dad6911efbb48b2e16098bbf0e595bf'),
            'ldc-v132-b1-prephysical':(248,'4a344cf965e6883a26c55c06fc44c7e18cfdd1979b9762bb21e44d7601ab61e1'),
            'lettres-v2.10-b1-prephysical':(22,'8079424e082d337a34c367bca37ed73e799e6ed57666559728c891a93467f29d')}
          for route,(count,exp) in expected.items():
              root=Path(route); rows=[]
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rows.append(p.relative_to(root).as_posix()+'\0'+hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
              got=hashlib.sha256(''.join(rows).encode()).hexdigest()
              assert len(rows)==count,(route,len(rows),count)
              assert got==exp,(route,got,exp)
              print(route,len(rows),got)
          PY
      - name: Commit isolated App-Test routes
        run: |
          rm -f .github/workflows/stage-final-prephysical-20260930.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage exact final prephysical candidates [prephysical-staged]"
          git push origin HEAD:main
