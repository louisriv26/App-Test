name: Stage exact LDC v129 prephysical
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  stage:
    if: ${{ contains(github.event.head_commit.message, 'Stage exact LDC v129 prephysical') && !contains(github.event.head_commit.message, '[staged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Reconstruct exact v129 from exact production v128
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ldc-src /tmp/ldc-work /tmp/ldc.patch
          git clone https://github.com/louisriv26/Le-livre-du-Ciel---Github.git /tmp/ldc-src
          git -C /tmp/ldc-src checkout 365d04490411879bdcfa748b3f632dcce88a220c
          mkdir -p /tmp/ldc-work
          rsync -a --exclude='.git' /tmp/ldc-src/ /tmp/ldc-work/
          echo '' | base64 -d | gzip -d > /tmp/ldc.patch
          patch -p1 -d /tmp/ldc-work < /tmp/ldc.patch
      - name: Verify exact v129 aggregate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/ldc-work'); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              rows.append(rel+'\0'+hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          assert len(rows)==248,len(rows)
          got=hashlib.sha256(''.join(rows).encode()).hexdigest()
          want='78c5ddf804435f90a05801d7a39e00d96da5b86ce5aea00a547d8d4dfaeec977'
          assert got==want,(got,want)
          print('exact aggregate',got)
          PY
      - name: Stage isolated route
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ldc-v129-b1-prephysical
          mkdir -p ldc-v129-b1-prephysical
          rsync -a /tmp/ldc-work/ ldc-v129-b1-prephysical/
          rm -f .github/workflows/stage-ldc-v129-prephysical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage exact LDC v129 prephysical [staged]"
          git push origin HEAD:main
