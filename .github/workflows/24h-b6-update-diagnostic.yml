name: 24H B6 focused PWA update diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/24h-b6-update-diagnostic/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact B6
        run: test "$(git rev-parse HEAD:24h-v120-b6-adversarial)" = "cdb60100c7576f99eb678a79f798946bc14f349e"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p qa-upgrade
          python3 -m http.server 8091 --bind 127.0.0.1 --directory qa-upgrade >/tmp/http8091.log 2>&1 &
          sleep 2
      - run: node 24h-b6-update-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 24h-b6-update-diagnostic
          path: 24h-b6-update-diagnostic.json
          if-no-files-found: warn
