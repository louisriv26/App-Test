name: Lettres v2.15 handover qualification
on:
  push:
    branches: [main]
    paths: ['.github/lettres-v215-handover/TRIGGER']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact reconciled candidate
        run: |
          test "$(git rev-parse HEAD:lettres-v2.15-b1-contrast-closure)" = "2e9c48b93ec9a2246615cca00f910a2d4c2d2664"
          test "$(git rev-parse HEAD:lettres-v2.14-b1-csp-repair)" = "92530b7219fae7940be525b73b92d0a3782451ac"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime and Axe
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
          npm install --no-save axe-core@4.10.3
      - name: Start exact local candidate server
        run: |
          python3 -m http.server 8120 --bind 127.0.0.1 >/tmp/lettres215-handover.log 2>&1 &
          sleep 2
      - name: Full current-candidate functional regression
        run: python qa/lettres_v215_handover_full.py
      - name: Full visual contrast matrix
        run: python qa/lettres_v215_handover_contrast.py
      - name: Wait for App-Test edge exact bytes
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time,sys
          local='lettres-v2.15-b1-contrast-closure/manifest.json'
          want=hashlib.sha256(open(local,'rb').read()).hexdigest()
          url='https://louisriv26.github.io/App-Test/lettres-v2.15-b1-contrast-closure/manifest.json?handover=20261005'
          for i in range(90):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
                  data=urllib.request.urlopen(req,timeout=15).read()
                  if hashlib.sha256(data).hexdigest()==want:
                      print('PUBLIC_V215_EXACT_READY',want);sys.exit(0)
              except Exception as e: print('wait',i,repr(e),flush=True)
              time.sleep(4)
          raise SystemExit('public App-Test bytes did not bind to exact candidate')
          PY
      - name: Release integrity, blind challenge and v2.14/v2.4 upgrade preservation
        run: python qa/lettres_v215_handover_release_integrity.py
      - name: Deterministic exact package
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          src=Path('lettres-v2.15-b1-contrast-closure');out=Path('/tmp/LETTRES_v2.15.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in src.rglob('*') if x.is_file()):
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100644 & 0xFFFF)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/LETTRES_v2.15_SHA256.txt').write_text(f'{sha}  LETTRES_v2.15.zip\n')
          print('PACKAGE_SHA256',sha)
          PY
          unzip -t /tmp/LETTRES_v2.15.zip
      - name: Upload exact package and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: lettres-v2.15-handover-qualified
          path: |
            /tmp/LETTRES_v2.15.zip
            /tmp/LETTRES_v2.15_SHA256.txt
            LETTRES_V2_15_CONTRAST_QUALIFICATION_2026-10-05.json
          if-no-files-found: error
