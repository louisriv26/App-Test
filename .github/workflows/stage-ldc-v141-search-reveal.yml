name: Stage exact LDC v141 adaptive Search reveal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v141-search-reveal.yml'

permissions:
  contents: write

concurrency:
  group: ldc-v141-search-reveal-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App-Test
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reproduce and bind exact v141 candidate
        shell: bash
        env:
          PATCH_GZ_B64: ''
        run: |
          set -euo pipefail
          SRC="ldc-v140-r13-search-scroll-repair"
          DST="ldc-v141-r14-search-scroll-adaptive-reveal"
          EXPECTED_SRC_TREE="fa5d57065f328351ae4d7c9fa75c50cd27fadb70"
          EXPECTED_DST_TREE="73cebf29a52e8051bb49b59eb8ec2d7ef5a10386"
          EXPECTED_PATCH_SHA256="0cddf527cecc45405362c917c99ddb2cc401e4457891f94f268c6e9fdde03720"

          test "$(git rev-parse "HEAD:$SRC")" = "$EXPECTED_SRC_TREE"

          rm -rf "$DST"
          cp -a "$SRC" "$DST"

          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/v141.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/v141.patch" | sha256sum -c -
          git apply --check --directory="$DST" /tmp/v141.patch
          git apply --directory="$DST" /tmp/v141.patch

          rm -f .github/workflows/stage-ldc-v141-search-reveal.yml
          rmdir .github/workflows 2>/dev/null || true

          git add -A
          git config user.name "Collection Luisa Release"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Stage exact LDC v141 adaptive Search reveal for physical testing"

          ACTUAL_TREE="$(git rev-parse "HEAD:$DST")"
          test "$ACTUAL_TREE" = "$EXPECTED_DST_TREE"

          git push origin HEAD:main
