name: Blind adversarial 24H v120 B7
on:
  push:
    branches: [main]
    paths: ['.github/24h-blind-adversarial-b7/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blind-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact immutable B7 and governed predecessor trees
        run: |
          test "$(git rev-parse HEAD:24h-v120-b7-darkmode)" = "ffa6ae0129a39d9802fce6ec5b5b1967da1efc5f"
          test "$(git rev-parse HEAD:24h-v119-b1-governed-r4)" = "f8d73f59ee09e302f7b860553adc946702917dfb"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/24h-blind-b7-http.log 2>&1 &
          sleep 2
      - name: Execute strict blind adversarial audit
        run: node audit-24h-v120b7-blind-adversarial.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-adversarial-24h-v120b7-evidence
          path: blind-24h-v120b7-audit/
          if-no-files-found: warn
