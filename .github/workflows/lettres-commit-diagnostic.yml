name: Lettres commit-path diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diag:
    if: ${{ contains(github.event.head_commit.message, 'Run Lettres commit diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize diagnostic
        run: |
          printf '%s' '' | base64 -d > lettres_commit_diagnostic.test.cjs
          echo "7942a02588e30ed7400743aafd0fe121959bdf246d986cf1177d8e4b4ccc8cea  lettres_commit_diagnostic.test.cjs" | sha256sum -c -
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute bounded diagnostics
        run: node lettres_commit_diagnostic.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lettres-commit-diagnostic-evidence
          path: lettres-commit-diagnostic-results.json
          if-no-files-found: error
