name: Stage 24H v120 B8 update activation closure
on:
  push:
    branches: [main]
    paths: ['.github/24h-v120-b8-stage/TRIGGER']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Bind exact failed B6 predecessor
        run: |
          test "$(git rev-parse HEAD:24h-v120-b6-blind-closure)" = "977b1d9c9475988d03aa6debb78cd9370e6e1192"
          test ! -e 24h-v120-b8-update-activation-closure
      - name: Build bounded immutable successor
        run: python3 .github/scripts/stage_24h_v120_b8_update_activation_closure.py
      - name: Static identity and syntax sanity
        run: |
          python3 -m json.tool 24h-v120-b8-update-activation-closure/manifest.json >/dev/null
          python3 -m json.tool 24h-v120-b8-update-activation-closure/version.json >/dev/null
          node --check 24h-v120-b8-update-activation-closure/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('24h-v120-b8-update-activation-closure/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          assert len(blocks)==1
          Path('/tmp/24h-b8-inline.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/24h-b8-inline.js
      - name: Commit staged successor
        run: |
          git config user.name "Collection Luisa QA"
          git config user.email "actions@users.noreply.github.com"
          git add 24h-v120-b8-update-activation-closure
          git commit -m "Stage 24H v120 B8 update activation closure"
          git push origin HEAD:main
          echo "B8_TREE=$(git rev-parse HEAD:24h-v120-b8-update-activation-closure)"
