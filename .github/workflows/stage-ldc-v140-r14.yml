name: Stage exact LDC v140 R14 Search scroll repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-r14.yml'
permissions:
  contents: write
concurrency:
  group: stage-ldc-v140-r14
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact bounded successor
        shell: bash
        run: |
          set -euo pipefail
          SRC="ldc-v139-r12-search-v21a-recert"
          DST="ldc-v140-r14-search-scroll-repair"
          EXPECT_SRC_TREE="b9aaaa762034d9a21398bc8c242c802f59062492"
          EXPECT_DST_TREE="44da8d6b791de04e3115bf1773b3de34fc8a89be"
          test "$(git rev-parse HEAD:$SRC)" = "$EXPECT_SRC_TREE"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          cat > /tmp/v140.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/v140.patch.gz.b64 | gzip -d > /tmp/v140.patch
          (
            cd "$DST"
            patch -p1 --fuzz=0 < /tmp/v140.patch
          )
          python3 - <<'PY'
          import pathlib,hashlib,json
          src=pathlib.Path('ldc-v139-r12-search-v21a-recert')
          dst=pathlib.Path('ldc-v140-r14-search-scroll-repair')
          expected={
            'index.html':'b92713f7975e0cb6cbd44baea6966fdeb9f41c91ae08003ec71650c3a105f362',
            'offline_manifest.json':'1174cd86a44540ca52f1c26c352ff8980118a6de5d74eeddcadf29cab64ca76e',
            'sw.js':'37ced274fb0e4d24dbee6878f6c8040d4393d803294754bc77c04120d5288d33',
            'version.json':'8082b45be6559ffa98587b752fb71755d9b46eeb34924a21afd58c82a700389f',
          }
          def files(root):
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          a,b=files(src),files(dst)
          assert len(a)==248 and len(b)==248,(len(a),len(b))
          changed={p for p in set(a)|set(b) if a.get(p)!=b.get(p)}
          assert changed==set(expected),changed
          for p,h in expected.items(): assert b[p]==h,(p,b[p],h)
          for p in set(a)-set(expected): assert a[p]==b[p],p
          for p in dst.rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          m=json.loads((dst/'offline_manifest.json').read_text(encoding='utf-8'))
          v=json.loads((dst/'version.json').read_text(encoding='utf-8'))
          assert m['app_version']=='v2.19.140-R1B-UX-ACCESS-R14'
          assert m['page_worker_revision']=='ldc-v2.19.140-R1B-ux-access-r14'
          assert v['app_version']=='v2.19.140-R1B-UX-ACCESS-R14'
          assert str(v['public_version'])=='140'
          assert v['page_worker_revision']=='ldc-v2.19.140-R1B-ux-access-r14'
          omsha=hashlib.sha256((dst/'offline_manifest.json').read_bytes()).hexdigest()
          assert v['offline_manifest_sha256']==omsha
          assert len(m['assets'])==m['asset_count']==204
          assert sum(int(x['bytes']) for x in m['assets'])==m['total_bytes']==114483048
          for x in m['assets']:
              q=dst/x['path']; data=q.read_bytes()
              assert len(data)==int(x['bytes']),x['path']
              assert hashlib.sha256(data).hexdigest()==x['sha256'],x['path']
          obj={'assets':[{'bytes':int(x['bytes']),'path':str(x['path']),'sha256':str(x['sha256'])} for x in m['assets']],
               'corpus_generation':m['corpus_generation'],
               'corpus_manifest_sha256':m['corpus_manifest_sha256'],
               'schema':'ldc-offline-content-binding-v2'}
          binding=hashlib.sha256(json.dumps(obj,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert binding==m['content_binding_sha256']=='1fb8d6d8a532806ad6a25b32250091deed174ddb54130f1b05d3da2233a05384'
          print('STATIC_BOUNDARY_PASS',sorted(changed),binding)
          PY
          for f in $(find "$DST" -type f -name '*.js'); do node --check "$f" >/dev/null; done
          git add "$DST"
          got="$(git write-tree --prefix="$DST/")"
          test "$got" = "$EXPECT_DST_TREE"
      - name: Commit staged candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-ldc-v140-r14.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage exact LDC v140 R14 Search scroll repair'
          git push origin HEAD:main
