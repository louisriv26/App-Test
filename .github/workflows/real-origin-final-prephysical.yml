name: Real-origin final prephysical qualification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    if: ${{ contains(github.event.head_commit.message, 'Run final prephysical real-origin qualification') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact served-origin qualification
        run: node real-origin-final-prephysical.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-origin-final-prephysical-evidence
          path: real-origin-final-prephysical-results.json
          if-no-files-found: error
