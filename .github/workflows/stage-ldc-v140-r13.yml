            'current_runtime_browser_validation':'SEE_EXTERNAL_GOVERNANCE_STATE__PACKAGE_DOES_NOT_SELF_ATTEST_PHYSICAL_GATE_RESULTS__EXACT_V140_BYTES_REQUIRE_FRESH_APP_TEST_AND_PHYSICAL_IPHONE_IPAD_TESTING',
