          '    <div style="display:flex;align-items:center;gap:2px;"><button class="btn-icon" type="button" onclick="copySearchLink()" aria-label="Copier le lien de cette recherche" title="Copier le lien"><i class="ti ti-link"></i></button><button class="btn-icon" type="button" onclick="showSizeSheet()" title="Taille du texte" aria-label="Taille du texte"><i class="ti ti-letter-a" aria-hidden="true"></i></button></div>\n  </div>\n  <div class="scroll" id="search-scroll">\n  <div class="search-intent-wrap">','scroll-open')
          s=rep(s,'  <div class="scroll" id="search-results">','  <div id="search-results">','results-flow')
          s=rep(s,'    </div>\n  </div>\n</div>\n\n<!-- MON ESPACE -->','    </div>\n  </div>\n  </div>\n</div>\n\n<!-- MON ESPACE -->','scroll-close')
