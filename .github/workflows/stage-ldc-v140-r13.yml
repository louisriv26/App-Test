name: Stage exact LDC v140 R13 Search scroll repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-r13.yml'
permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC=ldc-v139-r12-search-v21a-recert
          DST=ldc-v140-r13-search-scroll-repair
          test "$(git rev-parse HEAD:$SRC)" = "b9aaaa762034d9a21398bc8c242c802f59062492"
          test -f .github/qa-ldc-v140/v140.patch.b64
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          base64 -d .github/qa-ldc-v140/v140.patch.b64 | gzip -d > /tmp/v140.patch
          (cd "$DST" && patch -p1 --fuzz=0 < /tmp/v140.patch)
          cat >/tmp/v140.sha256 <<'EOF'
          4ffc098d4ce6b4190e4a0e658c42d597aee54249ea1f9c6cb57b8a4e631451b4  ldc-v140-r13-search-scroll-repair/index.html
          1e5985b3f38e36385601d8a56211b45a93f999a20af158f1f409add4aeb4408e  ldc-v140-r13-search-scroll-repair/offline_manifest.json
          ccc938df6908037110be669f9dfb4d0e9bcdcc5fe3351328a3dfcb58b977cbcf  ldc-v140-r13-search-scroll-repair/sw.js
          42e0d313d28e9ade6cbe10401ebf9714499737c451c963ff0b3db9dcbf73e587  ldc-v140-r13-search-scroll-repair/version.json
          EOF
          sed -i 's/^          //' /tmp/v140.sha256
          sha256sum -c /tmp/v140.sha256
          python3 - <<'PY'
          import pathlib,hashlib,json,re,subprocess
          src=pathlib.Path('ldc-v139-r12-search-v21a-recert')
          dst=pathlib.Path('ldc-v140-r13-search-scroll-repair')
          def files(r):
              return {str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in r.rglob('*') if p.is_file()}
          a,b=files(src),files(dst)
          changed={p for p in set(a)|set(b) if a.get(p)!=b.get(p)}
          expected={'index.html','offline_manifest.json','sw.js','version.json'}
          assert len(a)==len(b)==248,(len(a),len(b))
          assert changed==expected,(changed,expected)
          for p in dst.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          m=json.loads((dst/'offline_manifest.json').read_text())
          v=json.loads((dst/'version.json').read_text())
          assert m['app_version']==v['app_version']=='v2.19.140-R1B-UX-ACCESS-R13'
          assert m['page_worker_revision']==v['page_worker_revision']=='ldc-v2.19.140-R1B-ux-access-r13'
          assert v['public_version']=='140'
          assert len(m['assets'])==204 and m['total_bytes']==114483048
          for x in m['assets']:
              p=dst/x['path']; data=p.read_bytes()
              assert len(data)==x['bytes'],x['path']
              assert hashlib.sha256(data).hexdigest()==x['sha256'],x['path']
          obj={
            'assets':[{'bytes':int(x['bytes']),'path':str(x['path']),'sha256':str(x['sha256'])} for x in m['assets']],
            'corpus_generation':m['corpus_generation'],
            'corpus_manifest_sha256':m['corpus_manifest_sha256'],
            'schema':'ldc-offline-content-binding-v2'
          }
          binding=hashlib.sha256(json.dumps(obj,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert binding==m['content_binding_sha256']=='1fb8d6d8a532806ad6a25b32250091deed174ddb54130f1b05d3da2233a05384'
          html=(dst/'index.html').read_text()
          assert '#screen-search{width:100%;overflow:hidden;}' in html
          assert '<div class="scroll" id="search-scroll">' in html
          assert '<div id="search-results">' in html
          assert "runSearch({navigation:'preserve-context'})" in html
          assert "captureScrollContext(searchScrollElement(),'.result-card','data-result-key')" in html
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I))
          pathlib.Path('/tmp/v140-inline.js').write_text(scripts)
          subprocess.run(['node','--check','/tmp/v140-inline.js'],check=True)
          subprocess.run(['node','--check',str(dst/'sw.js')],check=True)
          print('PASS changed=',sorted(changed),'protected=',248-len(changed),'binding=',binding)
          PY

      - name: Commit exact App-Test candidate
        shell: bash
        run: |
          set -euo pipefail
          DST=ldc-v140-r13-search-scroll-repair
          mkdir -p .github/qa-ldc-v140
          cat >.github/qa-ldc-v140/STAGE.json <<'EOF'
          {
            "candidate": "LDC v140/R13",
            "app_version": "v2.19.140-R1B-UX-ACCESS-R13",
            "exact_predecessor_tree": "b9aaaa762034d9a21398bc8c242c802f59062492",
            "exact_predecessor_package_sha256": "3000b8e7692805a7116ac025a8a056b06db2dc6bc6fc12c7acba475bc4e29653",
            "candidate_package_sha256": "20f80debf4b6e8429325757b646d11f094af6c8d6d2612826e0d384280f357ac",
            "changed_files": ["index.html","offline_manifest.json","sw.js","version.json"],
            "protected_files_byte_identical": 244,
            "static_gate": "PASS",
            "physical_iphone_gate": "OPEN",
            "physical_ipad_gate": "OPEN",
            "production_deployment_authority": "NONE"
          }
          EOF
          sed -i 's/^          //' .github/qa-ldc-v140/STAGE.json
          git add "$DST" .github/qa-ldc-v140/STAGE.json
          git rm .github/qa-ldc-v140/v140.patch.b64
          git rm .github/workflows/stage-ldc-v140-r13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage exact LDC v140 R13 Search scroll repair'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify 248 hosted App-Test files
        shell: bash
        run: |
          set -euo pipefail
          DST=ldc-v140-r13-search-scroll-repair
          BASE=https://louisriv26.github.io/App-Test/$DST
          EXP=$(sha256sum "$DST/index.html" | cut -d' ' -f1)
          OK=0
          for i in $(seq 1 72); do
            GOT=$(curl -fsSL "$BASE/index.html?bind=$i" | sha256sum | cut -d' ' -f1 || true)
            if [ "$GOT" = "$EXP" ]; then OK=1; break; fi
            sleep 10
          done
          test "$OK" = 1
          BAD=0; COUNT=0
          while IFS= read -r -d '' f; do
            rel=${f#$DST/}
            exp=$(sha256sum "$f" | cut -d' ' -f1)
            got=$(curl -fsSL "$BASE/$rel?fullbind=140" | sha256sum | cut -d' ' -f1 || true)
            if [ "$exp" != "$got" ]; then echo "MISMATCH $rel"; BAD=$((BAD+1)); fi
            COUNT=$((COUNT+1))
          done < <(find "$DST" -type f -print0)
          test "$COUNT" = 248
          test "$BAD" = 0
          printf '{"candidate":"LDC v140/R13","pages_index_exact":true,"pages_files_checked":%s,"pages_mismatches":%s,"overall":"PASS"}\n' "$COUNT" "$BAD" >/tmp/ldc-v140-pages.json
          cat /tmp/ldc-v140-pages.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldc-v140-stage-pages
          path: /tmp/ldc-v140-pages.json
