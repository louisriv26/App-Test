          s=rep(s,"    case 'screen-search': return {scroller:document.getElementById('search-results'),selector:':scope > *'};","    case 'screen-search': return {scroller:searchScrollElement(),selector:'.result-card',keyAttr:'data-result-key'};",'text-size')
