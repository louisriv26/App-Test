name: Stage exact LDC v140 R13 Search scroll repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-ldc-v140-r13.yml'
permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deterministically reconstruct exact v140 from v139
        shell: bash
        run: |
          set -euo pipefail
          SRC=ldc-v139-r12-search-v21a-recert
          DST=ldc-v140-r13-search-scroll-repair
          test "$(git rev-parse HEAD:$SRC)" = "b9aaaa762034d9a21398bc8c242c802f59062492"
          rm -rf "$DST"
          cp -a "$SRC" "$DST"
          cd "$DST"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re,subprocess

          def rep(s,old,new,label):
              n=s.count(old)
              assert n==1,(label,n)
              return s.replace(old,new,1)

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
