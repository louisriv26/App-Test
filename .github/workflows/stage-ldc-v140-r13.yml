          "const APP_VERSION = 'v2.19.140-R1B-UX-ACCESS-R13'; // v140 bounded Search vertical-scroll and query-state repair over exact deployed v139; corpus/Search payloads and algorithms preserved; Semantic V3 remains fail-closed\nconst PUBLIC_VERSION = (APP_VERSION.match(/v2\\.19\\.(\\d+)/)||[])[1] || '140'; // single authoritative public identity derived from APP_VERSION\nconst APP_VERSION_LABEL = `Version ${PUBLIC_VERSION}`;\nconst APP_BUILD = '2026-10-05';\nconst SW_CACHE_VERSION = 'ldc-v2.19.140-R1B-ux-access-r13';",'identity')
          s=rep(s,"  const input=document.getElementById('search-input');\n  if(input&&shouldAutofocusSearchInput())input.focus({preventScroll:true});","  const input=document.getElementById('search-input');\n  if(input)syncSearchQueryUI(input.value);\n  if(input&&shouldAutofocusSearchInput())input.focus({preventScroll:true});",'go-search')
          s=rep(s,"scroll:captureScrollContext(document.getElementById('search-results'),'.result-card','data-result-key')","scroll:captureScrollContext(searchScrollElement(),'.result-card','data-result-key')",'capture')
          s=rep(s,
          "    document.getElementById('search-input').value=ctx.query||'';showScreen('search');renderSearchIntentMode();renderSearchSourceModeRow();renderSearchOrderRow();renderSpeakerFilterRow();renderVolFilterRow();document.getElementById('search-clear').style.display=ctx.query?'':'none';document.querySelector('.date-nav-entry').style.display=ctx.query?'none':'';\n    if(ctx.query)await runSearch();else await refreshSearchSuggestions();\n    const el=document.getElementById('search-results');restoreScrollContext(el,ctx.scroll,'.result-card','data-result-key');requestAnimationFrame(()=>{if(ctx.focusKey){const c=[...el.querySelectorAll('.result-card')].find(x=>x.dataset.resultKey===ctx.focusKey);if(c){try{c.focus({preventScroll:true});}catch(_){c.focus();}}}});",
          "    document.getElementById('search-input').value=ctx.query||'';showScreen('search');renderSearchIntentMode();renderSearchSourceModeRow();renderSearchOrderRow();renderSpeakerFilterRow();renderVolFilterRow();syncSearchQueryUI(ctx.query||'');\n    if(ctx.query)await runSearch({navigation:'preserve-context'});else {await refreshSearchSuggestions();resetSearchScrollToTop();}\n    const sc=searchScrollElement(),results=document.getElementById('search-results');restoreScrollContext(sc,ctx.scroll,'.result-card','data-result-key');requestAnimationFrame(()=>{if(ctx.focusKey&&results){const c=[...results.querySelectorAll('.result-card')].find(x=>x.dataset.resultKey===ctx.focusKey);if(c){try{c.focus({preventScroll:true});}catch(_){c.focus();}}}});",'restore')
          helpers="""function searchScrollElement(){return document.getElementById('search-scroll');}
          function syncSearchQueryUI(rawQuery){
            const q=String(rawQuery==null?(document.getElementById('search-input')?.value||''):rawQuery).trim();
