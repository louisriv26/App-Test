            const apply=()=>{if(!sc.isConnected||!target.isConnected)return;const sr=sc.getBoundingClientRect(),tr=target.getBoundingClientRect();sc.scrollTop=Math.max(0,sc.scrollTop+(tr.top-sr.top)-8);};
