          v['ux_search_scroll_v140_r13']={"date":"2026-10-05","classification":"BOUNDED_SEARCH_VERTICAL_SCROLL_AND_QUERY_STATE_REPAIR","exact_predecessor_app_version":"v2.19.139-R1B-UX-ACCESS-R12","exact_predecessor_package_sha256":"3000b8e7692805a7116ac025a8a056b06db2dc6bc6fc12c7acba475bc4e29653","exact_predecessor_production_commit":"e82ef8d5d64a7e89b65436924b04883c96c7dadb","exact_predecessor_tree":"b9aaaa762034d9a21398bc8c242c802f59062492","physical_trigger":["iPhone Search results squeezed into a near-zero-height strip and effectively unreadable/unscrollable","iPad landscape Search results similarly trapped at the bottom despite abundant horizontal width"],"root_causes":["Search controls were nonshrinking siblings above #search-results, the only intended vertical scroller","The .scroll contract allowed #search-results min-height:0, so Flexbox could collapse the human-visible results viewport to zero","searchFor() programmatic/recent/theme searches bypassed the typed-input path that hid Parcourir par date"],"repair":["Introduce #search-scroll as the single vertical Search-body scroller below the existing top bar","Make #search-results ordinary flow content and explicitly prevent #screen-search from becoming a competing vertical scroller","Centralize query UI state through syncSearchQueryUI()","Reveal Search output after fresh searches/filter/page changes while suppressing reveal during navigation-context restoration","Rebind Search Reader-return and text-size preservation to #search-scroll with .result-card/data-result-key semantic anchoring"],"protected_surfaces":["all devotional corpus payload bytes","Search-V2/V2.1A manifests, topology, documents, entries, indexes and Jesus-filter payloads","search_engine_v2.js","search_exact_v21.js","search_foundation_v21b.js","search_near_v22.js","search_worker_v2.js","provenance public wording","user-state schemas and semantics","persistent offline content asset set and binding","Semantic Search V3 qualification/fail-closed state"],"persistent_offline_asset_count":204,"offline_content_binding_sha256":"1fb8d6d8a532806ad6a25b32250091deed174ddb54130f1b05d3da2233a05384","mutation_authority":"BOUNDED_TO_SEARCH_SHELL_NAVIGATION_AND_REQUIRED_RELEASE_IDENTITY_METADATA","production_deployment_authority":"NONE","physical_iphone_gate":"OPEN","physical_ipad_gate":"OPEN"}
