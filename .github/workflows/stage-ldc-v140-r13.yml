          o['ux_search_scroll_v140_r13']={"date":"2026-10-05","classification":"BOUNDED_SEARCH_VERTICAL_SCROLL_AND_QUERY_STATE_REPAIR","predecessor_app_version":"v2.19.139-R1B-UX-ACCESS-R12","predecessor_package_sha256":"3000b8e7692805a7116ac025a8a056b06db2dc6bc6fc12c7acba475bc4e29653","predecessor_production_commit":"e82ef8d5d64a7e89b65436924b04883c96c7dadb","predecessor_tree":"b9aaaa762034d9a21398bc8c242c802f59062492","trigger":"OWNER_PHYSICAL_IPHONE_IPAD_EVIDENCE__SEARCH_RESULTS_VIEWPORT_COLLAPSED_TO_NEAR_ZERO_OR_ZERO_HEIGHT","root_cause":"SEARCH_CONTROLS_WERE_NONSHRINKING_SIBLINGS_ABOVE_A_NESTED_SEARCH_RESULTS_SCROLLER_WITH_MIN_HEIGHT_ZERO__FLEXBOX_SACRIFICED_THE_RESULTS_VIEWPORT__PROGRAMMATIC_SEARCHFOR_PATH_ALSO_FAILED_TO_HIDE_DATE_NAVIGATOR","repair":["ONE_SEARCH_BODY_VERTICAL_SCROLL_OWNER_BELOW_TOP_BAR","SEARCH_RESULTS_BECOMES_NORMAL_FLOW_CONTENT","CENTRAL_QUERY_UI_AUTHORITY_FOR_CLEAR_AND_DATE_NAV","FRESH_SEARCH_REVEALS_OUTPUT_REGION","READER_RETURN_AND_TEXT_SIZE_PRESERVE_RESULT_CARD_SEMANTIC_ANCHOR"],"persistent_offline_assets_changed":False,"offline_content_binding_changed":False,"corpus_changed":False,"search_payloads_changed":False,"search_algorithms_changed":False,"provenance_changed":False,"user_state_schema_changed":False,"semantic_v3_changed":False,"physical_iphone_gate":"OPEN","physical_ipad_gate":"OPEN","production_deployment_authority":"NONE"}
          p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

