name: Lettres restore contract fast recheck
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recheck:
    if: ${{ contains(github.event.head_commit.message, 'Run Lettres restore contract fast recheck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize harness
        run: |
          printf '%s' '' | base64 -d > lettres_restore_contract_fast.test.cjs
          echo "18ddb33e27775083c8136dfa6238d427f8f74f3a434cca736821f162c9a37824  lettres_restore_contract_fast.test.cjs" | sha256sum -c -
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute stale-preview fail-closed and fresh-preview restore
        run: node lettres_restore_contract_fast.test.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lettres-restore-contract-fast-evidence
          path: lettres-restore-contract-fast-results.json
          if-no-files-found: error
