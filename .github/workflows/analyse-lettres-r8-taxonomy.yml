name: Analyse Lettres R8 taxonomy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyse-lettres-r8-taxonomy.yml'

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact Lettres R8 R3 candidate
        run: |
          rm -rf /tmp/lettres-r8-r3
          git clone --depth 1 --branch ux-lettres-v2.3-r8-r3 https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/lettres-r8-r3

      - name: Analyse corpus taxonomy
        run: |
          python - <<'PY'
          import json, re
          p='/tmp/lettres-r8-r3/corpus.json'
          d=json.load(open(p,encoding='utf-8'))
          topics=d.get('topics_index') or {}
          result={
            'topic_keys': sorted(topics.keys(), key=str.casefold),
            'topic_counts': {k: len(v) if isinstance(v,list) else None for k,v in topics.items()},
            'abandon_like_topics': {k: (len(v) if isinstance(v,list) else None) for k,v in topics.items() if 'aband' in k.casefold()},
            'letters_with_abandon_text': [],
            'letter_topic_fields': {}
          }
          fields=['topics','topics_fr','themes','theme','tags','topics_display_fr']
          counts={}
          for l in d.get('letters',[]):
            text_parts=[str(l.get(x,'')) for x in ['title_fr','recipient_display_fr','summary_fr','excerpt_fr']]
            if any('aband' in x.casefold() for x in text_parts):
              result['letters_with_abandon_text'].append(l.get('canonical_number'))
            for field in fields:
              val=l.get(field)
              vals=val if isinstance(val,list) else ([val] if isinstance(val,str) else [])
              for x in vals:
                if isinstance(x,str):
                  counts[x]=counts.get(x,0)+1
          result['letter_topic_fields']={k:v for k,v in sorted(counts.items(),key=lambda kv:kv[0].casefold()) if 'aband' in k.casefold()}
          open('lettres-r8-taxonomy-report.json','w',encoding='utf-8').write(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lettres-r8-taxonomy-report.json
          git commit -m "Analyse Lettres R8 filter taxonomy" || exit 0
          git push
