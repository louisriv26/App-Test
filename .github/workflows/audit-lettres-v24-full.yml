name: Lettres v2.4 full adversarial QA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/audit-lettres-v24-full.yml'
      - 'qa/lettres_v24_full_audit.py'

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browsers
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
      - name: Run full adversarial audit against production
        run: python qa/lettres_v24_full_audit.py
