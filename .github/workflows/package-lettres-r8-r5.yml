name: Package Lettres R8 R5 deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-lettres-r8-r5.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging workspace
        uses: actions/checkout@v4

      - name: Clone exact Lettres R8 R5
        run: |
          rm -rf /tmp/lettres-r8-r5
          git clone --depth 1 --branch ux-lettres-v2.3-r8-r5 https://github.com/louisriv26/Les-lettres-de-Luisa.git /tmp/lettres-r8-r5
          cd /tmp/lettres-r8-r5
          test "$(git rev-parse HEAD)" = "6ef7f533f76667283624ca248452e4d01ffcbc03"
          test "$(git rev-parse HEAD^{tree})" = "01c4bbf42b6cb53fd852e0973b5c459b9debd0d0"

      - name: Build exact GitHub deploy ZIP and manifests
        run: |
          mkdir -p out
          cd /tmp/lettres-r8-r5
          git archive --format=zip --output="$GITHUB_WORKSPACE/out/LETTRES_v2.3_R8_R5_GITHUB_DEPLOY.zip" HEAD
          sha256sum "$GITHUB_WORKSPACE/out/LETTRES_v2.3_R8_R5_GITHUB_DEPLOY.zip" | sed 's#  .*/#  #' > "$GITHUB_WORKSPACE/out/LETTRES_v2.3_R8_R5_GITHUB_DEPLOY_SHA256.txt"
          python - <<'PY'
          import csv, hashlib, pathlib, subprocess
          root=pathlib.Path('/tmp/lettres-r8-r5')
          out=pathlib.Path(__import__('os').environ['GITHUB_WORKSPACE'])/'out'
          paths=subprocess.check_output(['git','-C',str(root),'ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
          with (out/'LETTRES_v2.3_R8_R5_PACKAGE_FILE_MANIFEST_SHA256.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['path','bytes','sha256'])
              for p in sorted(paths):
                  b=(root/p).read_bytes()
                  w.writerow([p,len(b),hashlib.sha256(b).hexdigest()])
          with (out/'LETTRES_v2.3_R8_R5_GIT_BLOB_MANIFEST.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['path','git_blob_sha','bytes'])
              lines=subprocess.check_output(['git','-C',str(root),'ls-tree','-r','-l','HEAD'],text=True).splitlines()
              for line in lines:
                  meta,p=line.split('\t',1)
                  mode,typ,sha,size=meta.split()
                  w.writerow([p,sha,size])
          PY

      - name: Verify ZIP
        run: |
          unzip -t out/LETTRES_v2.3_R8_R5_GITHUB_DEPLOY.zip
          test "$(unzip -Z1 out/LETTRES_v2.3_R8_R5_GITHUB_DEPLOY.zip | wc -l)" -eq 22

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: LETTRES_v2.3_R8_R5_GITHUB_DEPLOY_PACKAGE
          path: out/*
          if-no-files-found: error
          retention-days: 30
