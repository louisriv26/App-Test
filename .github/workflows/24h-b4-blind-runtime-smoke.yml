name: 24H B4 blind runtime smoke
on:
  push:
    branches: [main]
    paths: ['.github/24h-b4-blind-runtime/TRIGGER']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bind exact frozen B4 tree
        run: test "$(git rev-parse HEAD:24h-v120-b4-darkmode)" = "fa26ec9bf92f9d5ff8551113ad43d26fda45168e"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Run blind runtime smoke
        run: node 24h-b4-blind-runtime-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 24h-b4-blind-runtime-smoke-evidence
          path: 24h-b4-blind-runtime-smoke.json
          if-no-files-found: warn
